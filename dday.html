<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&display=swap');

  :root {
    color-scheme: light dark;
    --add-bg: #FCE6ED;
    --add-color: #C95B7A;
    --add-hover: #F9D5E1;
    --slot-bg: #FDF7F9;
    --title-color: #B88A97;
    --dday-color: #FF6FA2;
    --dday-today-color: #E59A1C;
    --dday-past-color: #B69AA3;
    --date-color: #B9A5AC;
    --form-bg: #FDF7F9;
    --input-bg: #FFFFFF;
    --input-color: #4A4442;
    --btn-cancel-bg: #F2ECEE;
    --btn-cancel-color: #857B7E;
    --icon-color: #C4AEB5;
    --icon-hover: #FF6FA2;
    --empty-color: #B8A3AA;
    --scroll-thumb: #F2DCE2;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --add-bg: #4A2C37;
      --add-color: #F7A8BE;
      --add-hover: #5C3644;
      --slot-bg: #272225;
      --title-color: #C4A3AE;
      --dday-color: #FF82B0;
      --dday-today-color: #F5C76B;
      --dday-past-color: #968188;
      --date-color: #8F7D83;
      --form-bg: #272225;
      --input-bg: #1E1B1D;
      --input-color: #EAE4E6;
      --btn-cancel-bg: #322C2E;
      --btn-cancel-color: #A89EA1;
      --icon-color: #8A767D;
      --icon-hover: #FF82B0;
      --empty-color: #7D7477;
      --scroll-thumb: #46363C;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent !important;
    background-color: transparent !important;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 0; }

  .d-wrap {
    width: 100%;
    min-width: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .d-head {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
    padding: 2px 44px 0 4px;
    min-height: 22px;
  }

  .sync-btn {
    border: none;
    background: transparent;
    color: var(--icon-color);
    font-size: 12px;
    font-weight: 800;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.15s ease, transform 0.3s ease;
  }
  .sync-btn:hover { color: var(--icon-hover); }
  .sync-btn.spinning { animation: spin 0.7s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .add-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: var(--add-bg);
    color: var(--add-color);
    font-size: 13px;
    font-weight: 800;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .add-btn:hover { background: var(--add-hover); }
  .add-btn:active { transform: scale(0.92); }

  .d-form {
    display: none;
    flex-direction: column;
    gap: 6px;
    background: var(--form-bg);
    border: none;
    border-radius: 14px;
    padding: 9px 10px;
  }
  .d-form.open { display: flex; }

  .d-input {
    width: 100%;
    border: none;
    background: var(--input-bg);
    color: var(--input-color);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 8px;
    outline: none;
  }

  .d-form-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
  }
  .d-check {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--date-color);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .d-check input { accent-color: #FF6FA2; width: 11px; height: 11px; cursor: pointer; }

  .d-btns { display: flex; gap: 4px; }
  .btn-sm {
    border: none;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 7px;
    cursor: pointer;
  }
  .btn-cancel { background: var(--btn-cancel-bg); color: var(--btn-cancel-color); }
  .btn-save { background: var(--add-bg); color: var(--add-color); }

  .d-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 290px;
    overflow-y: auto;
  }
  .d-list::-webkit-scrollbar { width: 3px; }
  .d-list::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }

  .d-slot {
    position: relative;
    background: var(--slot-bg);
    border: none;
    box-shadow: none;
    border-radius: 14px;
    padding: 13px 10px 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-align: center;
  }

  .d-slot-actions {
    position: absolute;
    top: 6px;
    right: 7px;
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0.65;
    transition: opacity 0.15s ease;
  }
  .d-slot:hover .d-slot-actions { opacity: 1; }

  .act-btn {
    border: none;
    background: transparent;
    color: var(--icon-color);
    font-size: 10px;
    font-weight: 700;
    width: 16px;
    height: 16px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .act-btn:hover { color: var(--icon-hover); }

  .d-slot-title {
    width: 100%;
    padding: 0 28px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--title-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.2px;
  }

  .d-slot-num {
    font-family: 'Silkscreen', monospace;
    font-size: 25px;
    font-weight: 700;
    line-height: 1.15;
    color: var(--dday-color);
    letter-spacing: 0.5px;
  }
  .d-slot-num.today { color: var(--dday-today-color); }
  .d-slot-num.past { color: var(--dday-past-color); }

  .d-slot-date {
    font-size: 9.5px;
    font-weight: 500;
    color: var(--date-color);
    letter-spacing: 0.1px;
  }

  .empty-txt {
    text-align: center;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--empty-color);
    padding: 20px 0;
  }

  @media (max-width: 480px) {
    .d-wrap { gap: 5px; }
    .d-head { padding: 2px 42px 0 2px; }
    .d-slot {
      border-radius: 12px;
      padding: 11px 8px 9px;
      gap: 3px;
    }
    .d-slot-title { font-size: 10px; padding: 0 26px; }
    .d-slot-num { font-size: 22px; }
    .d-slot-date { font-size: 9px; }
  }
</style>
</head>
<body>
  <div class="d-wrap">
    <div class="d-head">
      <button type="button" class="add-btn" title="디데이 추가" onclick="openForm()">+</button>
      <button type="button" class="sync-btn" id="syncBtn" title="새로고침" onclick="fetchItems()">↻</button>
    </div>

    <div class="d-form" id="ddayForm">
      <input type="text" class="d-input" id="inputTitle" placeholder="일정 이름" maxlength="24">
      <input type="date" class="d-input" id="inputDate">
      <div class="d-form-row">
        <label class="d-check" title="체크 시 시작일을 1일차로 계산">
          <input type="checkbox" id="inputIncludeStart">
          <span>시작일 포함 (+1일)</span>
        </label>
        <div class="d-btns">
          <button type="button" class="btn-sm btn-cancel" onclick="closeForm()">취소</button>
          <button type="button" class="btn-sm btn-save" onclick="saveItem()">저장</button>
        </div>
      </div>
    </div>

    <div class="d-list" id="ddayList">
      <div class="empty-txt">불러오는 중...</div>
    </div>
  </div>

<script>
  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  const CACHE_KEY = "lostark_dday_saved_v1";
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  let ddayItems = [];
  let editingId = null;

  function getTodayStr() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
  }

  function formatEnDate(dateStr) {
    const [y, m, d] = String(dateStr || "").split("-").map(Number);
    if (!y || !m || !d) return dateStr || "";
    const mon = MONTHS[m - 1] || "";
    return `${mon} ${d}, ${y}`;
  }

  function calcDday(dateStr, includeStart) {
    const [y, m, d] = String(dateStr || "").split("-").map(Number);
    if (!y || !m || !d) return { label: "D-?", cls: "", diff: 0 };

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const target = new Date(y, m - 1, d);
    const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));

    if (diffDays > 0) {
      return { label: `D-${diffDays}`, cls: "", diff: diffDays };
    }
    if (diffDays === 0) {
      return { label: includeStart ? "D+1" : "D-DAY", cls: "today", diff: 0 };
    }
    const passed = Math.abs(diffDays) + (includeStart ? 1 : 0);
    return { label: `D+${passed}`, cls: "past", diff: diffDays };
  }

  function sortItems(arr) {
    return [...arr].sort((a, b) => {
      const da = calcDday(a.date, a.includeStart).diff;
      const db = calcDday(b.date, b.includeStart).diff;
      if (da >= 0 && db >= 0) return da - db;
      if (da >= 0 && db < 0) return -1;
      if (da < 0 && db >= 0) return 1;
      return db - da;
    });
  }

  function readLocal() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function writeLocal(items) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(items));
    } catch (e) {}
  }

  async function fetchItems() {
    const syncBtn = document.getElementById("syncBtn");
    syncBtn.classList.add("spinning");

    const localSaved = readLocal();
    if (localSaved.length > 0) {
      ddayItems = sortItems(localSaved);
      render();
    }

    try {
      const res = await fetch(`${API_BASE}/dday?t=${Date.now()}`);
      const data = await res.json();
      if (data && data.ok && Array.isArray(data.items)) {
        if (data.items.length > 0) {
          ddayItems = sortItems(data.items);
          writeLocal(ddayItems);
        } else if (localSaved.length > 0) {
          // 서버에 아직 반영 전이고 로컬에 저장된 항목이 있으면 자동 재업로드해 유실 방지
          await syncToServer(localSaved, true);
        } else {
          ddayItems = [];
        }
      }
    } catch (e) {}

    syncBtn.classList.remove("spinning");
    render();
  }

  async function syncToServer(nextItems, silent = false) {
    ddayItems = sortItems(nextItems);
    writeLocal(ddayItems);
    if (!silent) render();

    const syncBtn = document.getElementById("syncBtn");
    syncBtn.classList.add("spinning");
    try {
      const res = await fetch(`${API_BASE}/dday`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: ddayItems }),
      });
      const data = await res.json();
      if (data && data.ok && Array.isArray(data.items)) {
        ddayItems = sortItems(data.items);
        writeLocal(ddayItems);
      }
    } catch (e) {}
    syncBtn.classList.remove("spinning");
  }

  function openForm(item = null) {
    const form = document.getElementById("ddayForm");
    const titleEl = document.getElementById("inputTitle");
    const dateEl = document.getElementById("inputDate");
    const incEl = document.getElementById("inputIncludeStart");

    if (item) {
      editingId = item.id;
      titleEl.value = item.title;
      dateEl.value = item.date;
      incEl.checked = Boolean(item.includeStart);
    } else {
      editingId = null;
      titleEl.value = "";
      dateEl.value = getTodayStr();
      incEl.checked = false;
    }

    form.classList.add("open");
    titleEl.focus();
  }

  function closeForm() {
    editingId = null;
    document.getElementById("ddayForm").classList.remove("open");
  }

  async function saveItem() {
    const title = document.getElementById("inputTitle").value.trim();
    const date = document.getElementById("inputDate").value;
    const includeStart = document.getElementById("inputIncludeStart").checked;

    if (!title || !date) return;

    const next = [...ddayItems];
    if (editingId) {
      const idx = next.findIndex((it) => it.id === editingId);
      if (idx !== -1) {
        next[idx] = { ...next[idx], title, date, includeStart };
      }
    } else {
      next.push({
        id: `dday_${Date.now()}`,
        title,
        date,
        includeStart,
      });
    }

    closeForm();
    await syncToServer(next);
  }

  async function deleteItem(id) {
    const next = ddayItems.filter((it) => it.id !== id);
    await syncToServer(next);
  }

  function render() {
    const listEl = document.getElementById("ddayList");

    if (!ddayItems || ddayItems.length === 0) {
      listEl.innerHTML = `<div class="empty-txt">왼쪽 상단 + 버튼으로 디데이 추가</div>`;
      return;
    }

    listEl.innerHTML = "";
    ddayItems.forEach((item) => {
      const info = calcDday(item.date, item.includeStart);

      const slot = document.createElement("div");
      slot.className = "d-slot";

      const actions = document.createElement("div");
      actions.className = "d-slot-actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "act-btn";
      editBtn.title = "수정";
      editBtn.textContent = "✎";
      editBtn.onclick = () => openForm(item);

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "act-btn";
      delBtn.title = "삭제";
      delBtn.textContent = "✕";
      delBtn.onclick = () => deleteItem(item.id);

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      const title = document.createElement("div");
      title.className = "d-slot-title";
      title.textContent = item.title;

      const num = document.createElement("div");
      num.className = `d-slot-num ${info.cls}`.trim();
      num.textContent = info.label;

      const date = document.createElement("div");
      date.className = "d-slot-date";
      date.textContent = formatEnDate(item.date);

      slot.appendChild(actions);
      slot.appendChild(title);
      slot.appendChild(num);
      slot.appendChild(date);

      listEl.appendChild(slot);
    });
  }

  document.getElementById("inputTitle").addEventListener("keydown", (e) => {
    if (e.key === "Enter") saveItem();
  });

  fetchItems();
</script>
</body>
</html>
