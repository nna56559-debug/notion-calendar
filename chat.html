<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 4px;
  }

  :root {
    --page-bg: transparent;
    --card-bg: #FFFFFF;
    --card-border: #F9E5E9;
    --card-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    --scroll-thumb: #F2DCE2;

    --date-bg: #FDF5F7;
    --date-border: #F3DCE3;
    --date-fg: #9E838C;
    --date-line: #F5E6EA;

    /* 1. 핑크 */
    --bbl-pink-bg: #FCE8EE;
    --bbl-pink-border: #F5DCE3;
    --bbl-pink-fg: #4A4442;

    /* 2. 블루 */
    --bbl-blue-bg: #E6F3FB;
    --bbl-blue-border: #D0E8F7;
    --bbl-blue-fg: #3B4954;

    /* 3. 라벤더 */
    --bbl-lav-bg: #F2EBFC;
    --bbl-lav-border: #E4D7F7;
    --bbl-lav-fg: #494154;

    /* 4. 노랑 */
    --bbl-yellow-bg: #FFF7DC;
    --bbl-yellow-border: #F5E4A8;
    --bbl-yellow-fg: #52482B;

    /* 5. 초록 */
    --bbl-green-bg: #E6F7EE;
    --bbl-green-border: #C9EAD8;
    --bbl-green-fg: #354E41;

    /* 6. 피치 */
    --bbl-peach-bg: #FFEDE2;
    --bbl-peach-border: #F7D4C0;
    --bbl-peach-fg: #543F33;

    /* 7. 민트 */
    --bbl-mint-bg: #E3F7F4;
    --bbl-mint-border: #C2EAE4;
    --bbl-mint-fg: #324E4A;

    /* 8. 코랄 */
    --bbl-coral-bg: #FFE9E6;
    --bbl-coral-border: #F7CCC6;
    --bbl-coral-fg: #543835;

    --other-bbl-bg: #F7F4F6;
    --other-bbl-border: #ECE4E8;
    --other-bbl-fg: #4A4442;

    --sender-fg: #C95B7A;
    --time-fg: #B0A6A3;
    --act-bg: #FFFFFF;
    --act-border: #F2DCE2;
    --act-fg: #9E8F94;
    --act-hover-fg: #C95B7A;
    --inp-wrap-bg: #FDFBFC;
    --inp-wrap-border: #F2DCE2;
    --inp-focus-border: #F29CB4;
    --inp-focus-bg: #FFFFFF;
    --nick-border: #F2DCE2;
    --nick-bg: #FCE8EE;
    --nick-fg: #C95B7A;
    --nick-locked-bg: #F9E5EC;
    --nick-locked-border: #EABAC8;
    --nick-req-border: #E86A8E;
    --txt-main: #4A4442;
    --txt-sub: #8A7E82;
    --inp-ph: #BEB5B2;
    --sync-fg: #9E8F94;
    --sync-hover-fg: #C95B7A;
    --send-bg: #F28BA8;
    --send-hover-bg: #E67595;
    --send-fg: #FFFFFF;
    --empty-fg: #B5AEAB;
    --toast-bg: rgba(201, 91, 122, 0.92);
    --toast-fg: #FFFFFF;

    --modal-backdrop: rgba(74, 68, 66, 0.28);
    --modal-bg: #FFFFFF;
    --modal-border: #F5DCE3;
    --modal-shadow: 0 10px 26px rgba(201, 91, 122, 0.18);
    --modal-chip-bg: #FCE8EE;
    --modal-chip-fg: #C95B7A;
    --cancel-bg: #F7F3F5;
    --cancel-fg: #7D7276;
    --cancel-hover-bg: #EFE8EC;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #191919;
      --card-bg: #1B1A20;
      --card-border: #383342;
      --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
      --scroll-thumb: #4B3846;

      --date-bg: #262330;
      --date-border: #3E384E;
      --date-fg: #B8B0CC;
      --date-line: #322E3F;

      --bbl-pink-bg: #36232D;
      --bbl-pink-border: #543646;
      --bbl-pink-fg: #F4F2F8;

      --bbl-blue-bg: #223442;
      --bbl-blue-border: #344F63;
      --bbl-blue-fg: #ECF4FA;

      --bbl-lav-bg: #2D263B;
      --bbl-lav-border: #463B5C;
      --bbl-lav-fg: #F2EFFA;

      --bbl-yellow-bg: #38311E;
      --bbl-yellow-border: #594D2E;
      --bbl-yellow-fg: #FBF2D6;

      --bbl-green-bg: #20362B;
      --bbl-green-border: #325443;
      --bbl-green-fg: #E7F7EE;

      --bbl-peach-bg: #3A2920;
      --bbl-peach-border: #5C4032;
      --bbl-peach-fg: #FBECE3;

      --bbl-mint-bg: #1E3533;
      --bbl-mint-border: #2F5350;
      --bbl-mint-fg: #E4F7F4;

      --bbl-coral-bg: #3B2422;
      --bbl-coral-border: #5E3936;
      --bbl-coral-fg: #FBE7E4;

      --other-bbl-bg: #26252E;
      --other-bbl-border: #3B3748;
      --other-bbl-fg: #EAE6F4;

      --sender-fg: #F5A3BC;
      --time-fg: #878296;
      --act-bg: #24232B;
      --act-border: #3F394D;
      --act-fg: #9A95A8;
      --act-hover-fg: #F5A3BC;
      --inp-wrap-bg: #24232B;
      --inp-wrap-border: #3A3646;
      --inp-focus-border: #C95B7A;
      --inp-focus-bg: #2C2A35;
      --nick-border: #5E3A4A;
      --nick-bg: #3B252E;
      --nick-fg: #F5A3BC;
      --nick-locked-bg: #462A36;
      --nick-locked-border: #78485C;
      --nick-req-border: #F5A3BC;
      --txt-main: #F4F2F8;
      --txt-sub: #A59EB8;
      --inp-ph: #878296;
      --sync-fg: #9A95A8;
      --sync-hover-fg: #F5A3BC;
      --send-bg: #C95B7A;
      --send-hover-bg: #DE6F8E;
      --send-fg: #FFFFFF;
      --empty-fg: #878296;
      --toast-bg: rgba(201, 91, 122, 0.95);
      --toast-fg: #FFFFFF;

      --modal-backdrop: rgba(10, 9, 14, 0.62);
      --modal-bg: #23212B;
      --modal-border: #4A384A;
      --modal-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
      --modal-chip-bg: #3B252E;
      --modal-chip-fg: #F5A3BC;
      --cancel-bg: #2E2B38;
      --cancel-fg: #B8B0CC;
      --cancel-hover-bg: #393546;
    }
  }

  :root[data-theme="dark"] {
    --page-bg: #191919;
    --card-bg: #1B1A20;
    --card-border: #383342;
    --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
    --scroll-thumb: #4B3846;

    --date-bg: #262330;
    --date-border: #3E384E;
    --date-fg: #B8B0CC;
    --date-line: #322E3F;

    --bbl-pink-bg: #36232D;
    --bbl-pink-border: #543646;
    --bbl-pink-fg: #F4F2F8;

    --bbl-blue-bg: #223442;
    --bbl-blue-border: #344F63;
    --bbl-blue-fg: #ECF4FA;

    --bbl-lav-bg: #2D263B;
    --bbl-lav-border: #463B5C;
    --bbl-lav-fg: #F2EFFA;

    --bbl-yellow-bg: #38311E;
    --bbl-yellow-border: #594D2E;
    --bbl-yellow-fg: #FBF2D6;

    --bbl-green-bg: #20362B;
    --bbl-green-border: #325443;
    --bbl-green-fg: #E7F7EE;

    --bbl-peach-bg: #3A2920;
    --bbl-peach-border: #5C4032;
    --bbl-peach-fg: #FBECE3;

    --bbl-mint-bg: #1E3533;
    --bbl-mint-border: #2F5350;
    --bbl-mint-fg: #E4F7F4;

    --bbl-coral-bg: #3B2422;
    --bbl-coral-border: #5E3936;
    --bbl-coral-fg: #FBE7E4;

    --other-bbl-bg: #26252E;
    --other-bbl-border: #3B3748;
    --other-bbl-fg: #EAE6F4;

    --sender-fg: #F5A3BC;
    --time-fg: #878296;
    --act-bg: #24232B;
    --act-border: #3F394D;
    --act-fg: #9A95A8;
    --act-hover-fg: #F5A3BC;
    --inp-wrap-bg: #24232B;
    --inp-wrap-border: #3A3646;
    --inp-focus-border: #C95B7A;
    --inp-focus-bg: #2C2A35;
    --nick-border: #5E3A4A;
    --nick-bg: #3B252E;
    --nick-fg: #F5A3BC;
    --nick-locked-bg: #462A36;
    --nick-locked-border: #78485C;
    --nick-req-border: #F5A3BC;
    --txt-main: #F4F2F8;
    --txt-sub: #A59EB8;
    --inp-ph: #878296;
    --sync-fg: #9A95A8;
    --sync-hover-fg: #F5A3BC;
    --send-bg: #C95B7A;
    --send-hover-bg: #DE6F8E;
    --send-fg: #FFFFFF;
    --empty-fg: #878296;
    --toast-bg: rgba(201, 91, 122, 0.95);
    --toast-fg: #FFFFFF;

    --modal-backdrop: rgba(10, 9, 14, 0.62);
    --modal-bg: #23212B;
    --modal-border: #4A384A;
    --modal-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
    --modal-chip-bg: #3B252E;
    --modal-chip-fg: #F5A3BC;
    --cancel-bg: #2E2B38;
    --cancel-fg: #B8B0CC;
    --cancel-hover-bg: #393546;
  }

  html, body {
    background: var(--page-bg);
  }

  .chat-card {
    position: relative;
    width: 100%;
    height: 250px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 22px;
    padding: 12px 13px 11px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow: hidden;
  }

  .chat-stream {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 2px 3px 2px 1px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .chat-stream::-webkit-scrollbar { width: 3px; }
  .chat-stream::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }

  .empty-chat {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--empty-fg);
  }

  .date-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 3px 0;
    width: 100%;
    animation: dateReveal 0.24s ease-out;
  }
  .date-divider::before,
  .date-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--date-line);
  }
  .date-pill {
    background: var(--date-bg);
    border: 1px solid var(--date-border);
    color: var(--date-fg);
    font-size: 9px;
    font-weight: 800;
    padding: 2.5px 9px;
    border-radius: 999px;
    white-space: nowrap;
    letter-spacing: -0.2px;
  }
  @keyframes dateReveal {
    from { opacity: 0; transform: scale(0.94) translateY(3px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .msg-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    animation: popIn 0.18s ease-out;
  }
  .msg-block.mine {
    align-items: flex-end;
  }
  .msg-block.other {
    align-items: flex-start;
  }
  .msg-block.new-minute-gap {
    margin-top: 3px;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-sender {
    font-size: 9px;
    font-weight: 800;
    color: var(--sender-fg);
    padding-left: 4px;
  }

  .msg-row {
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 5px;
  }
  .msg-block.mine .msg-row {
    justify-content: flex-end;
  }
  .msg-block.other .msg-row {
    justify-content: flex-start;
  }

  .msg-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex-shrink: 0;
  }
  .msg-block.mine .msg-meta {
    align-items: flex-end;
  }
  .msg-block.other .msg-meta {
    align-items: flex-start;
  }

  .msg-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .msg-block.mine:hover .msg-actions {
    opacity: 1;
  }
  .act-btn {
    border: 1px solid var(--act-border);
    background: var(--act-bg);
    color: var(--act-fg);
    font-family: inherit;
    font-size: 8.5px;
    font-weight: 800;
    width: 15px;
    height: 15px;
    border-radius: 5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: all 0.12s ease;
  }
  .act-btn:hover {
    color: var(--act-hover-fg);
    border-color: var(--nick-border);
  }

  .msg-time {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--time-fg);
    white-space: nowrap;
  }

  .msg-bubble {
    max-width: 76%;
    padding: 6.5px 10px;
    font-size: 10.8px;
    font-weight: 700;
    line-height: 1.38;
    word-break: break-word;
    white-space: pre-wrap;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .msg-bubble:hover {
    filter: brightness(0.985);
  }
  .msg-bubble:active {
    transform: scale(0.98);
  }

  .msg-block.mine .msg-bubble {
    border-radius: 13px 13px 4px 13px;
    background: var(--bbl-pink-bg);
    border: 1px solid var(--bbl-pink-border);
    color: var(--bbl-pink-fg);
  }
  .msg-block.mine .msg-bubble.tone-blue {
    background: var(--bbl-blue-bg);
    border-color: var(--bbl-blue-border);
    color: var(--bbl-blue-fg);
  }
  .msg-block.mine .msg-bubble.tone-lav {
    background: var(--bbl-lav-bg);
    border-color: var(--bbl-lav-border);
    color: var(--bbl-lav-fg);
  }
  .msg-block.mine .msg-bubble.tone-yellow {
    background: var(--bbl-yellow-bg);
    border-color: var(--bbl-yellow-border);
    color: var(--bbl-yellow-fg);
  }
  .msg-block.mine .msg-bubble.tone-green {
    background: var(--bbl-green-bg);
    border-color: var(--bbl-green-border);
    color: var(--bbl-green-fg);
  }
  .msg-block.mine .msg-bubble.tone-peach {
    background: var(--bbl-peach-bg);
    border-color: var(--bbl-peach-border);
    color: var(--bbl-peach-fg);
  }
  .msg-block.mine .msg-bubble.tone-mint {
    background: var(--bbl-mint-bg);
    border-color: var(--bbl-mint-border);
    color: var(--bbl-mint-fg);
  }
  .msg-block.mine .msg-bubble.tone-coral {
    background: var(--bbl-coral-bg);
    border-color: var(--bbl-coral-border);
    color: var(--bbl-coral-fg);
  }

  .msg-block.other .msg-bubble {
    border-radius: 13px 13px 13px 4px;
    background: var(--other-bbl-bg);
    border: 1px solid var(--other-bbl-border);
    color: var(--other-bbl-fg);
  }
  .msg-block.other .msg-bubble.tone-blue {
    background: var(--bbl-blue-bg);
    border-color: var(--bbl-blue-border);
    color: var(--bbl-blue-fg);
  }
  .msg-block.other .msg-bubble.tone-lav {
    background: var(--bbl-lav-bg);
    border-color: var(--bbl-lav-border);
    color: var(--bbl-lav-fg);
  }
  .msg-block.other .msg-bubble.tone-yellow {
    background: var(--bbl-yellow-bg);
    border-color: var(--bbl-yellow-border);
    color: var(--bbl-yellow-fg);
  }
  .msg-block.other .msg-bubble.tone-green {
    background: var(--bbl-green-bg);
    border-color: var(--bbl-green-border);
    color: var(--bbl-green-fg);
  }
  .msg-block.other .msg-bubble.tone-peach {
    background: var(--bbl-peach-bg);
    border-color: var(--bbl-peach-border);
    color: var(--bbl-peach-fg);
  }
  .msg-block.other .msg-bubble.tone-mint {
    background: var(--bbl-mint-bg);
    border-color: var(--bbl-mint-border);
    color: var(--bbl-mint-fg);
  }
  .msg-block.other .msg-bubble.tone-coral {
    background: var(--bbl-coral-bg);
    border-color: var(--bbl-coral-border);
    color: var(--bbl-coral-fg);
  }

  .chat-input-bar {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    background: var(--inp-wrap-bg);
    border: 1.2px solid var(--inp-wrap-border);
    border-radius: 12px;
    padding: 4px 5px 4px 7px;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .chat-input-bar:focus-within {
    border-color: var(--inp-focus-border);
    background: var(--inp-focus-bg);
  }

  .nick-input {
    width: 56px;
    border: 1px solid var(--nick-border);
    background: var(--nick-bg);
    color: var(--nick-fg);
    border-radius: 7px;
    padding: 2.5px 5px;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    text-align: center;
    outline: none;
    flex-shrink: 0;
    margin-bottom: 1px;
    transition: all 0.15s ease;
  }
  .nick-input::placeholder {
    color: var(--nick-fg);
    opacity: 0.65;
  }
  .nick-input.required {
    border-color: var(--nick-req-border);
    box-shadow: 0 0 0 2px rgba(232, 106, 142, 0.25);
  }
  .nick-input.locked {
    background: var(--nick-locked-bg);
    border-color: var(--nick-locked-border);
    cursor: default;
    user-select: none;
  }

  .chat-textarea {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 10.8px;
    font-weight: 700;
    color: var(--txt-main);
    line-height: 1.35;
    resize: none;
    outline: none;
    max-height: 54px;
    min-height: 18px;
    padding: 2px 0;
  }
  .chat-textarea::placeholder {
    color: var(--inp-ph);
    font-weight: 600;
  }

  .tone-dot-btn {
    width: 14px;
    height: 14px;
    border-radius: 999px;
    border: 1.5px solid #FFFFFF;
    box-shadow: 0 0 0 1px var(--nick-border);
    background: #F7B8CA;
    cursor: pointer;
    margin-bottom: 4px;
    flex-shrink: 0;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .tone-dot-btn:hover { transform: scale(1.15); }
  .tone-dot-btn.tone-blue { background: #A9D8F5; box-shadow: 0 0 0 1px #98CCE8; }
  .tone-dot-btn.tone-lav { background: #CEB8F5; box-shadow: 0 0 0 1px #BCA3EB; }
  .tone-dot-btn.tone-yellow { background: #F7DF88; box-shadow: 0 0 0 1px #E3C462; }
  .tone-dot-btn.tone-green { background: #9EE0BC; box-shadow: 0 0 0 1px #7EC9A0; }
  .tone-dot-btn.tone-peach { background: #F8C4A6; box-shadow: 0 0 0 1px #E0A482; }
  .tone-dot-btn.tone-mint { background: #9CE3D8; box-shadow: 0 0 0 1px #79C7BC; }
  .tone-dot-btn.tone-coral { background: #F7B0A6; box-shadow: 0 0 0 1px #DF8F84; }

  .sync-btn {
    border: none;
    background: transparent;
    color: var(--sync-fg);
    font-family: inherit;
    font-size: 11px;
    font-weight: 800;
    width: 20px;
    height: 22px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .sync-btn:hover {
    color: var(--sync-hover-fg);
  }
  .sync-btn.spinning {
    animation: spinSync 0.6s linear infinite;
  }
  @keyframes spinSync {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .send-btn {
    border: none;
    background: var(--send-bg);
    color: var(--send-fg);
    width: 24px;
    height: 22px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .send-btn:hover { background: var(--send-hover-bg); }
  .send-btn:active { transform: scale(0.92); }
  .send-icon {
    width: 11px;
    height: 11px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .copy-toast {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: var(--toast-bg);
    color: var(--toast-fg);
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.18s ease;
    z-index: 30;
  }
  .copy-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .nick-modal-backdrop {
    position: fixed;
    inset: 0;
    background: var(--modal-backdrop);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 10px;
    z-index: 40;
  }
  .nick-modal-backdrop.open {
    display: flex;
    animation: modalFade 0.15s ease-out;
  }
  @keyframes modalFade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .nick-modal-box {
    width: 100%;
    max-width: 256px;
    background: var(--modal-bg);
    border: 1.5px solid var(--modal-border);
    border-radius: 18px;
    padding: 13px 14px 12px;
    box-shadow: var(--modal-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    animation: modalPop 0.16s ease-out;
  }
  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.95) translateY(4px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .nick-modal-title {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--txt-main);
  }
  .nick-modal-chip {
    background: var(--modal-chip-bg);
    color: var(--modal-chip-fg);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 11px;
    border-radius: 999px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nick-modal-desc {
    font-size: 9.8px;
    font-weight: 700;
    color: var(--txt-sub);
    line-height: 1.4;
  }
  .nick-modal-btns {
    width: 100%;
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }
  .modal-btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 6.5px 8px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.14s ease;
  }
  .modal-btn.cancel {
    background: var(--cancel-bg);
    color: var(--cancel-fg);
  }
  .modal-btn.cancel:hover {
    background: var(--cancel-hover-bg);
  }
  .modal-btn.confirm {
    background: var(--send-bg);
    color: var(--send-fg);
  }
  .modal-btn.confirm:hover {
    background: var(--send-hover-bg);
  }

  @media (max-width: 480px) {
    .msg-block.mine .msg-actions {
      opacity: 1;
    }
  }
</style>
</head>
<body>
  <div class="chat-card">
    <div class="copy-toast" id="copyToast">복사됨!</div>

    <div class="chat-stream" id="chatStream"></div>

    <div class="chat-input-bar">
      <input
        type="text"
        class="nick-input"
        id="nickInput"
        maxlength="10"
        placeholder="이름*"
        oninput="handleNickInput(this)"
        onkeydown="handleNickKeydown(event)"
        onclick="handleNickClick()"
      >
      <button type="button" class="tone-dot-btn" id="toneBtn" onclick="cycleTone()" title="말풍선 색상 변경 (핑크/블루/라벤더/노랑/초록/피치/민트/코랄)"></button>
      <textarea
        class="chat-textarea"
        id="chatInput"
        rows="1"
        placeholder="메시지 입력..."
        oninput="autoResize(this)"
        onkeydown="handleKeydown(event)"
      ></textarea>
      <button type="button" class="sync-btn" id="syncBtn" onclick="loadState({ isPolling: false, manual: true })" title="채팅 새로고침">↻</button>
      <button type="button" class="send-btn" id="sendBtn" onclick="sendMessage()" title="전송">
        <svg class="send-icon" viewBox="0 0 24 24">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <div class="nick-modal-backdrop" id="nickModal" onclick="handleModalBackdrop(event)">
    <div class="nick-modal-box">
      <div class="nick-modal-title">이름을 이대로 결정할까요?</div>
      <div class="nick-modal-chip" id="nickModalPreview"></div>
      <div class="nick-modal-desc">한 번 결정하면 끝이며<br>나중에 이름을 바꿀 수 없어요!</div>
      <div class="nick-modal-btns">
        <button type="button" class="modal-btn cancel" onclick="cancelNickConfirm()">다시 입력</button>
        <button type="button" class="modal-btn confirm" id="nickConfirmBtn" onclick="confirmNickAndSend()">결정하기</button>
      </div>
    </div>
  </div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();

  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  const STORAGE_KEY = "lostark_pastel_chat_room_v3";
  const DELETED_KEY = "lostark_pastel_chat_deleted_v1";
  const NICK_KEY = "lostark_pastel_chat_nick_v1";
  const NICK_LOCKED_KEY = "lostark_pastel_chat_nick_locked_v1";
  const TONES = ["pink", "blue", "lav", "yellow", "green", "peach", "mint", "coral"];
  const TONE_LABELS = {
    pink: "핑크",
    blue: "블루",
    lav: "라벤더",
    yellow: "노랑",
    green: "초록",
    peach: "피치",
    mint: "민트",
    coral: "코랄"
  };
  const WEEKDAYS_KO = ["일", "월", "화", "수", "목", "금", "토"];

  let myNick = "";
  let isNickLocked = false;
  let pendingNick = "";
  let isSending = false;
  let isSavingToServer = false;
  let lastSavedAt = 0;
  let retrySaveTimer = null;
  let deletedIds = new Set();
  let state = {
    tone: "pink",
    updatedAt: 0,
    messages: [],
    deletedIds: [],
    ddayItems: null
  };

  function loadDeletedCache() {
    try {
      const arr = JSON.parse(localStorage.getItem(DELETED_KEY) || "[]");
      if (Array.isArray(arr)) {
        arr.forEach(id => {
          if (id) deletedIds.add(String(id));
        });
      }
    } catch (e) {}
  }

  function saveDeletedCache() {
    try {
      const trimmed = Array.from(deletedIds).slice(-300);
      deletedIds = new Set(trimmed);
      localStorage.setItem(DELETED_KEY, JSON.stringify(trimmed));
    } catch (e) {}
  }

  function isModalOpen() {
    return document.getElementById("nickModal")?.classList.contains("open");
  }

  function openNickConfirmModal(nickValue) {
    pendingNick = nickValue;
    document.getElementById("nickModalPreview").textContent = nickValue;
    document.getElementById("nickModal").classList.add("open");
    document.getElementById("nickConfirmBtn").focus();
  }

  function closeNickConfirmModal() {
    pendingNick = "";
    document.getElementById("nickModal").classList.remove("open");
  }

  function cancelNickConfirm() {
    closeNickConfirmModal();
    document.getElementById("nickInput").focus();
  }

  function handleModalBackdrop(e) {
    if (e.target.id === "nickModal") {
      cancelNickConfirm();
    }
  }

  function confirmNickAndSend() {
    const chosen = String(pendingNick || document.getElementById("nickInput").value || "").trim();
    closeNickConfirmModal();
    if (!chosen) {
      highlightNickRequired();
      return;
    }
    lockNickPermanent(chosen);
    executeSendMessage(chosen);
  }

  function getKstParts(d = new Date()) {
    const kst = new Date(d.getTime() + (d.getTimezoneOffset() + 540) * 60000);
    return {
      year: kst.getFullYear(),
      month: kst.getMonth() + 1,
      day: kst.getDate(),
      weekday: kst.getDay(),
      hours: kst.getHours(),
      minutes: kst.getMinutes(),
      ts: kst.getTime()
    };
  }

  function getDateKey(d = new Date()) {
    const p = getKstParts(d);
    const m = String(p.month).padStart(2, "0");
    const day = String(p.day).padStart(2, "0");
    return `${p.year}-${m}-${day}`;
  }

  function formatDateLabel(dateKey) {
    const m = String(dateKey || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return dateKey || "";
    const y = Number(m[1]);
    const mo = Number(m[2]);
    const da = Number(m[3]);
    const utcDt = new Date(Date.UTC(y, mo - 1, da));
    const w = WEEKDAYS_KO[utcDt.getUTCDay()] || "";
    return `${y}년 ${mo}월 ${da}일 (${w})`;
  }

  function formatTimeNow(d = new Date()) {
    const p = getKstParts(d);
    const h = p.hours;
    const m = String(p.minutes).padStart(2, "0");
    const ampm = h < 12 ? "오전" : "오후";
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${ampm} ${h12}:${m}`;
  }

  function applyNickLockUI() {
    const nickEl = document.getElementById("nickInput");
    if (!nickEl) return;
    if (isNickLocked && myNick) {
      nickEl.value = myNick;
      nickEl.readOnly = true;
      nickEl.classList.remove("required");
      nickEl.classList.add("locked");
      nickEl.title = `확정된 이름: ${myNick} (변경 불가)`;
    } else {
      nickEl.readOnly = false;
      nickEl.classList.remove("locked");
      nickEl.title = "첫 채팅 전송 시 이름이 결정됩니다";
    }
  }

  function loadNick() {
    try {
      const saved = String(localStorage.getItem(NICK_KEY) || "").trim();
      const lockedFlag = localStorage.getItem(NICK_LOCKED_KEY) === "1";
      myNick = saved;
      isNickLocked = Boolean(saved && lockedFlag);
      if (saved) document.getElementById("nickInput").value = saved;
    } catch (e) {}
    applyNickLockUI();
  }

  function lockNickPermanent(name) {
    const clean = String(name || "").trim();
    if (!clean) return;
    myNick = clean;
    isNickLocked = true;
    try {
      localStorage.setItem(NICK_KEY, clean);
      localStorage.setItem(NICK_LOCKED_KEY, "1");
    } catch (e) {}
    applyNickLockUI();
  }

  let nickReqTimer = null;
  function highlightNickRequired() {
    const nickEl = document.getElementById("nickInput");
    nickEl.classList.add("required");
    nickEl.focus();
    showToast("이름을 먼저 입력해 주세요");
    clearTimeout(nickReqTimer);
    nickReqTimer = setTimeout(() => {
      nickEl.classList.remove("required");
    }, 1500);
  }

  let nickToastTimer = null;
  function handleNickClick() {
    if (!isNickLocked) return;
    clearTimeout(nickToastTimer);
    nickToastTimer = setTimeout(() => {
      showToast("한 번 결정한 이름은 바꿀 수 없어요");
    }, 80);
  }

  function handleNickKeydown(e) {
    if (!isNickLocked) return;
    if (!["Tab", "ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
      e.preventDefault();
      showToast("한 번 결정한 이름은 바꿀 수 없어요");
    }
  }

  function handleNickInput(el) {
    if (isNickLocked) {
      el.value = myNick;
      return;
    }
    const trimmed = String(el.value || "").trim();
    myNick = trimmed;
    if (trimmed) el.classList.remove("required");
    try {
      if (trimmed) localStorage.setItem(NICK_KEY, trimmed);
      else localStorage.removeItem(NICK_KEY);
    } catch (e) {}
    render({ scrollToBottom: false });
  }

  function extractMemoPayload(data) {
    if (!data || typeof data !== "object") return null;
    if (data.chatMemo && typeof data.chatMemo === "object") return data.chatMemo;
    if (data.memo && typeof data.memo === "object" && data.memo.chatMemo) return data.memo.chatMemo;
    if (data.state && typeof data.state === "object") return data.state;
    if (Array.isArray(data.messages)) return data;
    if (Array.isArray(data)) return { messages: data };
    return null;
  }

  function parseMsgSeq(idStr) {
    const m = String(idStr || "").match(/^m_(\d+)/);
    return m ? Number(m[1]) : 0;
  }

  function normalizeMessages(raw) {
    if (!raw || typeof raw !== "object") return null;
    const list = Array.isArray(raw.messages) ? raw.messages : [];
    const fallbackDate = getDateKey(new Date());
    const remoteDeleted = Array.isArray(raw.deletedIds) ? raw.deletedIds.map(String) : [];

    remoteDeleted.forEach(id => {
      if (id) deletedIds.add(id);
    });
    if (remoteDeleted.length > 0) saveDeletedCache();

    const cleaned = list
      .filter(m => m && typeof m.text === "string" && m.text.trim())
      .map((m, idx) => ({
        id: String(m.id || `m_${Date.now()}_${idx}`),
        sender: String(m.sender || "").trim(),
        text: String(m.text),
        date: String(m.date || fallbackDate).trim(),
        time: String(m.time || ""),
        tone: TONES.includes(m.tone) ? m.tone : "pink"
      }))
      .filter(m => !deletedIds.has(m.id));

    return {
      tone: TONES.includes(raw.tone) ? raw.tone : "pink",
      updatedAt: Number(raw.updatedAt || 0),
      messages: cleaned,
      deletedIds: Array.from(deletedIds),
      ddayItems: Array.isArray(raw.ddayItems) ? raw.ddayItems : null
    };
  }

  function mergeMessageLists(remoteList, localList) {
    const map = new Map();
    (remoteList || []).forEach(m => {
      if (!deletedIds.has(m.id)) map.set(m.id, m);
    });
    (localList || []).forEach(m => {
      if (!deletedIds.has(m.id) && !map.has(m.id)) {
        map.set(m.id, m);
      }
    });
    return Array.from(map.values()).sort((a, b) => parseMsgSeq(a.id) - parseMsgSeq(b.id));
  }

  function getSig(list) {
    return (list || []).map(m => `${m.id}:${m.sender}:${m.text}:${m.date}:${m.time}:${m.tone}`).join("|");
  }

  function writeLocalCache() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        tone: state.tone,
        updatedAt: state.updatedAt,
        messages: state.messages,
        deletedIds: Array.from(deletedIds),
        ddayItems: state.ddayItems
      }));
    } catch (e) {}
  }

  // 저장 직전에 서버 최신 데이터를 먼저 읽어 병합 후 POST (다른 기기 메시지·삭제·디데이 유실 방지)
  async function postStateToWorker(isRetry = false) {
    isSavingToServer = true;
    try {
      let remoteMessages = [];
      let remoteDday = state.ddayItems;

      try {
        const getRes = await fetch(`${API_BASE}/memo?_=${Date.now()}`, { cache: "no-store" });
        if (getRes.ok) {
          const currentData = await getRes.json();
          const rawMemo = extractMemoPayload(currentData);
          const normRemote = normalizeMessages(rawMemo);
          if (normRemote) {
            remoteMessages = normRemote.messages;
            if (Array.isArray(normRemote.ddayItems)) {
              remoteDday = normRemote.ddayItems;
            }
          }
        }
      } catch (e) {}

      const mergedMessages = mergeMessageLists(remoteMessages, state.messages);
      const deletedList = Array.from(deletedIds).slice(-300);

      state.messages = mergedMessages;
      state.deletedIds = deletedList;
      state.ddayItems = remoteDday;
      state.updatedAt = Date.now();
      writeLocalCache();

      const snapshot = {
        tone: state.tone,
        updatedAt: state.updatedAt,
        messages: mergedMessages,
        deletedIds: deletedList
      };
      if (Array.isArray(remoteDday)) {
        snapshot.ddayItems = remoteDday;
      }

      const res = await fetch(`${API_BASE}/memo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatMemo: snapshot })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      lastSavedAt = Date.now();
      clearTimeout(retrySaveTimer);
      retrySaveTimer = null;
      render({ scrollToBottom: false });
      return true;
    } catch (e) {
      if (!isRetry) {
        clearTimeout(retrySaveTimer);
        retrySaveTimer = setTimeout(() => {
          postStateToWorker(true).catch(() => {});
        }, 2500);
      }
      return false;
    } finally {
      isSavingToServer = false;
    }
  }

  function saveStateNow() {
    state.updatedAt = Date.now();
    writeLocalCache();
    return postStateToWorker(false);
  }

  async function loadState({ isPolling = false, manual = false } = {}) {
    if (isSending || isSavingToServer || isModalOpen()) return;

    const syncBtn = document.getElementById("syncBtn");
    if (manual && syncBtn) syncBtn.classList.add("spinning");

    if (!isPolling) {
      loadDeletedCache();
      loadNick();
      try {
        const local = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const norm = normalizeMessages(local);
        if (norm && norm.messages.length > 0) {
          state = norm;
          render({ scrollToBottom: true });
        }
      } catch (e) {}
    }

    try {
      const res = await fetch(`${API_BASE}/memo?_=${Date.now()}`, {
        cache: "no-store"
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const rawMemo = extractMemoPayload(data);
      const norm = normalizeMessages(rawMemo);

      if (norm) {
        const justSavedLocally = (Date.now() - lastSavedAt) < 3500;
        const merged = mergeMessageLists(norm.messages, justSavedLocally ? state.messages : []);
        const prevSig = getSig(state.messages);
        const nextSig = getSig(merged);

        if (prevSig !== nextSig || !isPolling) {
          const hadNew = merged.length > state.messages.length;
          state = {
            tone: justSavedLocally ? state.tone : norm.tone,
            updatedAt: Math.max(Number(norm.updatedAt || 0), Number(state.updatedAt || 0)),
            messages: merged,
            deletedIds: Array.from(deletedIds),
            ddayItems: Array.isArray(norm.ddayItems) ? norm.ddayItems : state.ddayItems
          };
          writeLocalCache();
          render({ scrollToBottom: hadNew || !isPolling });
        }
      }
      if (manual) showToast("동기화 완료");
    } catch (e) {
      if (manual) showToast("서버 연결을 확인해 주세요");
    } finally {
      if (manual && syncBtn) {
        setTimeout(() => syncBtn.classList.remove("spinning"), 300);
      }
    }
  }

  setInterval(() => loadState({ isPolling: true, manual: false }), 3500);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      loadState({ isPolling: false, manual: false });
    }
  });

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 54) + "px";
  }

  function handleKeydown(e) {
    if (e.isComposing) return;
    if (isModalOpen()) {
      if (e.key === "Escape") {
        e.preventDefault();
        cancelNickConfirm();
      }
      return;
    }
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  document.addEventListener("keydown", (e) => {
    if (isModalOpen() && e.key === "Escape") {
      e.preventDefault();
      cancelNickConfirm();
    }
  });

  function cycleTone() {
    const idx = TONES.indexOf(state.tone);
    state.tone = TONES[(idx + 1) % TONES.length];
    updateToneDot();
    showToast(`${TONE_LABELS[state.tone]} 말풍선`);
  }

  function updateToneDot() {
    const btn = document.getElementById("toneBtn");
    btn.classList.remove("tone-blue", "tone-lav", "tone-yellow", "tone-green", "tone-peach", "tone-mint", "tone-coral");
    if (state.tone !== "pink") {
      btn.classList.add(`tone-${state.tone}`);
    }
  }

  function createDateDividerEl(dateKey) {
    const div = document.createElement("div");
    div.className = "date-divider";
    const pill = document.createElement("span");
    pill.className = "date-pill";
    pill.textContent = formatDateLabel(dateKey);
    div.appendChild(pill);
    return div;
  }

  function executeSendMessage(senderName) {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;

    isSending = true;
    const now = new Date();
    const todayKey = getDateKey(now);
    const lastMsg = state.messages[state.messages.length - 1];
    const dateChanged = !lastMsg || lastMsg.date !== todayKey;

    const newMsg = {
      id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
      sender: senderName,
      text,
      date: todayKey,
      time: formatTimeNow(now),
      tone: state.tone
    };

    input.value = "";
    input.style.height = "18px";

    if (dateChanged) {
      const streamEl = document.getElementById("chatStream");
      const emptyEl = streamEl.querySelector(".empty-chat");
      if (emptyEl) emptyEl.remove();

      const dividerEl = createDateDividerEl(todayKey);
      streamEl.appendChild(dividerEl);
      streamEl.scrollTop = streamEl.scrollHeight;

      setTimeout(() => {
        state.messages.push(newMsg);
        render({ scrollToBottom: true });
        saveStateNow();
        isSending = false;
      }, 260);
    } else {
      state.messages.push(newMsg);
      render({ scrollToBottom: true });
      saveStateNow();
      isSending = false;
    }
  }

  function sendMessage() {
    if (isSending || isModalOpen()) return;

    const nickInput = document.getElementById("nickInput");
    const sender = isNickLocked && myNick ? myNick : String(nickInput.value || "").trim();
    if (!sender) {
      highlightNickRequired();
      return;
    }

    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;

    if (!isNickLocked) {
      openNickConfirmModal(sender);
      return;
    }

    nickInput.value = myNick;
    executeSendMessage(myNick);
  }

  function deleteMessage(id, e) {
    if (e) e.stopPropagation();
    const currentNick = String(isNickLocked && myNick ? myNick : (document.getElementById("nickInput")?.value || myNick || "")).trim();
    if (!currentNick) return;

    const target = state.messages.find(m => m.id === id);
    if (!target || target.sender !== currentNick) return;

    deletedIds.add(id);
    saveDeletedCache();
    state.messages = state.messages.filter(m => m.id !== id);
    render({ scrollToBottom: false });
    saveStateNow();
  }

  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById("copyToast");
    toast.textContent = msg || "복사됨!";
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 1200);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
    showToast("복사됨!");
  }

  function render({ scrollToBottom = false } = {}) {
    updateToneDot();
    applyNickLockUI();
    const streamEl = document.getElementById("chatStream");
    streamEl.innerHTML = "";

    if (state.messages.length === 0) {
      streamEl.innerHTML = `<div class="empty-chat">대화를 남겨보세요</div>`;
      return;
    }

    const currentNick = String(isNickLocked && myNick ? myNick : (document.getElementById("nickInput")?.value || myNick || "")).trim();

    state.messages.forEach((msg, idx) => {
      const prev = state.messages[idx - 1];
      const next = state.messages[idx + 1];

      const isNewDate = !prev || prev.date !== msg.date;
      if (isNewDate) {
        streamEl.appendChild(createDateDividerEl(msg.date));
      }

      const isMine = Boolean(currentNick && msg.sender && msg.sender === currentNick);
      const prevIsMine = prev ? Boolean(currentNick && prev.sender && prev.sender === currentNick) : null;
      const nextIsMine = next ? Boolean(currentNick && next.sender && next.sender === currentNick) : null;

      // 같은 날 + 같은 보낸 사람 + 같은 분(msg.time)일 때만 하나의 말풍선 묶음으로 연결
      const sameMinuteAsPrev = prev && !isNewDate && prev.sender === msg.sender && prevIsMine === isMine && prev.time === msg.time;
      const nextIsNewDate = next && next.date !== msg.date;
      const isLastInMinuteGroup = !next || nextIsNewDate || next.sender !== msg.sender || nextIsMine !== isMine || next.time !== msg.time;
      const isNewMinuteAfterSameUser = prev && !isNewDate && prev.sender === msg.sender && prevIsMine === isMine && prev.time !== msg.time;

      const block = document.createElement("div");
      block.className = "msg-block " + (isMine ? "mine" : "other") + (isNewMinuteAfterSameUser ? " new-minute-gap" : "");

      if (!isMine && msg.sender && !sameMinuteAsPrev) {
        const senderEl = document.createElement("div");
        senderEl.className = "msg-sender";
        senderEl.textContent = msg.sender;
        block.appendChild(senderEl);
      }

      const row = document.createElement("div");
      row.className = "msg-row";

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble" + (msg.tone && msg.tone !== "pink" ? ` tone-${msg.tone}` : "");
      bubble.textContent = msg.text;
      bubble.title = "클릭 시 복사";
      bubble.onclick = () => copyText(msg.text);

      if (isMine) {
        const meta = document.createElement("div");
        meta.className = "msg-meta";

        const actions = document.createElement("div");
        actions.className = "msg-actions";

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "act-btn";
        delBtn.textContent = "×";
        delBtn.title = "삭제";
        delBtn.onclick = (e) => deleteMessage(msg.id, e);

        actions.appendChild(delBtn);
        meta.appendChild(actions);

        if (isLastInMinuteGroup && msg.time) {
          const timeSpan = document.createElement("span");
          timeSpan.className = "msg-time";
          timeSpan.textContent = msg.time;
          meta.appendChild(timeSpan);
        }

        row.appendChild(meta);
        row.appendChild(bubble);
      } else {
        row.appendChild(bubble);

        if (isLastInMinuteGroup && msg.time) {
          const meta = document.createElement("div");
          meta.className = "msg-meta";
          const timeSpan = document.createElement("span");
          timeSpan.className = "msg-time";
          timeSpan.textContent = msg.time;
          meta.appendChild(timeSpan);
          row.appendChild(meta);
        }
      }

      block.appendChild(row);
      streamEl.appendChild(block);
    });

    if (scrollToBottom) {
      streamEl.scrollTop = streamEl.scrollHeight;
    }
  }

  render({ scrollToBottom: true });
  loadState({ isPolling: false, manual: false });
</script>
</body>
</html>
