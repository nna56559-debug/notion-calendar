<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; padding: 4px; }

  .spec-card {
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid #F9E5E9;
    border-radius: 22px;
    padding: 12px 14px;
    box-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .s-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .s-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 7px;
    border-radius: 7px;
    background: #FCE6ED;
    color: #C95B7A;
    flex-shrink: 0;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .search-input {
    width: 96px;
    border: 1px solid #F2DCE2;
    background: #FDFBFC;
    border-radius: 7px;
    padding: 3px 7px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    color: #4A4442;
    outline: none;
  }
  .search-input:focus { border-color: #F29CB4; background: #FFFFFF; }
  .search-btn {
    border: none;
    background: #E4F1FA;
    color: #3D7496;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3.5px 8px;
    border-radius: 7px;
    cursor: pointer;
  }
  .search-btn:hover { background: #D0E8F7; }

  .prof-box {
    background: #FDFBFC;
    border: 1px solid #F5E8EC;
    border-radius: 12px;
    padding: 7px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .prof-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .p-name {
    font-size: 11.5px;
    font-weight: 900;
    color: #4A4442;
  }
  .p-lv {
    font-size: 10px;
    font-weight: 900;
    color: #C95B7A;
    background: #FCE8EE;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .prof-sub {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    font-weight: 700;
    color: #8C8280;
    flex-wrap: wrap;
  }
  .cp-tag {
    color: #B37E22;
    background: #FCF6E3;
    border: 1px solid #F3E5BE;
    padding: 0.5px 5px;
    border-radius: 5px;
    font-size: 8.5px;
    font-weight: 800;
  }

  .sec-row {
    display: flex;
    flex-direction: column;
    gap: 3.5px;
  }
  .sec-label {
    font-size: 9px;
    font-weight: 800;
    color: #9A908D;
  }
  .tag-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .eq-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: #F2F8FC;
    border: 1px solid #DCECF7;
    color: #3D7496;
  }
  .eq-pill b { color: #265675; }

  .acc-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .acc-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 9px;
    background: #FAF9FB;
    border: 1px solid #EFEAF3;
    border-radius: 7px;
    padding: 2.5px 7px;
  }
  .acc-part {
    font-weight: 800;
    color: #5C5350;
    flex-shrink: 0;
  }
  .acc-opt-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 3px;
  }
  .opt-pill {
    font-size: 8.5px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 5px;
  }
  .opt-high { background: #FFF8D6; border: 1px solid #F3DF8A; color: #9E7200; }
  .opt-mid  { background: #F5EEFF; border: 1px solid #E0CEF7; color: #6E42A8; }
  .opt-low  { background: #EAF6FF; border: 1px solid #CBE6FA; color: #2E6F9E; }

  .grid-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: #F0F9FF;
    border: 1px solid #CBE8FA;
    color: #266A99;
    display: inline-flex;
    align-items: center;
    gap: 3.5px;
  }
  .grid-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #38BDF8;
    flex-shrink: 0;
  }
  .grid-pill b {
    color: #1A4E75;
  }

  .gem-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: #FDF4F7;
    border: 1px solid #F5DCE3;
    color: #C95B7A;
  }
  .gem-pill.cd {
    background: #F3FAF6;
    border-color: #DCEEE3;
    color: #3D7A56;
  }
  .gem-pill.radiant {
    background: #FFF6E0;
    border-color: #F4DCA3;
    color: #A67312;
  }
  .empty-txt {
    text-align: center;
    font-size: 10px;
    color: #B5AEAB;
    padding: 28px 0;
  }
</style>
</head>
<body>
  <div class="spec-card">
    <div class="s-head">
      <span class="s-badge">캐릭터 조회</span>
      <div class="search-box">
        <input type="text" class="search-input" id="nameInput" placeholder="" onkeydown="if(event.key==='Enter') fetchSpec()">
        <button type="button" class="search-btn" id="searchBtn" onclick="fetchSpec()">검색</button>
      </div>
    </div>

    <div id="contentArea">
      <div class="empty-txt">불러오는 중...</div>
    </div>
  </div>

<script>
  const API_BASE = "https://notion-cal.binhaha329.workers.dev";

  function buildEquipments(data) {
    const rawList = Array.isArray(data.equipments) ? [...data.equipments] : [];
    const hasGauntlet = rawList.some(e => e && String(e.part || "").includes("완갑"));
    if (!hasGauntlet) {
      const extraGauntlet = data.gauntlet || data.bracer || null;
      if (extraGauntlet && typeof extraGauntlet === "object") {
        rawList.push({
          part: extraGauntlet.part || "완갑",
          hone: extraGauntlet.hone ?? "-",
          extra: extraGauntlet.extra || ""
        });
      } else if (extraGauntlet) {
        rawList.push({ part: "완갑", hone: String(extraGauntlet), extra: "" });
      }
    }
    return rawList;
  }

  function formatGemPills(list) {
    return (Array.isArray(list) ? list : [])
      .filter(g => g && g.label)
      .map(g => {
        const lbl = String(g.label || "");
        let cls = "";
        if (lbl.includes("작") || lbl.includes("홍")) cls = "cd";
        else if (lbl.includes("광")) cls = "radiant";
        return `<span class="gem-pill ${cls}">${lbl} ×${g.count}</span>`;
      })
      .join("");
  }

  async function fetchSpec(defaultName) {
    const input = document.getElementById("nameInput");
    const btn = document.getElementById("searchBtn");
    const area = document.getElementById("contentArea");
    const keyword = (defaultName || input.value).trim();
    if (!keyword) return;

    btn.textContent = "검색중";
    btn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/spec?name=${encodeURIComponent(keyword)}&t=${Date.now()}`);
      const data = await res.json();

      if (!data || !data.ok) {
        area.innerHTML = `<div class="empty-txt">캐릭터 정보를 찾을 수 없어요</div>`;
      } else {
        const subParts = [data.server, data.job, data.guild ? `길드 ${data.guild}` : ""].filter(Boolean);
        const cpHtml = data.combatPower ? `<span class="cp-tag">전투력 ${data.combatPower}</span>` : "";

        const eqList = buildEquipments(data);
        const eqHtml = eqList.length > 0
          ? eqList.map(e => {
              const extraTxt = e.extra ? ` (${e.extra})` : "";
              return `<span class="eq-pill">${e.part} <b>${e.hone}</b>${extraTxt}</span>`;
            }).join("")
          : `<span class="eq-pill">장착 장비 없음</span>`;

        const accHtml = (data.accessories || []).length > 0
          ? data.accessories.map(a => {
              const optsHtml = (a.opts || []).length > 0
                ? a.opts.map(o => `<span class="opt-pill opt-${o.tier}">${o.text}</span>`).join("")
                : `<span class="opt-pill opt-low">연마 없음</span>`;
              return `
                <div class="acc-item">
                  <span class="acc-part">${a.part}</span>
                  <div class="acc-opt-wrap">${optsHtml}</div>
                </div>
              `;
            }).join("")
          : `<div class="acc-item"><span class="acc-part">장착 악세 없음</span></div>`;

        const gridHtml = (data.arkGridEffects || []).length > 0
          ? data.arkGridEffects.map(g =>
              `<span class="grid-pill"><span class="grid-dot"></span>${g.name} <b>Lv.${g.level}</b></span>`
            ).join("")
          : `<span class="grid-pill">미적용</span>`;

        const sourceGems = (Array.isArray(data.gems) && data.gems.length > 0)
          ? data.gems
          : (Array.isArray(data.boundGems) ? data.boundGems : []);
        const gemHtml = formatGemPills(sourceGems) || `<span class="gem-pill">장착 보석 없음</span>`;

        area.innerHTML = `
          <div class="prof-box">
            <div class="prof-top">
              <span class="p-name">${data.name}</span>
              <span class="p-lv">Lv.${data.lv}</span>
            </div>
            <div class="prof-sub">
              <span>${subParts.join(" · ")}</span>
              ${cpHtml}
            </div>
          </div>

          <div class="sec-row">
            <span class="sec-label">장비</span>
            <div class="tag-wrap">${eqHtml}</div>
          </div>

          <div class="sec-row">
            <span class="sec-label">악세</span>
            <div class="acc-list">${accHtml}</div>
          </div>

          <div class="sec-row">
            <span class="sec-label">아크 그리드</span>
            <div class="tag-wrap">${gridHtml}</div>
          </div>

          <div class="sec-row">
            <span class="sec-label">보석</span>
            <div class="tag-wrap">${gemHtml}</div>
          </div>
        `;
        if (!defaultName) input.value = "";
      }
    } catch (e) {
      area.innerHTML = `<div class="empty-txt">검색 중 오류가 발생했어요</div>`;
    } finally {
      btn.textContent = "검색";
      btn.disabled = false;
    }
  }

  fetchSpec("양녕하새오");
</script>
</body>
</html>
