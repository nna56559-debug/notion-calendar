<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; padding: 4px; }

  :root {
    --page-bg: transparent;
    --card-bg: #FFFFFF;
    --card-border: #F9E5E9;
    --card-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    --scroll-thumb: #F2DCE2;
    --badge-bg: #FCE6ED;
    --badge-fg: #C95B7A;
    --inp-border: #F2DCE2;
    --inp-bg: #FDFBFC;
    --inp-focus-bg: #FFFFFF;
    --txt-main: #4A4442;
    --txt-sub: #8C8280;
    --sec-label: #9A908D;
    --btn-bg: #E4F1FA;
    --btn-fg: #3D7496;
    --btn-hover-bg: #D0E8F7;
    --prof-bg: #FDFBFC;
    --prof-border: #F5E8EC;
    --lv-bg: #FCE8EE;
    --lv-fg: #C95B7A;
    --cp-bg: #FCF6E3;
    --cp-border: #F3E5BE;
    --cp-fg: #B37E22;
    --eq-bg: #F2F8FC;
    --eq-border: #DCECF7;
    --eq-fg: #3D7496;
    --eq-bold: #265675;
    --acc-bg: #FAF9FB;
    --acc-border: #EFEAF3;
    --acc-part: #5C5350;
    --high-bg: #FFF8D6;
    --high-border: #F3DF8A;
    --high-fg: #9E7200;
    --mid-bg: #F5EEFF;
    --mid-border: #E0CEF7;
    --mid-fg: #6E42A8;
    --low-bg: #EAF6FF;
    --low-border: #CBE6FA;
    --low-fg: #2E6F9E;
    --grid-bg: #F0F9FF;
    --grid-border: #CBE8FA;
    --grid-fg: #266A99;
    --grid-bold: #1A4E75;
    --grid-dot: #38BDF8;
    --br-box-bg: #FAF9FB;
    --br-box-border: #EFEAF3;
    --gem-bg: #FDF4F7;
    --gem-border: #F5DCE3;
    --gem-fg: #C95B7A;
    --gem-cd-bg: #F3FAF6;
    --gem-cd-border: #DCEEE3;
    --gem-cd-fg: #3D7A56;
    --gem-rad-bg: #FFF6E0;
    --gem-rad-border: #F4DCA3;
    --gem-rad-fg: #A67312;
    --empty-fg: #B5AEAB;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #191919;
      --card-bg: #1B1A20;
      --card-border: #383342;
      --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
      --scroll-thumb: #4B3846;
      --badge-bg: #3B252E;
      --badge-fg: #F5A3BC;
      --inp-border: #3A3646;
      --inp-bg: #24232B;
      --inp-focus-bg: #2C2A35;
      --txt-main: #F4F2F8;
      --txt-sub: #B5B0C4;
      --sec-label: #9A95A8;
      --btn-bg: #243947;
      --btn-fg: #9BD0F0;
      --btn-hover-bg: #2E495C;
      --prof-bg: #24232B;
      --prof-border: #3A3646;
      --lv-bg: #3B252E;
      --lv-fg: #F5A3BC;
      --cp-bg: #352F20;
      --cp-border: #524830;
      --cp-fg: #F2C46D;
      --eq-bg: #1C2B36;
      --eq-border: #2C4354;
      --eq-fg: #9BD0F0;
      --eq-bold: #D6EEFC;
      --acc-bg: #24232B;
      --acc-border: #3A3646;
      --acc-part: #E2DDF0;
      --high-bg: #3B321B;
      --high-border: #5E4F29;
      --high-fg: #F7D477;
      --mid-bg: #2C2440;
      --mid-border: #483A69;
      --mid-fg: #CBB8FA;
      --low-bg: #1C2E3D;
      --low-border: #2C4961;
      --low-fg: #9AD2F5;
      --grid-bg: #1B2D3B;
      --grid-border: #2B475C;
      --grid-fg: #9BD0F0;
      --grid-bold: #E2F3FD;
      --grid-dot: #56CCF2;
      --br-box-bg: #24232B;
      --br-box-border: #3A3646;
      --gem-bg: #2E2028;
      --gem-border: #4A313E;
      --gem-fg: #F5A3BC;
      --gem-cd-bg: #1C352B;
      --gem-cd-border: #2E5243;
      --gem-cd-fg: #8EE0B5;
      --gem-rad-bg: #352F20;
      --gem-rad-border: #524830;
      --gem-rad-fg: #F2C46D;
      --empty-fg: #878296;
    }
  }

  :root[data-theme="dark"] {
    --page-bg: #191919;
    --card-bg: #1B1A20;
    --card-border: #383342;
    --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
    --scroll-thumb: #4B3846;
    --badge-bg: #3B252E;
    --badge-fg: #F5A3BC;
    --inp-border: #3A3646;
    --inp-bg: #24232B;
    --inp-focus-bg: #2C2A35;
    --txt-main: #F4F2F8;
    --txt-sub: #B5B0C4;
    --sec-label: #9A95A8;
    --btn-bg: #243947;
    --btn-fg: #9BD0F0;
    --btn-hover-bg: #2E495C;
    --prof-bg: #24232B;
    --prof-border: #3A3646;
    --lv-bg: #3B252E;
    --lv-fg: #F5A3BC;
    --cp-bg: #352F20;
    --cp-border: #524830;
    --cp-fg: #F2C46D;
    --eq-bg: #1C2B36;
    --eq-border: #2C4354;
    --eq-fg: #9BD0F0;
    --eq-bold: #D6EEFC;
    --acc-bg: #24232B;
    --acc-border: #3A3646;
    --acc-part: #E2DDF0;
    --high-bg: #3B321B;
    --high-border: #5E4F29;
    --high-fg: #F7D477;
    --mid-bg: #2C2440;
    --mid-border: #483A69;
    --mid-fg: #CBB8FA;
    --low-bg: #1C2E3D;
    --low-border: #2C4961;
    --low-fg: #9AD2F5;
    --grid-bg: #1B2D3B;
    --grid-border: #2B475C;
    --grid-fg: #9BD0F0;
    --grid-bold: #E2F3FD;
    --grid-dot: #56CCF2;
    --br-box-bg: #24232B;
    --br-box-border: #3A3646;
    --gem-bg: #2E2028;
    --gem-border: #4A313E;
    --gem-fg: #F5A3BC;
    --gem-cd-bg: #1C352B;
    --gem-cd-border: #2E5243;
    --gem-cd-fg: #8EE0B5;
    --gem-rad-bg: #352F20;
    --gem-rad-border: #524830;
    --gem-rad-fg: #F2C46D;
    --empty-fg: #878296;
  }

  html, body {
    background: var(--page-bg);
  }

  .spec-card {
    width: 100%;
    height: 410px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 22px;
    padding: 12px 14px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  /* 우측 '...' 더보기 영역과 겹치지 않도록 왼쪽 정렬 및 우측 여백 확보 */
  .s-head {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
    padding-right: 42px;
    flex-shrink: 0;
  }
  .s-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 7px;
    border-radius: 7px;
    background: var(--badge-bg);
    color: var(--badge-fg);
    flex-shrink: 0;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .search-input {
    width: 88px;
    min-width: 0;
    border: 1px solid var(--inp-border);
    background: var(--inp-bg);
    border-radius: 7px;
    padding: 3px 7px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    color: var(--txt-main);
    outline: none;
  }
  .search-input:focus { border-color: #F29CB4; background: var(--inp-focus-bg); }
  .search-btn {
    border: none;
    background: var(--btn-bg);
    color: var(--btn-fg);
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3.5px 8px;
    border-radius: 7px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .search-btn:hover { background: var(--btn-hover-bg); }

  #contentArea {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #contentArea::-webkit-scrollbar { width: 4px; }
  #contentArea::-webkit-scrollbar-track { background: transparent; }
  #contentArea::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }

  .prof-box {
    background: var(--prof-bg);
    border: 1px solid var(--prof-border);
    border-radius: 12px;
    padding: 7px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex-shrink: 0;
  }
  .prof-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .p-name {
    font-size: 11.5px;
    font-weight: 900;
    color: var(--txt-main);
  }
  .p-lv {
    font-size: 10px;
    font-weight: 900;
    color: var(--lv-fg);
    background: var(--lv-bg);
    padding: 2px 7px;
    border-radius: 6px;
  }
  .prof-sub {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    font-weight: 700;
    color: var(--txt-sub);
    flex-wrap: wrap;
  }
  .cp-tag {
    color: var(--cp-fg);
    background: var(--cp-bg);
    border: 1px solid var(--cp-border);
    padding: 0.5px 5px;
    border-radius: 5px;
    font-size: 8.5px;
    font-weight: 800;
  }

  .sec-row {
    display: flex;
    flex-direction: column;
    gap: 3.5px;
    flex-shrink: 0;
  }
  .sec-label {
    font-size: 9px;
    font-weight: 800;
    color: var(--sec-label);
  }
  .tag-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .eq-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: var(--eq-bg);
    border: 1px solid var(--eq-border);
    color: var(--eq-fg);
  }
  .eq-pill b { color: var(--eq-bold); }

  .acc-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .acc-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 9px;
    background: var(--acc-bg);
    border: 1px solid var(--acc-border);
    border-radius: 7px;
    padding: 3px 7px;
    flex-wrap: wrap;
  }
  .acc-part {
    font-weight: 800;
    color: var(--acc-part);
    flex-shrink: 0;
  }
  .acc-opt-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 3px;
    flex: 1;
    min-width: 0;
  }
  .opt-pill {
    font-size: 8.5px;
    font-weight: 800;
    padding: 1.5px 5.5px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .opt-high { background: var(--high-bg); border: 1px solid var(--high-border); color: var(--high-fg); }
  .opt-mid  { background: var(--mid-bg); border: 1px solid var(--mid-border); color: var(--mid-fg); }
  .opt-low  { background: var(--low-bg); border: 1px solid var(--low-border); color: var(--low-fg); }

  .grid-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: var(--grid-bg);
    border: 1px solid var(--grid-border);
    color: var(--grid-fg);
    display: inline-flex;
    align-items: center;
    gap: 3.5px;
  }
  .grid-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--grid-dot);
    flex-shrink: 0;
  }
  .grid-pill b {
    color: var(--grid-bold);
  }

  .br-box {
    background: var(--br-box-bg);
    border: 1px solid var(--br-box-border);
    border-radius: 8px;
    padding: 5px 7px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .br-line {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
  }
  .br-pill {
    font-size: 8.5px;
    font-weight: 800;
    padding: 1.5px 5.5px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .br-empty {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--empty-fg);
  }

  .gem-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: var(--gem-bg);
    border: 1px solid var(--gem-border);
    color: var(--gem-fg);
  }
  .gem-pill.cd {
    background: var(--gem-cd-bg);
    border-color: var(--gem-cd-border);
    color: var(--gem-cd-fg);
  }
  .gem-pill.radiant {
    background: var(--gem-rad-bg);
    border-color: var(--gem-rad-border);
    color: var(--gem-rad-fg);
  }
  .empty-txt {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    color: var(--empty-fg);
    padding: 28px 0;
  }

  @media (max-width: 480px) {
    body {
      padding: 2px;
    }
    .spec-card {
      height: 350px;
      border-radius: 16px;
      padding: 9px 10px;
      gap: 6px;
    }
    .s-head {
      padding-right: 38px;
    }
    .search-input {
      width: 72px;
      font-size: 9.5px;
      padding: 2.5px 6px;
    }
    .search-btn {
      font-size: 9px;
      padding: 3px 6.5px;
    }
    .prof-box {
      border-radius: 10px;
      padding: 6px 8px;
    }
    .p-name {
      font-size: 11px;
    }
    .acc-item {
      flex-direction: column;
      align-items: flex-start;
      gap: 2.5px;
    }
    .acc-opt-wrap {
      justify-content: flex-start;
    }
  }
</style>
</head>
<body>
  <div class="spec-card">
    <div class="s-head">
      <span class="s-badge">캐릭터 조회</span>
      <div class="search-box">
        <input type="text" class="search-input" id="nameInput" onkeydown="if(event.key==='Enter') fetchSpec()">
        <button type="button" class="search-btn" id="searchBtn" onclick="fetchSpec()">검색</button>
      </div>
    </div>

    <div id="contentArea">
      <div class="empty-txt">불러오는 중...</div>
    </div>
  </div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();

  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  const STATS_KEYWORDS = ["치명", "특화", "신속", "제압", "인내", "숙련"];

  function buildEquipments(data) {
    const rawList = Array.isArray(data.equipments) ? [...data.equipments] : [];
    const hasGauntlet = rawList.some(e => e && String(e.part || "").includes("완갑"));
    if (!hasGauntlet) {
      const extraGauntlet = data.gauntlet || null;
      if (extraGauntlet && typeof extraGauntlet === "object") {
        rawList.push({
          part: extraGauntlet.part || "완갑",
          hone: extraGauntlet.hone ?? "-",
          extra: extraGauntlet.extra || ""
        });
      } else if (extraGauntlet) {
        rawList.push({ part: "완갑", hone: String(extraGauntlet), extra: "" });
      }
    }
    return rawList;
  }

  function normalizeTier(rawTier) {
    const t = String(rawTier || "").toLowerCase();
    if (t === "high" || t === "상" || t === "3") return "high";
    if (t === "mid" || t === "중" || t === "2") return "mid";
    return "low";
  }

  function parseBraceletItem(item, isOption = false) {
    if (!item || typeof item !== "object") return null;
    const text = String(item.text || item.label || item.name || "")
      .replace(/<[^>]*>/g, "")
      .trim();
    if (!text) return null;

    const tier = normalizeTier(item.tier || item.grade);
    const isStat = typeof item.isStat === "boolean"
      ? item.isStat
      : (!isOption && STATS_KEYWORDS.some(k => text.startsWith(k + " ") || text === k));

    return { text, tier, isStat };
  }

  function buildBraceletData(data) {
    const br = data.bracelet;
    const stats = [];
    const options = [];
    const hasBraceletField = Boolean(br && typeof br === "object");

    if (hasBraceletField) {
      if (Array.isArray(br.stats)) {
        br.stats.forEach(s => {
          const p = parseBraceletItem(s, false);
          if (p) {
            if (p.isStat) stats.push({ text: p.text, tier: p.tier });
            else options.push({ text: p.text, tier: p.tier });
          }
        });
      }
      if (Array.isArray(br.options)) {
        br.options.forEach(o => {
          const p = parseBraceletItem(o, true);
          if (p) options.push({ text: p.text, tier: p.tier });
        });
      }
    }
    return { stats, options, hasBraceletField };
  }

  function formatGemPills(list) {
    return (Array.isArray(list) ? list : [])
      .filter(g => g && g.label)
      .map(g => {
        const lbl = String(g.label || "");
        let cls = "";
        if (lbl.includes("작") || lbl.includes("홍")) cls = "cd";
        else if (lbl.includes("광")) cls = "radiant";
        return `<span class="gem-pill ${cls}">${lbl} ×${g.count}</span>`;
      })
      .join("");
  }

  async function fetchSpec(defaultName) {
    const input = document.getElementById("nameInput");
    const btn = document.getElementById("searchBtn");
    const area = document.getElementById("contentArea");
    const keyword = (defaultName || input.value).trim();
    if (!keyword) return;

    btn.textContent = "검색중";
    btn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/spec?name=${encodeURIComponent(keyword)}&t=${Date.now()}`);
      const data = await res.json();

      if (!data || !data.ok) {
        const msg = data?.reason === "profile_status_503"
          ? "로스트아크 서버 점검 중이에요"
          : data?.reason === "profile_status_429"
          ? "요청이 많아 잠시 후 다시 시도해 주세요"
          : "캐릭터 정보를 찾을 수 없어요";
        area.innerHTML = `<div class="empty-txt">${msg}</div>`;
      } else {
        const subParts = [data.server, data.job, data.guild ? `길드 ${data.guild}` : ""].filter(Boolean);
        const cpHtml = data.combatPower ? `<span class="cp-tag">전투력 ${data.combatPower}</span>` : "";

        const eqList = buildEquipments(data);
        const eqHtml = eqList.length > 0
          ? eqList.map(e => {
              const extraTxt = e.extra ? ` (${e.extra})` : "";
              return `<span class="eq-pill">${e.part} <b>${e.hone}</b>${extraTxt}</span>`;
            }).join("")
          : `<span class="eq-pill">장착 장비 없음</span>`;

        const accHtml = (data.accessories || []).length > 0
          ? data.accessories.map(a => {
              const optsHtml = (a.opts || []).length > 0
                ? a.opts.map(o => `<span class="opt-pill opt-${o.tier}">${o.text}</span>`).join("")
                : `<span class="opt-pill opt-low">연마 없음</span>`;
              return `
                <div class="acc-item">
                  <span class="acc-part">${a.part}</span>
                  <div class="acc-opt-wrap">${optsHtml}</div>
                </div>
              `;
            }).join("")
          : `<div class="acc-item"><span class="acc-part">장착 악세 없음</span></div>`;

        const gridHtml = (data.arkGridEffects || []).length > 0
          ? data.arkGridEffects.map(g =>
              `<span class="grid-pill"><span class="grid-dot"></span>${g.name} <b>Lv.${g.level}</b></span>`
            ).join("")
          : `<span class="grid-pill">미적용</span>`;

        const brData = buildBraceletData(data);
        const allBrOpts = [...brData.options].filter(o => !/^도약\b/.test(o.text));
        const brLines = [];
        if (brData.stats.length > 0) {
          brLines.push(
            `<div class="br-line">${brData.stats.map(s => `<span class="br-pill opt-${s.tier}">${s.text}</span>`).join("")}</div>`
          );
        }
        if (allBrOpts.length > 0) {
          brLines.push(
            `<div class="br-line">${allBrOpts.map(o => `<span class="br-pill opt-${o.tier}">${o.text}</span>`).join("")}</div>`
          );
        }
        if (brLines.length === 0 && brData.hasBraceletField) {
          brLines.push(`<div class="br-line"><span class="br-empty">등록된 특성/옵션 없음</span></div>`);
        }
        const brHtml = brLines.length > 0
          ? `<div class="sec-row"><span class="sec-label">팔찌</span><div class="br-box">${brLines.join("")}</div></div>`
          : "";
        
        const sourceGems = (Array.isArray(data.gems) && data.gems.length > 0)
          ? data.gems
          : (Array.isArray(data.boundGems) ? data.boundGems : []);
        const gemHtml = formatGemPills(sourceGems) || `<span class="gem-pill">장착 보석 없음</span>`;

        area.innerHTML = `
          <div class="prof-box">
            <div class="prof-top">
              <span class="p-name">${data.name}</span>
              <span class="p-lv">Lv.${data.lv}</span>
            </div>
            <div class="prof-sub">
              <span>${subParts.join(" · ")}</span>
              ${cpHtml}
            </div>
          </div>

          <div class="sec-row">
            <span class="sec-label">장비</span>
            <div class="tag-wrap">${eqHtml}</div>
          </div>

          <div class="sec-row">
            <span class="sec-label">악세</span>
            <div class="acc-list">${accHtml}</div>
          </div>

          <div class="sec-row">
            <span class="sec-label">아크 그리드</span>
            <div class="tag-wrap">${gridHtml}</div>
          </div>

          ${brHtml}

          <div class="sec-row">
            <span class="sec-label">보석</span>
            <div class="tag-wrap">${gemHtml}</div>
          </div>
        `;
        if (!defaultName) input.value = "";
      }
    } catch (e) {
      area.innerHTML = `<div class="empty-txt">검색 중 오류가 발생했어요</div>`;
    } finally {
      btn.textContent = "검색";
      btn.disabled = false;
    }
  }

  fetchSpec("앙녕하새오");
</script>
</body>
</html>
