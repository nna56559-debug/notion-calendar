  html, body {
    background: var(--page-bg);
  }

  .spec-card {
    width: 100%;
    height: 410px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 22px;
    padding: 12px 14px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  .s-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-shrink: 0;
  }
  .s-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 7px;
    border-radius: 7px;
    background: var(--badge-bg);
    color: var(--badge-fg);
    flex-shrink: 0;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .search-input {
    width: 96px;
    border: 1px solid var(--inp-border);
    background: var(--inp-bg);
    border-radius: 7px;
    padding: 3px 7px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    color: var(--txt-main);
    outline: none;
  }
  .search-input:focus { border-color: #F29CB4; background: var(--inp-focus-bg); }
  .search-btn {
    border: none;
    background: var(--btn-bg);
    color: var(--btn-fg);
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3.5px 8px;
    border-radius: 7px;
    cursor: pointer;
  }
  .search-btn:hover { background: var(--btn-hover-bg); }

  #contentArea {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #contentArea::-webkit-scrollbar { width: 4px; }
  #contentArea::-webkit-scrollbar-track { background: transparent; }
  #contentArea::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }

  .prof-box {
    background: var(--prof-bg);
    border: 1px solid var(--prof-border);
    border-radius: 12px;
    padding: 7px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex-shrink: 0;
  }
  .prof-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .p-name {
    font-size: 11.5px;
    font-weight: 900;
    color: var(--txt-main);
  }
  .p-lv {
    font-size: 10px;
    font-weight: 900;
    color: var(--lv-fg);
    background: var(--lv-bg);
    padding: 2px 7px;
    border-radius: 6px;
  }
  .prof-sub {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    font-weight: 700;
    color: var(--txt-sub);
    flex-wrap: wrap;
  }
  .cp-tag {
    color: var(--cp-fg);
    background: var(--cp-bg);
    border: 1px solid var(--cp-border);
    padding: 0.5px 5px;
    border-radius: 5px;
    font-size: 8.5px;
    font-weight: 800;
  }

  .sec-row {
    display: flex;
    flex-direction: column;
    gap: 3.5px;
    flex-shrink: 0;
  }
  .sec-label {
    font-size: 9px;
    font-weight: 800;
    color: var(--sec-label);
  }
  .tag-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .eq-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: var(--eq-bg);
    border: 1px solid var(--eq-border);
    color: var(--eq-fg);
  }
  .eq-pill b { color: var(--eq-bold); }

  .acc-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .acc-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 9px;
    background: var(--acc-bg);
    border: 1px solid var(--acc-border);
    border-radius: 7px;
    padding: 2.5px 7px;
  }
  .acc-part {
    font-weight: 800;
    color: var(--acc-part);
    flex-shrink: 0;
  }
  .acc-opt-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 3px;
  }
  .opt-pill {
    font-size: 8.5px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 5px;
  }
  .opt-high { background: var(--high-bg); border: 1px solid var(--high-border); color: var(--high-fg); }
  .opt-mid  { background: var(--mid-bg); border: 1px solid var(--mid-border); color: var(--mid-fg); }
  .opt-low  { background: var(--low-bg); border: 1px solid var(--low-border); color: var(--low-fg); }

  .grid-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: var(--grid-bg);
    border: 1px solid var(--grid-border);
    color: var(--grid-fg);
    display: inline-flex;
    align-items: center;
    gap: 3.5px;
  }
  .grid-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--grid-dot);
    flex-shrink: 0;
  }
  .grid-pill b {
    color: var(--grid-bold);
  }

  /* 팔찌 한 줄 영역 */
  .br-box {
    background: var(--br-box-bg);
    border: 1px solid var(--br-box-border);
    border-radius: 8px;
    padding: 5px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .br-line {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .br-line::-webkit-scrollbar { display: none; }
  .br-entry {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 9px;
    font-weight: 800;
    color: var(--br-name-fg);
    flex-shrink: 0;
  }
  .br-grade {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 900;
    line-height: 1;
    padding: 2px 3.5px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .br-grade.high { background: var(--high-chip-bg); color: var(--high-chip-fg); }
  .br-grade.mid  { background: var(--mid-chip-bg);  color: var(--mid-chip-fg); }
  .br-grade.low  { background: var(--low-chip-bg);  color: var(--low-chip-fg); }

  .gem-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: var(--gem-bg);
    border: 1px solid var(--gem-border);
    color: var(--gem-fg);
  }
  .gem-pill.cd {
    background: var(--gem-cd-bg);
    border-color: var(--gem-cd-border);
    color: var(--gem-cd-fg);
  }
  .gem-pill.radiant {
    background: var(--gem-rad-bg);
    border-color: var(--gem-rad-border);
    color: var(--gem-rad-fg);
  }
  .empty-txt {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    color: var(--empty-fg);
    padding: 28px 0;
  }

  @media (max-width: 480px) {
    body {
      padding: 2px;
    }
    .spec-card {
      height: 350px;
      border-radius: 16px;
      padding: 9px 10px;
      gap: 6px;
    }
    .search-input {
      width: 78px;
      font-size: 9.5px;
      padding: 2.5px 6px;
    }
    .search-btn {
      font-size: 9px;
      padding: 3px 6.5px;
    }
    .prof-box {
      border-radius: 10px;
      padding: 6px 8px;
    }
    .p-name {
      font-size: 11px;
    }
    .acc-item {
      flex-direction: column;
      align-items: flex-start;
      gap: 2.5px;
    }
    .acc-opt-wrap {
      justify-content: flex-start;
    }
  }
</style>
</head>
<body>
  <div class="spec-card">
    <div class="s-head">
      <span class="s-badge">캐릭터 조회</span>
      <div class="search-box">
        <input type="text" class="search-input" id="nameInput" placeholder="" onkeydown="if(event.key==='Enter') fetchSpec()">
        <button type="button" class="search-btn" id="searchBtn" onclick="fetchSpec()">검색</button>
      </div>
    </div>

    <div id="contentArea">
      <div class="empty-txt">불러오는 중...</div>
    </div>
  </div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();

  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  const STATS_KEYWORDS = ["치명", "특화", "신속", "제압", "인내", "숙련"];

  function buildEquipments(data) {
    const rawList = Array.isArray(data.equipments) ? [...data.equipments] : [];
    const hasGauntlet = rawList.some(e => e && String(e.part || "").includes("완갑"));
    if (!hasGauntlet) {
      const extraGauntlet = data.gauntlet || null;
      if (extraGauntlet && typeof extraGauntlet === "object") {
        rawList.push({
          part: extraGauntlet.part || "완갑",
          hone: extraGauntlet.hone ?? "-",
          extra: extraGauntlet.extra || ""
        });
      } else if (extraGauntlet) {
        rawList.push({ part: "완갑", hone: String(extraGauntlet), extra: "" });
      }
    }
    return rawList;
  }

  function normalizeGrade(rawTier, text) {
    const t = String(rawTier || "").toLowerCase();
    if (t === "high" || t === "상" || t === "3") return "high";
    if (t === "mid" || t === "중" || t === "2") return "mid";
    if (t === "low" || t === "하" || t === "1") return "low";

    if (/(?:^|\s|\[|\()상(?:$|\s|\]|\))/.test(text) || text.endsWith("상")) return "high";
    if (/(?:^|\s|\[|\()중(?:$|\s|\]|\))/.test(text) || text.endsWith("중")) return "mid";
    if (/(?:^|\s|\[|\()하(?:$|\s|\]|\))/.test(text) || text.endsWith("하")) return "low";
    return "";
  }

  function gradeLabel(grade) {
    if (grade === "high") return "상";
    if (grade === "mid") return "중";
    if (grade === "low") return "하";
    return "";
  }

  function cleanOptionLabel(rawText) {
    return String(rawText || "")
      .replace(/\s*[+\-]?\d+(?:\.\d+)?%?\s*$/, "")
      .replace(/\s*[\[(]?(?:상|중|하)[\])]?\s*$/g, "")
      .trim();
  }

  function parseBraceletEntry(item) {
    if (!item) return null;
    if (typeof item === "string") {
      const s = item.trim();
      if (!s) return null;
      const grade = normalizeGrade("", s);
      const label = cleanOptionLabel(s) || s;
      const isStat = STATS_KEYWORDS.some(k => label === k || label.startsWith(k + " "));
      return { label, grade, isStat };
    }
    if (typeof item === "object") {
      const rawText = String(item.text || item.label || item.name || item.option || "").trim();
      if (!rawText) return null;
      const grade = normalizeGrade(item.tier || item.grade, rawText);
      const label = cleanOptionLabel(rawText) || rawText;
      const isStat = typeof item.isStat === "boolean"
        ? item.isStat
        : STATS_KEYWORDS.some(k => label === k || label.startsWith(k + " "));
      return { label, grade, isStat };
    }
    return null;
  }

  function buildBraceletData(data) {
    const br = data.bracelet
      || data.bracer
      || data.braceletEffects
      || data.braceletOptions
      || data.braceletStats
      || (Array.isArray(data.bracelets) ? data.bracelets[0] : null);

    const stats = [];
    const options = [];
    if (!br) return { stats, options };

    let rawItems = [];
    if (Array.isArray(br)) {
      rawItems = br;
    } else if (typeof br === "string") {
      rawItems = br.split(/[·|\n,]/);
    } else if (typeof br === "object") {
      if (Array.isArray(br.stats)) {
        br.stats.forEach(s => {
          const parsed = parseBraceletEntry(s);
          if (parsed) stats.push({ ...parsed, isStat: true });
        });
      }
      const list = Array.isArray(br.options)
        ? br.options
        : (Array.isArray(br.opts) ? br.opts : (Array.isArray(br.effects) ? br.effects : []));
      rawItems = list;
    }

    rawItems.forEach(item => {
      const parsed = parseBraceletEntry(item);
      if (!parsed) return;
      if (parsed.isStat) stats.push(parsed);
      else options.push(parsed);
    });

    return { stats, options: options.slice(0, 3) };
  }

  function renderBraceletEntryHtml(entry) {
    const gl = gradeLabel(entry.grade);
    const chipHtml = gl ? `<span class="br-grade ${entry.grade}">${gl}</span>` : "";
    return `<span class="br-entry">${entry.label}${chipHtml}</span>`;
  }

  function formatGemPills(list) {
    return (Array.isArray(list) ? list : [])
      .filter(g => g && g.label)
      .map(g => {
        const lbl = String(g.label || "");
        let cls = "";
        if (lbl.includes("작") || lbl.includes("홍")) cls = "cd";
        else if (lbl.includes("광")) cls = "radiant";
        return `<span class="gem-pill ${cls}">${lbl} ×${g.count}</span>`;
      })
      .join("");
  }

  async function fetchSpec(defaultName) {
    const input = document.getElementById("nameInput");
    const btn = document.getElementById("searchBtn");
    const area = document.getElementById("contentArea");
    const keyword = (defaultName || input.value).trim();
    if (!keyword) return;

    btn.textContent = "검색중";
    btn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/spec?name=${encodeURIComponent(keyword)}&t=${Date.now()}`);
      const data = await res.json();

      if (!data || !data.ok) {
        area.innerHTML = `<div class="empty-txt">캐릭터 정보를 찾을 수 없어요</div>`;
      } else {
        const subParts = [data.server, data.job, data.guild ? `길드 ${data.guild}` : ""].filter(Boolean);
        const cpHtml = data.combatPower ? `<span class="cp-tag">전투력 ${data.combatPower}</span>` : "";

        const eqList = buildEquipments(data);
        const eqHtml = eqList.length > 0
          ? eqList.map(e => {
              const extraTxt = e.extra ? ` (${e.extra})` : "";
              return `<span class="eq-pill">${e.part} <b>${e.hone}</b>${extraTxt}</span>`;
            }).join("")
          : `<span class="eq-pill">장착 장비 없음</span>`;

        const accHtml = (data.accessories || []).length > 0
          ? data.accessories.map(a => {
              const optsHtml = (a.opts || []).length > 0
                ? a.opts.map(o => `<span class="opt-pill opt-${o.tier}">${o.text}</span>`).join("")
                : `<span class="opt-pill opt-low">연마 없음</span>`;
              return `
                <div class="acc-item">
                  <span class="acc-part">${a.part}</span>
                  <div class="acc-opt-wrap">${optsHtml}</div>
                </div>
              `;
            }).join("")
          : `<div class="acc-item"><span class="acc-part">장착 악세 없음</span></div>`;

        const gridHtml = (data.arkGridEffects || []).length > 0
          ? data.arkGridEffects.map(g =>
              `<span class="grid-pill"><span class="grid-dot"></span>${g.name} <b>Lv.${g.level}</b></span>`
            ).join("")
          : `<span class="grid-pill">미적용</span>`;

        const brData = buildBraceletData(data);
        const brLines = [];
        if (brData.stats.length > 0) {
          brLines.push(`<div class="br-line">${brData.stats.map(renderBraceletEntryHtml).join("")}</div>`);
        }
        if (brData.options.length > 0) {
          brLines.push(`<div class="br-line">${brData.options.map(renderBraceletEntryHtml).join("")}</div>`);
        }
        const brHtml = brLines.length > 0
          ? `<div class="sec-row"><span class="sec-label">팔찌</span><div class="br-box">${brLines.join("")}</div></div>`
          : "";

        const sourceGems = (Array.isArray(data.gems) && data.gems.length > 0)
          ? data.gems
          : (Array.isArray(data.boundGems) ? data.boundGems : []);
        const gemHtml = formatGemPills(sourceGems) || `<span class="gem-pill">장착 보석 없음</span>`;

        area.innerHTML = `
          <div class="prof-box">
            <div class="prof-top">
              <span class="p-name">${data.name}</span>
              <span class="p-lv">Lv.${data.lv}</span>
            </div>
            <div class="prof-sub">
              <span>${subParts.join(" · ")}</span>
              ${cpHtml}
            </div>
          </div>

          <div class="sec-row">
            <span class="sec-label">장비</span>
            <div class="tag-wrap">${eqHtml}</div>
          </div>

          <div class="sec-row">
            <span class="sec-label">악세</span>
            <div class="acc-list">${accHtml}</div>
          </div>

          <div class="sec-row">
            <span class="sec-label">아크 그리드</span>
            <div class="tag-wrap">${gridHtml}</div>
          </div>

          ${brHtml}

          <div class="sec-row">
            <span class="sec-label">보석</span>
            <div class="tag-wrap">${gemHtml}</div>
          </div>
        `;
        if (!defaultName) input.value = "";
      }
    } catch (e) {
      area.innerHTML = `<div class="empty-txt">검색 중 오류가 발생했어요</div>`;
    } finally {
      btn.textContent = "검색";
      btn.disabled = false;
    }
  }

  fetchSpec("양녕하새오");
</script>
</body>
</html>
