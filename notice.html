<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; padding: 4px; }

  .n-card {
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid #F9E5E9;
    border-radius: 22px;
    padding: 12px 14px;
    box-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .n-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tabs { display: flex; gap: 5px; }
  .tab-btn {
    border: none;
    background: #F5F2F3;
    color: #8E8487;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 8px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: #FCE6ED;
    color: #C95B7A;
  }
  .hint { font-size: 9px; font-weight: 600; color: #B8B0AD; }

  .n-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 185px;
    overflow-y: auto;
  }
  .n-list::-webkit-scrollbar { width: 3px; }
  .n-list::-webkit-scrollbar-thumb { background: #F2DCE2; border-radius: 999px; }

  .n-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    text-decoration: none;
    background: #FDFBFC;
    border: 1px solid #F5E8EC;
    border-radius: 9px;
    padding: 6px 9px;
    transition: all 0.15s ease;
  }
  .n-item:hover {
    background: #FFF6F9;
    border-color: #F2C4D2;
  }
  .n-title {
    font-size: 10.5px;
    font-weight: 700;
    color: #4A4442;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .n-date {
    font-size: 9px;
    font-weight: 700;
    color: #A69D9A;
    flex-shrink: 0;
  }
  .empty-txt { text-align: center; font-size: 10px; color: #B5AEAB; padding: 26px 0; }
</style>
</head>
<body>
  <div class="n-card">
    <div class="n-head">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabNotice" onclick="switchTab('notice')">공지사항</button>
        <button type="button" class="tab-btn" id="tabEvent" onclick="switchTab('event')">이벤트</button>
      </div>
      <span class="hint">클릭 시 원문 이동</span>
    </div>
    <div class="n-list" id="nList">
      <div class="empty-txt">불러오는 중...</div>
    </div>
  </div>

<script>
  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  let currentTab = "notice";
  let cache = { notices: [], events: [] };

  async function loadData() {
    try {
      const res = await fetch(`${API_BASE}/notice?t=${Date.now()}`);
      const data = await res.json();
      cache.notices = Array.isArray(data.notices) ? data.notices : [];
      cache.events = Array.isArray(data.events) ? data.events : [];
      render();
    } catch (e) {
      document.getElementById("nList").innerHTML = `<div class="empty-txt">불러오기 실패</div>`;
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tabNotice").classList.toggle("active", tab === "notice");
    document.getElementById("tabEvent").classList.toggle("active", tab === "event");
    render();
  }

  function render() {
    const listEl = document.getElementById("nList");
    const arr = currentTab === "notice" ? cache.notices : cache.events;

    if (!arr || arr.length === 0) {
      listEl.innerHTML = `<div class="empty-txt">${currentTab === "notice" ? "공지사항이 없습니다" : "진행 중인 이벤트가 없습니다"}</div>`;
      return;
    }

    listEl.innerHTML = "";
    arr.forEach(item => {
      const a = document.createElement("a");
      a.className = "n-item";
      a.href = item.Link || "#";
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      const title = document.createElement("span");
      title.className = "n-title";
      title.textContent = item.Title || "";

      const date = document.createElement("span");
      date.className = "n-date";
      if (currentTab === "notice") {
        date.textContent = (item.Date || "").slice(5, 10).replace("-", ".");
      } else {
        date.textContent = item.EndDate ? `~${item.EndDate.slice(5, 10).replace("-", ".")}` : "";
      }

      a.appendChild(title);
      a.appendChild(date);
      listEl.appendChild(a);
    });
  }

  loadData();
</script>
</body>
</html>
