<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    color-scheme: light dark;
    --card-bg: #FFFFFF;
    --card-border: #F9E5E9;
    --card-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    --tab-bg: #F5F2F3;
    --tab-color: #8E8487;
    --tab-active-bg: #FCE6ED;
    --tab-active-color: #C95B7A;
    --hint-color: #B8B0AD;
    --scroll-thumb: #F2DCE2;
    --item-bg: #FDFBFC;
    --item-border: #F5E8EC;
    --item-hover-bg: #FFF6F9;
    --item-hover-border: #F2C4D2;
    --title-color: #4A4442;
    --date-color: #A69D9A;
    --empty-color: #B5AEAB;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --card-bg: #1E1C1D;
      --card-border: #382B30;
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      --tab-bg: #2A2628;
      --tab-color: #A3989C;
      --tab-active-bg: #4A2C37;
      --tab-active-color: #F7A8BE;
      --hint-color: #7D7477;
      --scroll-thumb: #46363C;
      --item-bg: #262324;
      --item-border: #362C30;
      --item-hover-bg: #31262B;
      --item-hover-border: #5E3B47;
      --title-color: #EAE4E6;
      --date-color: #968C90;
      --empty-color: #7D7477;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent !important;
    background-color: transparent !important;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 0; }

  .n-card {
    width: 100%;
    min-width: 0;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 22px;
    padding: 12px 14px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .n-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .tabs { display: flex; gap: 5px; flex-shrink: 0; }
  .tab-btn {
    border: none;
    background: var(--tab-bg);
    color: var(--tab-color);
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab-btn.active {
    background: var(--tab-active-bg);
    color: var(--tab-active-color);
  }
  .hint {
    font-size: 9px;
    font-weight: 600;
    color: var(--hint-color);
    white-space: nowrap;
  }

  .n-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 185px;
    overflow-y: auto;
  }
  .n-list::-webkit-scrollbar { width: 3px; }
  .n-list::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }

  .n-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    text-decoration: none;
    background: var(--item-bg);
    border: 1px solid var(--item-border);
    border-radius: 9px;
    padding: 6px 9px;
    transition: all 0.15s ease;
  }
  .n-item:hover {
    background: var(--item-hover-bg);
    border-color: var(--item-hover-border);
  }
  .n-title {
    flex: 1;
    min-width: 0;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--title-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .n-date {
    font-size: 9px;
    font-weight: 700;
    color: var(--date-color);
    flex-shrink: 0;
  }
  .empty-txt { text-align: center; font-size: 10px; color: var(--empty-color); padding: 26px 0; }

  @media (max-width: 480px) {
    .n-card {
      border-radius: 18px;
      padding: 10px 11px;
      gap: 6px;
    }
    .tab-btn {
      font-size: 9.5px;
      padding: 3px 8px;
    }
    .hint { font-size: 8.5px; }
    .n-list {
      max-height: 165px;
      gap: 4px;
    }
    .n-item {
      padding: 5px 8px;
      gap: 6px;
      border-radius: 8px;
    }
    .n-title { font-size: 10px; }
    .n-date { font-size: 8.5px; }
    .empty-txt { padding: 20px 0; font-size: 9.5px; }
  }
</style>
</head>
<body>
  <div class="n-card">
    <div class="n-head">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabNotice" onclick="switchTab('notice')">공지사항</button>
        <button type="button" class="tab-btn" id="tabEvent" onclick="switchTab('event')">이벤트</button>
      </div>
      <span class="hint">클릭 시 원문 이동</span>
    </div>
    <div class="n-list" id="nList">
      <div class="empty-txt">불러오는 중...</div>
    </div>
  </div>

<script>
  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  let currentTab = "notice";
  let cache = { notices: [], events: [] };

  async function loadData() {
    try {
      const res = await fetch(`${API_BASE}/notice?t=${Date.now()}`);
      const data = await res.json();
      cache.notices = Array.isArray(data.notices) ? data.notices : [];
      cache.events = Array.isArray(data.events) ? data.events : [];
      render();
    } catch (e) {
      document.getElementById("nList").innerHTML = `<div class="empty-txt">불러오기 실패</div>`;
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tabNotice").classList.toggle("active", tab === "notice");
    document.getElementById("tabEvent").classList.toggle("active", tab === "event");
    render();
  }

  function render() {
    const listEl = document.getElementById("nList");
    const arr = currentTab === "notice" ? cache.notices : cache.events;

    if (!arr || arr.length === 0) {
      listEl.innerHTML = `<div class="empty-txt">${currentTab === "notice" ? "공지사항이 없습니다" : "진행 중인 이벤트가 없습니다"}</div>`;
      return;
    }

    listEl.innerHTML = "";
    arr.forEach(item => {
      const a = document.createElement("a");
      a.className = "n-item";
      a.href = item.Link || "#";
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      const title = document.createElement("span");
      title.className = "n-title";
      title.textContent = item.Title || "";

      const date = document.createElement("span");
      date.className = "n-date";
      if (currentTab === "notice") {
        date.textContent = (item.Date || "").slice(5, 10).replace("-", ".");
      } else {
        date.textContent = item.EndDate ? `~${item.EndDate.slice(5, 10).replace("-", ".")}` : "";
      }

      a.appendChild(title);
      a.appendChild(date);
      listEl.appendChild(a);
    });
  }

  loadData();
</script>
</body>
</html>
