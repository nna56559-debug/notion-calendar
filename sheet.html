<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 4px;
  }

  .sheet-card {
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid #F9E5E9;
    border-radius: 22px;
    padding: 13px 14px 12px;
    box-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .s-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .s-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 8px;
    border-radius: 7px;
    background: #E4F1FA;
    color: #3D7496;
  }
  .s-refresh {
    border: none;
    background: transparent;
    color: #AED9EB;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    padding: 0 3px;
  }
  .s-refresh:hover { color: #E58FA7; }

  /* 상단 요약 2칸 (상위 3개 레이드 진행률 / 주간 골드) */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .sum-box {
    background: #FDF7F9;
    border: 1px solid #F6E2E7;
    border-radius: 12px;
    padding: 7px 6px;
    text-align: center;
  }
  .sum-box.gold {
    background: #FCF9EE;
    border-color: #F3E7C3;
  }
  .sum-label {
    font-size: 9px;
    font-weight: 700;
    color: #9A908C;
    margin-bottom: 2px;
  }
  .sum-val {
    font-size: 12px;
    font-weight: 900;
    color: #D96B8A;
    white-space: nowrap;
  }
  .sum-box.gold .sum-val {
    color: #B88428;
  }

  /* 전체 진행률 바 */
  .prog-track {
    width: 100%;
    height: 4.5px;
    background: #F8EEF1;
    border-radius: 999px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #F6B4CA, #AED9EB);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  /* 캐릭터별 상위 3개 레이드 진행 리스트 */
  .char-list {
    display: flex;
    flex-direction: column;
    gap: 4.5px;
    max-height: 132px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .char-list::-webkit-scrollbar { width: 3px; }
  .char-list::-webkit-scrollbar-thumb { background: #F2DCE2; border-radius: 999px; }

  .c-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    background: #FDFBFC;
    border: 1px solid #F5E8EC;
    border-radius: 9px;
    padding: 4.5px 8px;
  }
  .c-left {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .c-name {
    font-size: 10.5px;
    font-weight: 800;
    color: #4A4442;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .c-job {
    font-size: 8.5px;
    font-weight: 700;
    color: #8C827E;
    background: #F4F0F1;
    padding: 1px 4.5px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .c-status {
    font-size: 9px;
    font-weight: 800;
    padding: 1.5px 6px;
    border-radius: 6px;
    background: #FCE8EE;
    color: #C95B7A;
    flex-shrink: 0;
  }
  .c-status.done {
    background: #DDF2E6;
    color: #367852;
  }

  .empty-txt {
    text-align: center;
    font-size: 10px;
    color: #B5AEAB;
    padding: 14px 0;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="sheet-card">
    <div class="s-head">
      <span class="s-badge">주간 레이드 · 골드</span>
      <button type="button" class="s-refresh" onclick="loadSheet()" title="시트 새로고침">↻</button>
    </div>

    <div class="summary-grid">
      <div class="sum-box">
        <div class="sum-label">상위 3레이드</div>
        <div class="sum-val" id="progVal">- %</div>
      </div>
      <div class="sum-box gold">
        <div class="sum-label">주간 골드</div>
        <div class="sum-val" id="goldVal">- G</div>
      </div>
    </div>

    <div class="prog-track">
      <div class="prog-fill" id="progFill"></div>
    </div>

    <div class="char-list" id="charList">
      <div class="empty-txt">시트 주소를 연결하면<br>진행률이 표시됩니다</div>
    </div>
  </div>

<script>
  // ★ 구글 시트 [파일 -> 공유 -> 웹에 게시 -> .csv] 주소를 따옴표 안에 넣어주세요 ★
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQB78npcV_7wD3up_SU2gpLBlNJ-HvNMLZb3kvM6k_UGRWpR7NvQbQ-YcafMzE-baZqIgeqvRBhw3AP/pub?gid=1409386821&single=true&output=csv";

  // 시트 열 기준 상위 레이드 우선순위 (G:벨가르딘, H:세르카, I:지평, J/K:종막, L:4막)
  const RAID_COLS = [
    { idx: 6, gold: 45000 }, // G: 벨가르딘
    { idx: 7, gold: 38000 }, // H: 세르카
    { idx: 8, gold: 35000 }, // I: 지평
    { idx: 9, gold: 33000 }, // J: 종막(1)
    { idx: 10, gold: 33000 }, // K: 종막(2)
    { idx: 11, gold: 28000 }  // L: 4막
  ];

  function parseCSV(text) {
    return text.trim().split(/\r?\n/).map(line => {
      const cells = [];
      let cur = "", inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { cells.push(cur.trim()); cur = ""; }
        else { cur += ch; }
      }
      cells.push(cur.trim());
      return cells;
    });
  }

  async function loadSheet() {
    const listEl = document.getElementById("charList");
    if (!SHEET_CSV_URL || SHEET_CSV_URL.startsWith("여기에")) return;

    try {
      const sep = SHEET_CSV_URL.includes("?") ? "&" : "?";
      const res = await fetch(SHEET_CSV_URL + sep + "t=" + Date.now());
      const csvText = await res.text();
      const rows = parseCSV(csvText);

      let totalTop3 = 0;
      let doneTop3 = 0;
      let sheetExplicitGold = 0;
      let estimatedGold = 0;
      const chars = [];

      // 상단 요약 행(1~3행)이나 우측에 총 주간 골드 셀이 있는지 탐색
      for (let r = 0; r < rows.length; r++) {
        const rowStr = rows[r].join(" ");
        if (rowStr.includes("주간") && rowStr.includes("골드")) {
          const gCell = rows[r].find(c => /^[\d,]{4,}\s*G?$/i.test(c.trim()));
          if (gCell) {
            const val = parseInt(gCell.replace(/[^0-9]/g, ""), 10);
            if (!isNaN(val)) sheetExplicitGold = val;
          }
        }
      }

      // 5행(인덱스 4)부터 캐릭터별 최상위 레이드 3개 추출
      for (let r = 4; r < rows.length; r++) {
        const cols = rows[r];
        const name = (cols[2] || "").trim();
        const job = (cols[3] || "").trim();
        if (!name || name === "닉네임") continue;

        // 해당 캐릭터에 체크박스가 존재하는 레이드 중 가장 높은 3개만 선택
        const activeRaids = [];
        for (const rc of RAID_COLS) {
          const val = (cols[rc.idx] || "").trim().toUpperCase();
          if (val === "TRUE" || val === "FALSE") {
            activeRaids.push({ done: val === "TRUE", gold: rc.gold });
            if (activeRaids.length === 3) break;
          }
        }

        if (activeRaids.length === 0) continue;

        const doneCount = activeRaids.filter(x => x.done).length;
        totalTop3 += activeRaids.length;
        doneTop3 += doneCount;

        // 골드 획득 지정 캐릭터(상위 6캐릭 기준) 완료 골드 합산
        if (chars.length < 6) {
          activeRaids.forEach(x => {
            if (x.done) estimatedGold += x.gold;
          });
        }

        chars.push({
          name,
          job,
          done: doneCount,
          total: activeRaids.length
        });
      }

      const pct = totalTop3 > 0 ? Math.round((doneTop3 / totalTop3) * 100) : 0;
      document.getElementById("progVal").textContent = totalTop3 > 0 ? `${pct}% (${doneTop3}/${totalTop3})` : "-";
      document.getElementById("progFill").style.width = `${pct}%`;

      const displayGold = sheetExplicitGold > 0 ? sheetExplicitGold : estimatedGold;
      document.getElementById("goldVal").textContent = `${displayGold.toLocaleString()} G`;

      if (chars.length === 0) {
        listEl.innerHTML = `<div class="empty-txt">캐릭터 데이터를 찾지 못했습니다</div>`;
        return;
      }

      listEl.innerHTML = "";
      chars.forEach(ch => {
        const isAllDone = ch.done === ch.total;
        const row = document.createElement("div");
        row.className = "c-row";
        row.innerHTML = `
          <div class="c-left">
            <span class="c-name">${ch.name}</span>
            ${ch.job ? `<span class="c-job">${ch.job}</span>` : ""}
          </div>
          <span class="c-status ${isAllDone ? "done" : ""}">
            ${isAllDone ? "완료" : `${ch.done}/${ch.total}`}
          </span>
        `;
        listEl.appendChild(row);
      });
    } catch (e) {
      listEl.innerHTML = `<div class="empty-txt">시트를 불러오지 못했습니다</div>`;
    }
  }

  loadSheet();
</script>
</body>
</html>
