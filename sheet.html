<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 4px;
  }

  .sheet-card {
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid #F9E5E9;
    border-radius: 22px;
    padding: 13px 14px 12px;
    box-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .s-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .s-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .s-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 8px;
    border-radius: 7px;
    background: #E4F1FA;
    color: #3D7496;
  }
  .s-pct {
    font-size: 10.5px;
    font-weight: 900;
    color: #D96B8A;
  }
  .s-refresh {
    border: none;
    background: transparent;
    color: #AED9EB;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    padding: 0 3px;
  }
  .s-refresh:hover { color: #E58FA7; }

  /* 전체 진행률 바 */
  .prog-track {
    width: 100%;
    height: 5px;
    background: #F8EEF1;
    border-radius: 999px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #F6B4CA, #AED9EB);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  /* 캐릭터별 미니 리스트 */
  .char-list {
    display: flex;
    flex-direction: column;
    gap: 4.5px;
    max-height: 148px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .char-list::-webkit-scrollbar { width: 3px; }
  .char-list::-webkit-scrollbar-thumb { background: #F2DCE2; border-radius: 999px; }

  .c-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    background: #FDFBFC;
    border: 1px solid #F5E8EC;
    border-radius: 9px;
    padding: 4.5px 8px;
  }
  .c-left {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .c-name {
    font-size: 10.5px;
    font-weight: 800;
    color: #4A4442;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .c-job {
    font-size: 8.5px;
    font-weight: 700;
    color: #8C827E;
    background: #F4F0F1;
    padding: 1px 4.5px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .c-status {
    font-size: 9px;
    font-weight: 800;
    padding: 1.5px 6px;
    border-radius: 6px;
    background: #FCE8EE;
    color: #C95B7A;
    flex-shrink: 0;
  }
  .c-status.done {
    background: #DDF2E6;
    color: #367852;
  }

  .empty-txt {
    text-align: center;
    font-size: 10px;
    color: #B5AEAB;
    padding: 14px 0;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="sheet-card">
    <div class="s-head">
      <div class="s-left">
        <span class="s-badge">주간 숙제</span>
        <span class="s-pct" id="progVal">- %</span>
      </div>
      <button type="button" class="s-refresh" onclick="loadSheet()" title="시트 새로고침">↻</button>
    </div>

    <div class="prog-track">
      <div class="prog-fill" id="progFill"></div>
    </div>

    <div class="char-list" id="charList">
      <div class="empty-txt">시트 주소를 연결하면<br>캐릭터 숙제가 표시됩니다</div>
    </div>
  </div>

<script>
  // ★ 구글 시트 [파일 -> 공유 -> 웹에 게시 -> .csv] 주소를 따옴표 안에 넣어주세요 ★
  const SHEET_CSV_URL = "여기에_복사한_CSV_주소_붙여넣기";

  function parseCSV(text) {
    return text.trim().split(/\r?\n/).map(line => {
      const cells = [];
      let cur = "", inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { cells.push(cur.trim()); cur = ""; }
        else { cur += ch; }
      }
      cells.push(cur.trim());
      return cells;
    });
  }

  async function loadSheet() {
    const listEl = document.getElementById("charList");
    if (!SHEET_CSV_URL || SHEET_CSV_URL.startsWith("여기에")) return;

    try {
      const sep = SHEET_CSV_URL.includes("?") ? "&" : "?";
      const res = await fetch(SHEET_CSV_URL + sep + "t=" + Date.now());
      const csvText = await res.text();
      const rows = parseCSV(csvText);

      // 4행(인덱스 3) 헤더 및 5행(인덱스 4)부터 캐릭터 데이터 읽기
      // C열(2): 닉네임, D열(3): 직업, G열(6)~N열(13): 주간 숙제 체크박스
      let totalChecks = 0;
      let doneChecks = 0;
      const chars = [];

      for (let r = 4; r < rows.length; r++) {
        const cols = rows[r];
        const name = (cols[2] || "").trim();
        const job = (cols[3] || "").trim();
        if (!name || name === "닉네임") continue;

        const taskCols = cols.slice(6, 14);
        const validChecks = taskCols.filter(v => v === "TRUE" || v === "FALSE");
        const doneCount = validChecks.filter(v => v === "TRUE").length;

        totalChecks += validChecks.length;
        doneChecks += doneCount;

        chars.push({
          name,
          job,
          done: doneCount,
          total: validChecks.length
        });
      }

      const pct = totalChecks > 0 ? Math.round((doneChecks / totalChecks) * 100) : 0;
      document.getElementById("progVal").textContent = totalChecks > 0 ? `${pct}% (${doneChecks}/${totalChecks})` : "-";
      document.getElementById("progFill").style.width = `${pct}%`;

      if (chars.length === 0) {
        listEl.innerHTML = `<div class="empty-txt">캐릭터 데이터를 찾지 못했습니다</div>`;
        return;
      }

      listEl.innerHTML = "";
      chars.forEach(ch => {
        const isAllDone = ch.total > 0 && ch.done === ch.total;
        const row = document.createElement("div");
        row.className = "c-row";
        row.innerHTML = `
          <div class="c-left">
            <span class="c-name">${ch.name}</span>
            ${ch.job ? `<span class="c-job">${ch.job}</span>` : ""}
          </div>
          <span class="c-status ${isAllDone ? "done" : ""}">
            ${ch.total > 0 ? (isAllDone ? "완료" : `${ch.done}/${ch.total}`) : "-"}
          </span>
        `;
        listEl.appendChild(row);
      });
    } catch (e) {
      listEl.innerHTML = `<div class="empty-txt">시트를 불러오지 못했습니다</div>`;
    }
  }

  loadSheet();
</script>
</body>
</html>
