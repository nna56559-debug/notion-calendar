<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; width: 100%; overflow-x: hidden; }
  body { padding: 6px; }

  .gallery-box {
    width: 100%;
    background: #FFFDFB;
    border: 1.5px solid #FADADD;
    border-radius: 22px;
    padding: 14px;
    box-shadow: 0 6px 20px rgba(244, 162, 184, 0.14);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 10px;
  }

  .thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid #FCE4E8;
    background: #FFF5F7;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .thumb:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(244, 151, 182, 0.25);
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .empty {
    text-align: center;
    font-size: 12px;
    color: #B8AFA9;
    padding: 28px 10px;
  }

  /* 원본 크게 보기 모달 */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(65, 52, 56, 0.55);
    backdrop-filter: blur(4px);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.open { display: flex; }

  .modal-card {
    position: relative;
    background: #FFFDFB;
    border: 2px solid #FADADD;
    border-radius: 22px;
    padding: 12px;
    max-width: 92vw;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.2);
    animation: popIn 0.18s ease;
  }
  @keyframes popIn { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-card img {
    max-width: 100%;
    max-height: calc(90vh - 76px);
    border-radius: 14px;
    object-fit: contain;
    display: block;
  }

  .modal-info {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding: 0 4px;
  }
  .modal-title {
    font-size: 12.5px;
    font-weight: 700;
    color: #5C5552;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .modal-date {
    font-size: 11px;
    font-weight: 700;
    color: #D96B8A;
    background: #FFF0F3;
    border: 1px solid #FADADD;
    padding: 2px 9px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .close-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid #FADADD;
    background: rgba(255, 253, 251, 0.92);
    color: #D96B8A;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-btn:hover { background: #FADADD; }
</style>
</head>
<body>
  <div class="gallery-box">
    <div id="content"><div class="empty">사진을 불러오는 중...</div></div>
  </div>

  <div class="modal" id="photoModal">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="close-btn" id="closeModal" title="닫기">✕</button>
      <img id="modalImg" src="" alt="원본 사진">
      <div class="modal-info">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-date" id="modalDate"></div>
      </div>
    </div>
  </div>

<script>
  const GALLERY_API = "https://notion-cal.binhaha329.workers.dev/gallery";
  const modal = document.getElementById("photoModal");
  const modalImg = document.getElementById("modalImg");
  const modalTitle = document.getElementById("modalTitle");
  const modalDate = document.getElementById("modalDate");

  function openModal(item) {
    modalImg.src = item.url;
    modalTitle.textContent = item.title || "추억 기록";
    if (item.date) {
      modalDate.textContent = item.date;
      modalDate.style.display = "inline-block";
    } else {
      modalDate.style.display = "none";
    }
    modal.classList.add("open");
  }

  function closeModal() {
    modal.classList.remove("open");
    modalImg.src = "";
  }

  modal.onclick = closeModal;
  document.getElementById("closeModal").onclick = closeModal;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  async function loadGallery() {
    const box = document.getElementById("content");
    try {
      const res = await fetch(GALLERY_API);
      const photos = await res.json();

      if (!Array.isArray(photos) || photos.length === 0) {
        box.innerHTML = `<div class="empty">노션 갤러리 DB에 사진을 올려보세요</div>`;
        return;
      }

      const grid = document.createElement("div");
      grid.className = "grid";

      photos.forEach(item => {
        const div = document.createElement("div");
        div.className = "thumb";
        const img = document.createElement("img");
        img.src = item.url;
        img.alt = item.title || "gallery";
        img.loading = "lazy";
        div.appendChild(img);
        div.onclick = () => openModal(item);
        grid.appendChild(div);
      });

      box.innerHTML = "";
      box.appendChild(grid);
    } catch (e) {
      box.innerHTML = `<div class="empty">사진을 불러오지 못했습니다</div>`;
    }
  }

  loadGallery();
</script>
</body>
</html>
