<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; width: 100%; overflow-x: hidden; }
  body { padding: 6px; }

  :root {
    --page-bg: transparent;
    --box-bg: #FFFDFB;
    --box-border: #FADADD;
    --box-shadow: 0 6px 20px rgba(244, 162, 184, 0.14);
    --scroll-track: #FFF5F7;
    --scroll-thumb: #F2DCE2;
    --card-bg: #FFFFFF;
    --card-border: #FCE4E8;
    --card-hover-border: #F29CB4;
    --card-hover-shadow: 0 6px 14px rgba(244, 151, 182, 0.22);
    --thumb-bg: #FFF5F7;
    --meta-bg: #FFFDFC;
    --title-fg: #4A4442;
    --date-fg: #C95B7A;
    --date-bg: #FFF0F3;
    --date-border: #FADADD;
    --empty-fg: #B8AFA9;
    --modal-backdrop: rgba(65, 52, 56, 0.55);
    --modal-bg: #FFFDFB;
    --modal-border: #FADADD;
    --modal-shadow: 0 14px 36px rgba(0, 0, 0, 0.2);
    --modal-title-fg: #5C5552;
    --modal-date-fg: #D96B8A;
    --close-bg: rgba(255, 253, 251, 0.92);
    --close-fg: #D96B8A;
    --close-hover-bg: #FADADD;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #191919;
      --box-bg: #1B1A20;
      --box-border: #383342;
      --box-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
      --scroll-track: #222128;
      --scroll-thumb: #4B3846;
      --card-bg: #24232B;
      --card-border: #3A3646;
      --card-hover-border: #F28BA8;
      --card-hover-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      --thumb-bg: #2B2933;
      --meta-bg: #24232B;
      --title-fg: #F4F2F8;
      --date-fg: #F5A3BC;
      --date-bg: #36222B;
      --date-border: #573644;
      --empty-fg: #878296;
      --modal-backdrop: rgba(10, 9, 13, 0.72);
      --modal-bg: #1B1A20;
      --modal-border: #4A343D;
      --modal-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
      --modal-title-fg: #F4F2F8;
      --modal-date-fg: #F5A3BC;
      --close-bg: rgba(36, 35, 43, 0.92);
      --close-fg: #F5A3BC;
      --close-hover-bg: #3B252E;
    }
  }

  :root[data-theme="dark"] {
    --page-bg: #191919;
    --box-bg: #1B1A20;
    --box-border: #383342;
    --box-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
    --scroll-track: #222128;
    --scroll-thumb: #4B3846;
    --card-bg: #24232B;
    --card-border: #3A3646;
    --card-hover-border: #F28BA8;
    --card-hover-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    --thumb-bg: #2B2933;
    --meta-bg: #24232B;
    --title-fg: #F4F2F8;
    --date-fg: #F5A3BC;
    --date-bg: #36222B;
    --date-border: #573644;
    --empty-fg: #878296;
    --modal-backdrop: rgba(10, 9, 13, 0.72);
    --modal-bg: #1B1A20;
    --modal-border: #4A343D;
    --modal-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
    --modal-title-fg: #F4F2F8;
    --modal-date-fg: #F5A3BC;
    --close-bg: rgba(36, 35, 43, 0.92);
    --close-fg: #F5A3BC;
    --close-hover-bg: #3B252E;
  }

  html, body {
    background: var(--page-bg);
  }

  .gallery-box {
    width: 100%;
    background: var(--box-bg);
    border: 1.5px solid var(--box-border);
    border-radius: 22px;
    padding: 12px;
    box-shadow: var(--box-shadow);
    display: flex;
    flex-direction: column;
  }

  /* 1열(가로 1줄) 스트립 배치 */
  .grid {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(122px, 148px);
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 6px;
  }
  .grid::-webkit-scrollbar { height: 5px; }
  .grid::-webkit-scrollbar-track { background: var(--scroll-track); border-radius: 999px; }
  .grid::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }

  .g-card {
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid var(--card-border);
    background: var(--card-bg);
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  }
  .g-card:hover {
    transform: translateY(-2px);
    border-color: var(--card-hover-border);
    box-shadow: var(--card-hover-shadow);
  }

  .g-thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--thumb-bg);
    overflow: hidden;
  }
  .g-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .g-meta {
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--meta-bg);
  }
  .g-title {
    font-size: 11px;
    font-weight: 800;
    color: var(--title-fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .g-date {
    align-self: flex-start;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--date-fg);
    background: var(--date-bg);
    border: 1px solid var(--date-border);
    padding: 1px 6px;
    border-radius: 999px;
  }

  .empty {
    text-align: center;
    font-size: 12px;
    color: var(--empty-fg);
    padding: 24px 10px;
  }

  /* 원본 크게 보기 모달 */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--modal-backdrop);
    backdrop-filter: blur(4px);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.open { display: flex; }

  .modal-card {
    position: relative;
    background: var(--modal-bg);
    border: 2px solid var(--modal-border);
    border-radius: 22px;
    padding: 12px;
    max-width: 92vw;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: var(--modal-shadow);
    animation: popIn 0.18s ease;
  }
  @keyframes popIn { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-card img {
    max-width: 100%;
    max-height: calc(90vh - 76px);
    border-radius: 14px;
    object-fit: contain;
    display: block;
  }

  .modal-info {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding: 0 4px;
  }
  .modal-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--modal-title-fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .modal-date {
    font-size: 11px;
    font-weight: 700;
    color: var(--modal-date-fg);
    background: var(--date-bg);
    border: 1px solid var(--date-border);
    padding: 2px 9px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .close-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--modal-border);
    background: var(--close-bg);
    color: var(--close-fg);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-btn:hover { background: var(--close-hover-bg); }

  @media (max-width: 480px) {
    body {
      padding: 2px;
    }
    .gallery-box {
      border-radius: 16px;
      padding: 8px;
    }
    .grid {
      grid-auto-columns: minmax(104px, 122px);
      gap: 7px;
    }
    .g-card {
      border-radius: 11px;
    }
    .g-meta {
      padding: 5px 7px;
      gap: 3px;
    }
    .g-title {
      font-size: 10px;
    }
    .g-date {
      font-size: 8.5px;
      padding: 1px 5px;
    }
  }
</style>
</head>
<body>
  <div class="gallery-box">
    <div id="content"><div class="empty">사진을 불러오는 중...</div></div>
  </div>

  <div class="modal" id="photoModal">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="close-btn" id="closeModal" title="닫기">✕</button>
      <img id="modalImg" src="" alt="원본 사진">
      <div class="modal-info">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-date" id="modalDate"></div>
      </div>
    </div>
  </div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();

  const GALLERY_API = "https://notion-cal.binhaha329.workers.dev/gallery";
  const modal = document.getElementById("photoModal");
  const modalImg = document.getElementById("modalImg");
  const modalTitle = document.getElementById("modalTitle");
  const modalDate = document.getElementById("modalDate");

  function openModal(item) {
    modalImg.src = item.url;
    modalTitle.textContent = item.title || "추억 기록";
    if (item.date) {
      modalDate.textContent = item.date;
      modalDate.style.display = "inline-block";
    } else {
      modalDate.style.display = "none";
    }
    modal.classList.add("open");
  }

  function closeModal() {
    modal.classList.remove("open");
    modalImg.src = "";
  }

  modal.onclick = closeModal;
  document.getElementById("closeModal").onclick = closeModal;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  async function loadGallery() {
    const box = document.getElementById("content");
    try {
      const res = await fetch(`${GALLERY_API}?t=${Date.now()}`);
      const photos = await res.json();

      if (!Array.isArray(photos) || photos.length === 0) {
        box.innerHTML = `<div class="empty">노션 갤러리 DB에 사진을 올려보세요</div>`;
        return;
      }

      const grid = document.createElement("div");
      grid.className = "grid";

      photos.forEach(item => {
        const card = document.createElement("div");
        card.className = "g-card";
        card.onclick = () => openModal(item);

        const thumb = document.createElement("div");
        thumb.className = "g-thumb";

        const img = document.createElement("img");
        img.src = item.url;
        img.alt = item.title || "gallery";
        img.loading = "lazy";
        thumb.appendChild(img);

        const meta = document.createElement("div");
        meta.className = "g-meta";

        const title = document.createElement("div");
        title.className = "g-title";
        title.textContent = item.title || "제목 없음";
        meta.appendChild(title);

        if (item.date) {
          const date = document.createElement("span");
          date.className = "g-date";
          date.textContent = item.date;
          meta.appendChild(date);
        }

        card.appendChild(thumb);
        card.appendChild(meta);
        grid.appendChild(card);
      });

      box.innerHTML = "";
      box.appendChild(grid);
    } catch (e) {
      box.innerHTML = `<div class="empty">사진을 불러오지 못했습니다</div>`;
    }
  }

  loadGallery();
</script>
</body>
</html>
