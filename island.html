<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 4px;
  }

  :root {
    --next-label-fg: #9E9692;
    --next-time-fg: #5C5552;
    --next-small-fg: #8E8682;
    --box-bg: #FDF5F7;
    --box-border: #F9E5E9;
    --box-shadow: 0 4px 16px rgba(244, 182, 198, 0.12);
    --dow-fg: #8C827E;
    --card-bg: #FFFFFF;
    --card-border: #F6E2E7;
    --name-fg: #4A4442;
    --empty-fg: #B5AEAB;
    --sub-border: #F2D7DF;
    --pill-bg: #FFFFFF;
    --pill-border: #F6E2E7;
    --pill-fg: #6B625F;
    --pill-active-bg: #FFF9FC;
    --pill-active-border: #F4C6D4;
    --off-bg: #F1EFEF;
    --off-fg: #ADA6A3;
    --on-bg: #D5F2E1;
    --on-fg: #2F7A50;
    --rw-default-bg: #F7EED3;
    --rw-default-fg: #8C7742;
    --rw-gold-bg: #FBE5C8;
    --rw-gold-fg: #9C662B;
    --rw-card-bg: #E4E2F8;
    --rw-card-fg: #5D5599;
    --rw-coin-bg: #DCEFF8;
    --rw-coin-fg: #3D6F8E;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --next-label-fg: #9E9096;
      --next-time-fg: #F3ECEE;
      --next-small-fg: #B5A8AD;
      --box-bg: #221C20;
      --box-border: #4A343D;
      --box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      --dow-fg: #C5B6BC;
      --card-bg: #292126;
      --card-border: #402D35;
      --name-fg: #F3ECEE;
      --empty-fg: #86787E;
      --sub-border: #47313B;
      --pill-bg: #292126;
      --pill-border: #402D35;
      --pill-fg: #DFD3D8;
      --pill-active-bg: #35242C;
      --pill-active-border: #684252;
      --off-bg: #362C31;
      --off-fg: #9A8C92;
      --on-bg: #1F362B;
      --on-fg: #93D9B0;
      --rw-default-bg: #38301E;
      --rw-default-fg: #E6C473;
      --rw-gold-bg: #3D2B1B;
      --rw-gold-fg: #F5B971;
      --rw-card-bg: #2B2742;
      --rw-card-fg: #C2BDF2;
      --rw-coin-bg: #1E3240;
      --rw-coin-fg: #9BD0F0;
    }
  }

  :root[data-theme="dark"] {
    --next-label-fg: #9E9096;
    --next-time-fg: #F3ECEE;
    --next-small-fg: #B5A8AD;
    --box-bg: #221C20;
    --box-border: #4A343D;
    --box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    --dow-fg: #C5B6BC;
    --card-bg: #292126;
    --card-border: #402D35;
    --name-fg: #F3ECEE;
    --empty-fg: #86787E;
    --sub-border: #47313B;
    --pill-bg: #292126;
    --pill-border: #402D35;
    --pill-fg: #DFD3D8;
    --pill-active-bg: #35242C;
    --pill-active-border: #684252;
    --off-bg: #362C31;
    --off-fg: #9A8C92;
    --on-bg: #1F362B;
    --on-fg: #93D9B0;
    --rw-default-bg: #38301E;
    --rw-default-fg: #E6C473;
    --rw-gold-bg: #3D2B1B;
    --rw-gold-fg: #F5B971;
    --rw-card-bg: #2B2742;
    --rw-card-fg: #C2BDF2;
    --rw-coin-bg: #1E3240;
    --rw-coin-fg: #9BD0F0;
  }

  /* 상단 NEXT 카운트다운 */
  .next-wrap {
    text-align: center;
    margin-bottom: 7px;
  }
  .next-label {
    font-size: 9px;
    font-weight: 800;
    color: var(--next-label-fg);
    letter-spacing: 0.8px;
    margin-bottom: 1px;
  }
  .next-time {
    font-size: 15.5px;
    font-weight: 900;
    color: var(--next-time-fg);
    letter-spacing: -0.3px;
  }
  .next-time small {
    font-size: 9.5px;
    font-weight: 800;
    color: var(--next-small-fg);
    margin: 0 2px 0 1px;
  }

  /* 베이비핑크 메인 카드 */
  .island-box {
    width: 100%;
    max-width: 210px;
    background: var(--box-bg);
    border: 1.5px solid var(--box-border);
    border-radius: 22px;
    padding: 12px 10px 10px;
    box-shadow: var(--box-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6.5px;
  }

  .dow-title {
    font-size: 10.5px;
    font-weight: 800;
    color: var(--dow-fg);
    letter-spacing: 0.5px;
    margin-bottom: 1px;
  }

  .island-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 5.5px;
  }

  .i-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 13px;
    padding: 7px 6px;
    text-align: center;
  }
  .i-name {
    font-size: 10.5px;
    font-weight: 800;
    color: var(--name-fg);
    margin-bottom: 3.5px;
    word-break: keep-all;
    line-height: 1.25;
  }
  .i-reward {
    display: inline-block;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--rw-default-bg);
    color: var(--rw-default-fg);
  }
  .i-reward.gold { background: var(--rw-gold-bg); color: var(--rw-gold-fg); }
  .i-reward.card { background: var(--rw-card-bg); color: var(--rw-card-fg); }
  .i-reward.coin { background: var(--rw-coin-bg); color: var(--rw-coin-fg); }

  .empty-txt {
    font-size: 10px;
    color: var(--empty-fg);
    padding: 16px 0;
    text-align: center;
  }

  /* 하단 필보 · 카게 미니 뱃지 영역 */
  .sub-contents {
    width: 100%;
    margin-top: 2px;
    padding-top: 6.5px;
    border-top: 1px dashed var(--sub-border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }
  .sub-pill {
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    border-radius: 10px;
    padding: 5px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3.5px;
    font-size: 9.5px;
    font-weight: 800;
    color: var(--pill-fg);
  }
  .sub-pill.active {
    background: var(--pill-active-bg);
    border-color: var(--pill-active-border);
  }
  .sub-state {
    font-size: 9px;
    font-weight: 900;
    padding: 1px 5px;
    border-radius: 5px;
  }
  .sub-state.on {
    background: var(--on-bg);
    color: var(--on-fg);
  }
  .sub-state.off {
    background: var(--off-bg);
    color: var(--off-fg);
  }

  @media (max-width: 480px) {
    body {
      padding: 4px 2px;
    }
    .next-wrap {
      margin-bottom: 5px;
    }
    .next-time {
      font-size: 14px;
    }
    .island-box {
      max-width: 100%;
      border-radius: 18px;
      padding: 10px 8px 9px;
      gap: 5px;
    }
    .i-card {
      border-radius: 11px;
      padding: 6px 5px;
    }
    .i-name {
      font-size: 10px;
    }
    .sub-pill {
      padding: 4px 3px;
      font-size: 9px;
    }
  }
</style>
</head>
<body>
  <div class="next-wrap">
    <div class="next-label">NEXT</div>
    <div class="next-time" id="nextCountdown">- 00<small>H</small> 00<small>M</small></div>
  </div>

  <div class="island-box">
    <div class="dow-title" id="dowTitle">THU</div>
    <div class="island-list" id="islandList">
      <div class="empty-txt">불러오는 중...</div>
    </div>

    <!-- 오늘 필보 · 카게 출현 여부 -->
    <div class="sub-contents">
      <div class="sub-pill" id="pillBoss">
        <span>필보</span>
        <span class="sub-state off" id="stateBoss">-</span>
      </div>
      <div class="sub-pill" id="pillGate">
        <span>카게</span>
        <span class="sub-state off" id="stateGate">-</span>
      </div>
    </div>
  </div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();

  const API_URL = "https://notion-cal.binhaha329.workers.dev/island";
  const DAYS_EN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

  let nextStartDate = null;

  function getKstNow() {
    const now = new Date();
    return new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
  }

  function getLoaDateStr(d) {
    // 로스트아크 일일 초기화(오전 06:00) 기준 오늘 날짜 계산
    const shifted = new Date(d.getTime() - 6 * 3600 * 1000);
    const y = shifted.getFullYear();
    const m = String(shifted.getMonth() + 1).padStart(2, "0");
    const day = String(shifted.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function updateCountdown() {
    const kst = getKstNow();
    const shifted = new Date(kst.getTime() - 6 * 3600 * 1000);
    document.getElementById("dowTitle").textContent = DAYS_EN[shifted.getDay()];

    if (!nextStartDate) return;
    const diffMs = nextStartDate - kst;
    if (diffMs <= 0) {
      document.getElementById("nextCountdown").innerHTML = `진행 중`;
      return;
    }
    const totalMins = Math.floor(diffMs / 60000);
    const h = String(Math.floor(totalMins / 60)).padStart(2, "0");
    const m = String(totalMins % 60).padStart(2, "0");
    document.getElementById("nextCountdown").innerHTML = `- ${h}<small>H</small> ${m}<small>M</small>`;
  }

  function getRewardInfo(item) {
    const rewards = item.RewardItems || [];
    const names = rewards.flatMap(r => (r.Items || []).map(i => i.Name)).join(" ");
    if (names.includes("골드")) return { label: "골드", cls: "gold" };
    if (names.includes("카드")) return { label: "카드", cls: "card" };
    if (names.includes("주화")) return { label: "주화", cls: "coin" };
    return { label: "실링", cls: "" };
  }

  function hasTodaySchedule(items, todayKey, kstNow) {
    return (items || []).some(item => {
      const times = item.StartTimes || [];
      return times.some(t => {
        const dt = new Date(t);
        return getLoaDateStr(dt) === todayKey;
      });
    });
  }

  async function loadIslands() {
    const listEl = document.getElementById("islandList");
    try {
      const res = await fetch(API_URL);
      const raw = await res.json();

      const islands = Array.isArray(raw) ? raw : (raw.islands || []);
      const fieldBoss = Array.isArray(raw) ? [] : (raw.fieldBoss || []);
      const chaosGate = Array.isArray(raw) ? [] : (raw.chaosGate || []);

      const kst = getKstNow();
      const todayKey = getLoaDateStr(kst);

      // 1) 오늘 모험섬 필터링 및 가장 가까운 출현 시간 계산
      const todayIslands = [];
      let earliestUpcoming = null;

      islands.forEach(item => {
        const times = item.StartTimes || [];
        const todayTimes = times
          .map(t => new Date(t))
          .filter(dt => getLoaDateStr(dt) === todayKey);

        if (todayTimes.length > 0) {
          todayIslands.push(item);
          todayTimes.forEach(dt => {
            if (dt > kst && (!earliestUpcoming || dt < earliestUpcoming)) {
              earliestUpcoming = dt;
            }
          });
        }
      });

      nextStartDate = earliestUpcoming;
      updateCountdown();

      if (todayIslands.length === 0) {
        listEl.innerHTML = `<div class="empty-txt">출현 정보 없음</div>`;
      } else {
        listEl.innerHTML = "";
        todayIslands.slice(0, 3).forEach(item => {
          const rw = getRewardInfo(item);
          const card = document.createElement("div");
          card.className = "i-card";
          card.innerHTML = `
            <div class="i-name">${item.ContentsName}</div>
            <span class="i-reward ${rw.cls}">${rw.label}</span>
          `;
          listEl.appendChild(card);
        });
      }

      // 2) 오늘 필보 · 카게 출현 여부 표시
      const bossOn = hasTodaySchedule(fieldBoss, todayKey, kst);
      const gateOn = hasTodaySchedule(chaosGate, todayKey, kst);

      const bossStateEl = document.getElementById("stateBoss");
      const gateStateEl = document.getElementById("stateGate");
      bossStateEl.textContent = bossOn ? "O" : "X";
      bossStateEl.className = `sub-state ${bossOn ? "on" : "off"}`;
      document.getElementById("pillBoss").classList.toggle("active", bossOn);

      gateStateEl.textContent = gateOn ? "O" : "X";
      gateStateEl.className = `sub-state ${gateOn ? "on" : "off"}`;
      document.getElementById("pillGate").classList.toggle("active", gateOn);

    } catch (e) {
      listEl.innerHTML = `<div class="empty-txt">출현 정보 없음</div>`;
    }
  }

  setInterval(updateCountdown, 30000);
  loadIslands();
</script>
</body>
</html>
