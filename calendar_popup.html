<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 4px;
  }

  /* 달력 카드 높이 고정 (위젯이 늘어나지 않도록 제한) */
  .cal-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    height: 390px;
    background: #FFFFFF;
    border: 1.5px solid #F9E5E9;
    border-radius: 22px;
    padding: 13px 15px;
    box-shadow: 0 4px 16px rgba(244, 182, 198, 0.12);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .cal-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .cal-month {
    font-size: 15px;
    font-weight: 900;
    color: #5C8FB5;
  }
  .nav-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-btn {
    border: 1px solid #F2DCE2;
    background: #FDFBFC;
    color: #7A706D;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 7px;
    cursor: pointer;
  }
  .nav-btn:hover { background: #FCEBF0; color: #C95B7A; }

  .dow-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    color: #9A908D;
    margin-bottom: 5px;
    flex-shrink: 0;
  }
  .dow-grid .sun { color: #E07A95; }
  .dow-grid .sat { color: #6B9AC4; }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 4px;
    flex: 1;
    min-height: 0;
  }
  .day-cell {
    border: 1px solid transparent;
    border-radius: 10px;
    background: #FDFBFC;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    color: #4A4442;
    transition: all 0.14s ease;
  }
  .day-cell:hover {
    background: #FCEBF0;
    border-color: #F4C8D4;
  }
  .day-cell.other {
    color: #C8C0BD;
    background: transparent;
  }
  .day-cell.sun .d-num { color: #D96B88; }
  .day-cell.sat .d-num { color: #5889B5; }
  .day-cell.today {
    border: 1.5px solid #F29CB4;
    background: #FFF6F9;
    font-weight: 900;
  }
  .day-cell.has-ev {
    background: #F4F9FD;
    border-color: #DCECF7;
  }
  .ev-dots {
    display: flex;
    gap: 2px;
    min-height: 5px;
  }
  .ev-dot {
    width: 4.5px;
    height: 4.5px;
    border-radius: 50%;
    background: #E58FA7;
  }

  .cal-foot {
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px dashed #F4E2E7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    font-weight: 700;
    color: #9A908D;
    flex-shrink: 0;
  }

  /* 팝업 백드롭 & 고정 높이 내부 스크롤 박스 */
  .popup-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(74, 68, 66, 0.28);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    z-index: 10;
  }
  .popup-backdrop.show { display: flex; }
  .popup-backdrop.top-layer { z-index: 20; background: rgba(74, 68, 66, 0.38); }

  .popup-box {
    width: 100%;
    height: 100%;
    max-height: 100%;
    background: #FFFFFF;
    border: 1.5px solid #F4CBD6;
    border-radius: 18px;
    padding: 11px 12px;
    box-shadow: 0 8px 24px rgba(90, 60, 70, 0.16);
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
    animation: popIn 0.15s ease-out;
  }
  @keyframes popIn {
    from { transform: scale(0.96); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .pop-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid #F6E6EA;
    flex-shrink: 0;
  }
  .pop-title {
    font-size: 12px;
    font-weight: 900;
    color: #4A4442;
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }
  .pop-title span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pop-badge {
    font-size: 9.5px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 6px;
    background: #FCE6ED;
    color: #C95B7A;
    flex-shrink: 0;
  }
  .pop-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .icon-btn {
    border: 1px solid #EFE4E8;
    background: #FDFBFC;
    color: #6E6562;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 7px;
    cursor: pointer;
  }
  .icon-btn:hover { background: #FCEBF0; color: #C95B7A; }

  /* 팝업 본문 스크롤 영역 */
  .pop-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 3px;
  }
  .pop-scroll::-webkit-scrollbar { width: 4px; }
  .pop-scroll::-webkit-scrollbar-track { background: transparent; }
  .pop-scroll::-webkit-scrollbar-thumb {
    background: #F2CED8;
    border-radius: 99px;
  }
  .pop-scroll::-webkit-scrollbar-thumb:hover { background: #E5A9BA; }

  .ev-item {
    border: 1px solid #F2DCE2;
    background: #FDFBFC;
    border-radius: 12px;
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
    transition: all 0.14s ease;
  }
  .ev-item:hover {
    background: #FFF4F7;
    border-color: #E8A6B8;
  }
  .ev-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .ev-name {
    font-size: 11px;
    font-weight: 900;
    color: #4A4442;
  }
  .ev-time {
    font-size: 9.5px;
    font-weight: 800;
    color: #3D7496;
    background: #E8F3FA;
    padding: 1.5px 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .ev-row2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 9.5px;
    font-weight: 700;
    color: #8C8280;
  }
  .ev-mem-prev {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ev-tap-hint {
    font-size: 9px;
    font-weight: 800;
    color: #C95B7A;
    flex-shrink: 0;
  }

  .detail-sec {
    background: #FDFBFC;
    border: 1px solid #F4E4E8;
    border-radius: 11px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }
  .d-label {
    font-size: 9.5px;
    font-weight: 800;
    color: #9A908D;
  }
  .d-members {
    font-size: 11px;
    font-weight: 800;
    color: #4A4442;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .d-memo {
    font-size: 10px;
    font-weight: 600;
    color: #6E6562;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .sel-prof {
    border: 1px solid #E5D5DA;
    background: #FFFFFF;
    color: #4A4442;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    padding: 4px 7px;
    border-radius: 8px;
    outline: none;
  }
  .depart-btn {
    border: 1px solid #CBE6FA;
    background: #EAF6FF;
    color: #2A6896;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 8px;
    cursor: pointer;
  }
  .depart-btn.done {
    background: #E5F6EC;
    border-color: #BFE3CE;
    color: #2E754C;
  }
  .empty-pop {
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    color: #A89F9C;
    margin: auto 0;
  }
</style>
</head>
<body>
  <div class="cal-card" id="calCard">
    <div class="cal-top">
      <div class="cal-month" id="monthLabel">2026.11</div>
      <div class="nav-group">
        <button type="button" class="nav-btn" onclick="moveMonth(-1)">‹</button>
        <button type="button" class="nav-btn" onclick="goToday()">오늘</button>
        <button type="button" class="nav-btn" onclick="moveMonth(1)">›</button>
        <button type="button" class="nav-btn" onclick="loadEvents()" title="새로고침">↻</button>
      </div>
    </div>

    <div class="dow-grid">
      <span class="sun">SUN</span>
      <span>MON</span>
      <span>TUE</span>
      <span>WED</span>
      <span>THU</span>
      <span>FRI</span>
      <span class="sat">SAT</span>
    </div>

    <div class="days-grid" id="daysGrid"></div>

    <div class="cal-foot">
      <span>날짜 클릭 → 일정 팝업</span>
      <span id="syncStatus">동기화 중...</span>
    </div>

    <!-- 1단계 팝업: 선택한 날짜의 레이드 일정 목록 (내부 스크롤) -->
    <div class="popup-backdrop" id="dayPopup" onclick="if(event.target===this) closeDayPopup()">
      <div class="popup-box">
        <div class="pop-head">
          <div class="pop-title">
            <span id="dayPopupTitle">날짜</span>
            <span class="pop-badge" id="dayPopupCount">0건</span>
          </div>
          <div class="pop-actions">
            <button type="button" class="icon-btn" onclick="closeDayPopup()">✕</button>
          </div>
        </div>
        <div class="pop-scroll" id="dayEventList"></div>
      </div>
    </div>

    <!-- 2단계 팝업: 선택한 일정의 명단 및 상세 (내부 스크롤) -->
    <div class="popup-backdrop top-layer" id="detailPopup" onclick="if(event.target===this) closeDetailPopup()">
      <div class="popup-box">
        <div class="pop-head">
          <div class="pop-title">
            <span id="detailTitle">일정명</span>
            <span class="pop-badge" id="detailDiff">난이도</span>
          </div>
          <div class="pop-actions">
            <button type="button" class="icon-btn" onclick="closeDetailPopup()">← 목록</button>
            <button type="button" class="icon-btn" onclick="closeAllPopups()">✕</button>
          </div>
        </div>

        <div class="pop-scroll">
          <div class="detail-sec">
            <span class="d-label">명단 (참여자)</span>
            <div class="d-members" id="detailMembers">-</div>
          </div>

          <div class="detail-sec" id="memoSec" style="display:none;">
            <span class="d-label">메모</span>
            <div class="d-memo" id="detailMemo"></div>
          </div>

          <div class="detail-sec">
            <div class="ctrl-row">
              <select class="sel-prof" id="profSelect" onchange="updateEventMeta()">
                <option value="숙련도 미지정">숙련도 미지정</option>
                <option value="트라이">트라이</option>
                <option value="반숙">반숙</option>
                <option value="숙련">숙련</option>
                <option value="클리어">클리어</option>
              </select>
              <button type="button" class="depart-btn" id="departBtn" onclick="toggleDepart()">출발 전</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://notion-cal.binhaha329.workers.dev";

  const nowKst = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
  let viewYear = nowKst.getFullYear();
  let viewMonth = nowKst.getMonth();
  let allEvents = [];
  let selectedDateStr = "";
  let currentEvent = null;

  const pad2 = (n) => String(n).padStart(2, "0");
  const formatDateStr = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
  const todayStr = formatDateStr(nowKst.getFullYear(), nowKst.getMonth(), nowKst.getDate());

  async function loadEvents() {
    const statusEl = document.getElementById("syncStatus");
    statusEl.textContent = "불러오는 중...";
    try {
      const res = await fetch(`${API_URL}?t=${Date.now()}`);
      const data = await res.json();
      allEvents = Array.isArray(data) ? data : [];
      statusEl.textContent = `일정 ${allEvents.length}건 연동됨`;
      renderCalendar();
      if (selectedDateStr && document.getElementById("dayPopup").classList.contains("show")) {
        openDayPopup(selectedDateStr);
      }
    } catch (e) {
      statusEl.textContent = "연동 오류";
      renderCalendar();
    }
  }

  function moveMonth(delta) {
    viewMonth += delta;
    if (viewMonth < 0) {
      viewMonth = 11;
      viewYear -= 1;
    } else if (viewMonth > 11) {
      viewMonth = 0;
      viewYear += 1;
    }
    renderCalendar();
  }

  function goToday() {
    viewYear = nowKst.getFullYear();
    viewMonth = nowKst.getMonth();
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById("monthLabel").textContent = `${viewYear}.${pad2(viewMonth + 1)}`;
    const grid = document.getElementById("daysGrid");
    grid.innerHTML = "";

    const firstDay = new Date(viewYear, viewMonth, 1);
    const startDow = firstDay.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();

    const eventMap = {};
    for (const ev of allEvents) {
      if (!ev.date) continue;
      if (!eventMap[ev.date]) eventMap[ev.date] = [];
      eventMap[ev.date].push(ev);
    }

    for (let i = startDow - 1; i >= 0; i--) {
      const d = prevMonthDays - i;
      const prevM = viewMonth === 0 ? 11 : viewMonth - 1;
      const prevY = viewMonth === 0 ? viewYear - 1 : viewYear;
      const dateStr = formatDateStr(prevY, prevM, d);
      grid.appendChild(createDayCell(d, dateStr, true, eventMap[dateStr] || [], 0));
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = formatDateStr(viewYear, viewMonth, d);
      const dow = (startDow + d - 1) % 7;
      grid.appendChild(createDayCell(d, dateStr, false, eventMap[dateStr] || [], dow));
    }

    const totalCells = grid.children.length;
    const remain = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for (let d = 1; d <= remain; d++) {
      const nextM = viewMonth === 11 ? 0 : viewMonth + 1;
      const nextY = viewMonth === 11 ? viewYear + 1 : viewYear;
      const dateStr = formatDateStr(nextY, nextM, d);
      grid.appendChild(createDayCell(d, dateStr, true, eventMap[dateStr] || [], 0));
    }
  }

  function createDayCell(dayNum, dateStr, isOther, dayEvents, dow) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "day-cell";
    if (isOther) btn.classList.add("other");
    if (!isOther && dow === 0) btn.classList.add("sun");
    if (!isOther && dow === 6) btn.classList.add("sat");
    if (dateStr === todayStr) btn.classList.add("today");
    if (dayEvents.length > 0) btn.classList.add("has-ev");

    const dots = dayEvents.slice(0, 3).map(() => `<span class="ev-dot"></span>`).join("");
    btn.innerHTML = `<span class="d-num">${dayNum}</span><div class="ev-dots">${dots}</div>`;
    btn.onclick = () => openDayPopup(dateStr);
    return btn;
  }

  function openDayPopup(dateStr) {
    selectedDateStr = dateStr;
    const list = allEvents.filter((e) => e.date === dateStr);

    document.getElementById("dayPopupTitle").textContent = `${dateStr} 레이드 일정`;
    document.getElementById("dayPopupCount").textContent = `${list.length}건`;

    const listEl = document.getElementById("dayEventList");
    listEl.scrollTop = 0;

    if (list.length === 0) {
      listEl.innerHTML = `<div class="empty-pop">선택한 날짜에 레이드 일정이 없어요</div>`;
    } else {
      listEl.innerHTML = "";
      list.forEach((ev) => {
        const item = document.createElement("div");
        item.className = "ev-item";
        const diffTxt = ev.difficulty ? `[${ev.difficulty}] ` : "";
        const timeTxt = ev.time || "시간 미정";
        const memberPreview = ev.members ? `명단: ${ev.members}` : "명단 미입력";

        item.innerHTML = `
          <div class="ev-row1">
            <span class="ev-name">${diffTxt}${ev.title}</span>
            <span class="ev-time">${timeTxt}</span>
          </div>
          <div class="ev-row2">
            <span class="ev-mem-prev">${memberPreview}</span>
            <span class="ev-tap-hint">명단 보기 ›</span>
          </div>
        `;
        item.onclick = () => openDetailPopup(ev);
        listEl.appendChild(item);
      });
    }

    document.getElementById("dayPopup").classList.add("show");
  }

  function closeDayPopup() {
    closeDetailPopup();
    document.getElementById("dayPopup").classList.remove("show");
  }

  function openDetailPopup(ev) {
    currentEvent = ev;
    document.getElementById("detailTitle").textContent = ev.title || "일정";
    document.getElementById("detailDiff").textContent = ev.difficulty || ev.time || "레이드";
    document.getElementById("detailMembers").textContent = ev.members && ev.members.trim()
      ? ev.members.trim()
      : "등록된 명단이 없어요";

    const memoSec = document.getElementById("memoSec");
    const memoEl = document.getElementById("detailMemo");
    if (ev.memo && ev.memo.trim()) {
      memoSec.style.display = "flex";
      memoEl.textContent = ev.memo.trim();
    } else {
      memoSec.style.display = "none";
      memoEl.textContent = "";
    }

    const profSel = document.getElementById("profSelect");
    const validOpts = Array.from(profSel.options).map((o) => o.value);
    profSel.value = validOpts.includes(ev.proficiency) ? ev.proficiency : "숙련도 미지정";

    const isDeparted = String(ev.status || "").includes("출발") && !String(ev.status || "").includes("전");
    syncDepartBtn(isDeparted);

    const detailScroll = document.querySelector("#detailPopup .pop-scroll");
    if (detailScroll) detailScroll.scrollTop = 0;

    document.getElementById("detailPopup").classList.add("show");
  }

  function syncDepartBtn(isDeparted) {
    const btn = document.getElementById("departBtn");
    if (isDeparted) {
      btn.textContent = "🚀 출발 완료";
      btn.classList.add("done");
    } else {
      btn.textContent = "출발 전";
      btn.classList.remove("done");
    }
    btn.dataset.departed = isDeparted ? "1" : "0";
  }

  function closeDetailPopup() {
    document.getElementById("detailPopup").classList.remove("show");
    currentEvent = null;
  }

  function closeAllPopups() {
    closeDetailPopup();
    document.getElementById("dayPopup").classList.remove("show");
  }

  async function toggleDepart() {
    if (!currentEvent) return;
    const btn = document.getElementById("departBtn");
    const nextState = btn.dataset.departed !== "1";
    syncDepartBtn(nextState);
    currentEvent.status = nextState ? "🚀출발" : "출발 전";
    await sendEventPatch({ pageId: currentEvent.pageId, cleared: nextState });
  }

  async function updateEventMeta() {
    if (!currentEvent) return;
    const prof = document.getElementById("profSelect").value;
    currentEvent.proficiency = prof;
    await sendEventPatch({ pageId: currentEvent.pageId, proficiency: prof });
  }

  async function sendEventPatch(payload) {
    const statusEl = document.getElementById("syncStatus");
    statusEl.textContent = "저장 중...";
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      statusEl.textContent = "반영 완료";
    } catch (e) {
      statusEl.textContent = "저장 실패";
    }
  }

  renderCalendar();
  loadEvents();
</script>
</body>
</html>
