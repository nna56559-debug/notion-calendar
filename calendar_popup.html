<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 4px;
  }

  /* 고정 높이 달력 카드 */
  .cal-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    height: 410px;
    background: #FFFFFF;
    border: 1.5px solid #F9E5E9;
    border-radius: 24px;
    padding: 18px 20px 14px;
    box-shadow: 0 4px 18px rgba(244, 182, 198, 0.12);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: visible;
  }

  .cal-title {
    text-align: center;
    font-size: 16px;
    font-weight: 900;
    color: #96C8E8;
    letter-spacing: -0.2px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .dow-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 9.5px;
    font-weight: 800;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .dow-grid span { color: #96C8E8; }
  .dow-grid span.wknd { color: #E89CB2; }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 2px;
    flex: 1;
    min-height: 0;
  }

  .day-cell {
    border: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    position: relative;
  }
  .day-pill {
    width: 26px;
    height: 24px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 800;
    color: #5C5350;
    transition: all 0.14s ease;
  }
  .day-cell:hover .day-pill { background: #FDF0F4; }
  .day-cell.other .day-pill { color: #C2BBB8; font-weight: 700; }
  .day-cell.wknd:not(.other) .day-pill { color: #B85C75; }

  /* 일정 있는 날: 핑크 알약 + 하단 하늘 점 */
  .day-cell.has-ev:not(.today) .day-pill {
    background: #F4A9BE;
    color: #FFFFFF;
  }
  .ev-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: transparent;
  }
  .day-cell.has-ev .ev-dot { background: #89C4E8; }

  /* 오늘 날짜: 외곽 테두리 없이 깔끔한 하늘색 알약 */
  .day-cell.today .day-pill {
    background: #BBE2F7;
    color: #FFFFFF;
    box-shadow: none;
  }

  /* 마우스 오버 시 레이드 제목 툴팁 */
  .hover-tooltip {
    position: fixed;
    transform: translate(-50%, calc(-100% - 8px));
    background: #FFFFFF;
    border: 1.5px solid #F7DCE4;
    border-radius: 12px;
    padding: 5px 10px;
    box-shadow: 0 6px 18px rgba(120, 80, 95, 0.14);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s ease;
    z-index: 99;
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-width: 220px;
    white-space: nowrap;
  }
  .hover-tooltip.show { opacity: 1; }
  .hover-pill {
    background: #FCEBF0;
    color: #C95B7A;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 7px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 하단 카운트다운 및 화살표 */
  .cal-foot {
    margin-top: 8px;
    padding-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9.5px;
    font-weight: 800;
    color: #A69E9B;
    flex-shrink: 0;
  }
  .foot-spacer { width: 54px; }
  .reset-timer { text-align: center; }
  .foot-nav {
    width: 54px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
  }
  .f-btn {
    border: none;
    background: transparent;
    color: #96C8E8;
    font-size: 11px;
    font-weight: 900;
    cursor: pointer;
    padding: 2px;
  }
  .f-btn:hover { color: #E889A5; }

  /* 팝업 오버레이 */
  .popup-layer {
    position: absolute;
    inset: 0;
    background: #FFFFFF;
    border-radius: 24px;
    display: none;
    flex-direction: column;
    padding: 16px 18px;
    z-index: 10;
    animation: fadeIn 0.14s ease-out;
  }
  .popup-layer.show { display: flex; }
  .popup-layer.top { z-index: 20; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .pop-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .pop-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .back-btn {
    border: 1px solid #F4DCE3;
    background: #FFF7F9;
    color: #D46A87;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 99px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .back-btn:hover { background: #FCE8EE; }
  .pop-h-title {
    font-size: 13px;
    font-weight: 900;
    color: #88C2E6;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pop-pill-cnt {
    font-size: 9.5px;
    font-weight: 800;
    color: #D46A87;
    background: #FFF6F8;
    border: 1px solid #F5DCE3;
    padding: 2px 9px;
    border-radius: 99px;
    flex-shrink: 0;
  }

  /* 내부 스크롤 영역 */
  .pop
