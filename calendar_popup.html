<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 4px;
  }

  /* 고정 높이 달력 카드 (1번 이미지 디자인 유지) */
  .cal-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    height: 410px;
    background: #FFFFFF;
    border: 1.5px solid #F9E5E9;
    border-radius: 24px;
    padding: 18px 20px 14px;
    box-shadow: 0 4px 18px rgba(244, 182, 198, 0.12);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .cal-title {
    text-align: center;
    font-size: 16px;
    font-weight: 900;
    color: #96C8E8;
    letter-spacing: -0.2px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .dow-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 9.5px;
    font-weight: 800;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .dow-grid span { color: #96C8E8; }
  .dow-grid span.wknd { color: #E89CB2; }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 2px;
    flex: 1;
    min-height: 0;
  }

  .day-cell {
    border: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    position: relative;
  }
  .day-pill {
    width: 26px;
    height: 24px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 800;
    color: #5C5350;
    transition: all 0.14s ease;
  }
  .day-cell:hover .day-pill { background: #FDF0F4; }
  .day-cell.other .day-pill { color: #C2BBB8; font-weight: 700; }
  .day-cell.wknd:not(.other) .day-pill { color: #B85C75; }

  /* 일정 있는 날: 핑크 알약 + 하단 하늘 점 */
  .day-cell.has-ev:not(.today) .day-pill {
    background: #F4A9BE;
    color: #FFFFFF;
  }
  .ev-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: transparent;
  }
  .day-cell.has-ev .ev-dot { background: #89C4E8; }

  /* 오늘 날짜: 핑크 테두리 + 하늘색 안쪽 알약 */
  .day-cell.today .day-pill {
    background: #BBE2F7;
    color: #FFFFFF;
    box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3.5px #F4A9BE;
  }

  /* 하단 카운트다운 및 화살표 */
  .cal-foot {
    margin-top: 8px;
    padding-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9.5px;
    font-weight: 800;
    color: #A69E9B;
    flex-shrink: 0;
  }
  .foot-spacer { width: 54px; }
  .reset-timer { text-align: center; }
  .foot-nav {
    width: 54px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
  }
  .f-btn {
    border: none;
    background: transparent;
    color: #96C8E8;
    font-size: 11px;
    font-weight: 900;
    cursor: pointer;
    padding: 2px;
  }
  .f-btn:hover { color: #E889A5; }

  /* 팝업 오버레이 (카드 내부 고정 + 스크롤) */
  .popup-layer {
    position: absolute;
    inset: 0;
    background: rgba(255, 252, 253, 0.96);
    backdrop-filter: blur(3px);
    display: none;
    flex-direction: column;
    padding: 14px 16px;
    z-index: 10;
    animation: fadeIn 0.14s ease-out;
  }
  .popup-layer.show { display: flex; }
  .popup-layer.top { z-index: 20; background: #FFFFFF; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .pop-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-bottom: 8px;
    margin-bottom: 8px;
    border-bottom: 1px solid #F7E8EC;
    flex-shrink: 0;
  }
  .pop-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .back-btn {
    border: 1px solid #F4DCE3;
    background: #FFF7F9;
    color: #D46A87;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 99px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .back-btn:hover { background: #FCE8EE; }
  .pop-h-title {
    font-size: 12px;
    font-weight: 900;
    color: #78B7DF;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pop-pill-cnt {
    font-size: 9.5px;
    font-weight: 800;
    color: #D46A87;
    background: #FFF5F8;
    border: 1px solid #F4DCE3;
    padding: 2px 8px;
    border-radius: 99px;
    flex-shrink: 0;
  }

  /* 내부 스크롤 영역 */
  .pop-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding-right: 3px;
  }
  .pop-scroll::-webkit-scrollbar { width: 4px; }
  .pop-scroll::-webkit-scrollbar-track { background: transparent; }
  .pop-scroll::-webkit-scrollbar-thumb { background: #F2CED8; border-radius: 99px; }

  /* 1단계: 날짜별 레이드 일정 카드 */
  .ev-card {
    border: 1px solid #F3DCE3;
    background: #FFFFFF;
    border-radius: 13px;
    padding: 9px 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
    transition: all 0.14s ease;
  }
  .ev-card:hover {
    background: #FFF8FA;
    border-color: #E8A6B8;
  }
  .ev-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .ev-title {
    font-size: 11px;
    font-weight: 900;
    color: #4A4442;
  }
  .ev-time {
    font-size: 9px;
    font-weight: 800;
    color: #4A84AD;
    background: #EAF5FC;
    padding: 1.5px 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .ev-sub {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9.5px;
    font-weight: 700;
    color: #8E8481;
  }
  .ev-sub-members {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ev-arrow {
    font-size: 9px;
    font-weight: 800;
    color: #D46A87;
    flex-shrink: 0;
  }

  /* 2단계: 3번 이미지 스타일 명단 (딜러 / 서포터 2열 카드) */
  .roster-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    align-items: start;
  }
  .role-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .role-badge {
    align-self: flex-start;
    font-size: 9.5px;
    font-weight: 900;
    padding: 2.5px 8px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .role-badge.dps { background: #FCE6ED; color: #C95B7A; }
  .role-badge.sup { background: #DCF5E7; color: #2E7D52; }

  .m-card {
    border: 1px solid #F3DCE3;
    background: #FFFFFF;
    border-radius: 11px;
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .m-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .m-name {
    font-size: 10.5px;
    font-weight: 900;
    color: #3D3735;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .m-tag {
    font-size: 8px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 5px;
    background: #E8F4FC;
    color: #4682AD;
    flex-shrink: 0;
  }
  .m-info {
    font-size: 8.5px;
    font-weight: 700;
    color: #7D7471;
  }
  .m-memo {
    align-self: flex-start;
    margin-top: 1px;
    font-size: 8px;
    font-weight: 800;
    padding: 1.5px 6px;
    border-radius: 5px;
    background: #FCF5E3;
    color: #9E7524;
    word-break: break-all;
  }

  .meta-bar {
    margin-top: 4px;
    padding: 7px 9px;
    border-radius: 10px;
    background: #FDFBFC;
    border: 1px solid #F4E4E8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-shrink: 0;
  }
  .sel-prof {
    border: 1px solid #E5D5DA;
    background: #FFFFFF;
    color: #4A4442;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3.5px 6px;
    border-radius: 7px;
    outline: none;
  }
  .depart-btn {
    border: 1px solid #CBE6FA;
    background: #EAF6FF;
    color: #2A6896;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3.5px 8px;
    border-radius: 7px;
    cursor: pointer;
  }
  .depart-btn.done {
    background: #E5F6EC;
    border-color: #BFE3CE;
    color: #2E754C;
  }

  .empty-txt {
    margin: auto 0;
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    color: #A69E9B;
  }
</style>
</head>
<body>
  <div class="cal-card">
    <!-- 1번 이미지 스타일 달력 메인 -->
    <div class="cal-title" id="monthLabel">November</div>

    <div class="dow-grid">
      <span>M</span>
      <span>T</span>
      <span>W</span>
      <span>T</span>
      <span>F</span>
      <span class="wknd">S</span>
      <span class="wknd">S</span>
    </div>

    <div class="days-grid" id="daysGrid"></div>

    <div class="cal-foot">
      <div class="foot-spacer"></div>
      <div class="reset-timer" id="resetTimer">D-1 03:19</div>
      <div class="foot-nav">
        <button type="button" class="f-btn" onclick="moveMonth(-1)" title="이전 달">←</button>
        <button type="button" class="f-btn" onclick="loadEvents()" title="새로고침">↻</button>
        <button type="button" class="f-btn" onclick="moveMonth(1)" title="다음 달">→</button>
      </div>
    </div>

    <!-- 1단계 팝업: 선택한 날짜의 레이드 일정 목록 -->
    <div class="popup-layer" id="dayPopup">
      <div class="pop-head">
        <div class="pop-left">
          <button type="button" class="back-btn" onclick="closeDayPopup()">← 달력</button>
          <span class="pop-h-title" id="dayPopupTitle">2026-11-24</span>
        </div>
        <span class="pop-pill-cnt" id="dayPopupCount">0건</span>
      </div>
      <div class="pop-scroll" id="dayEventList"></div>
    </div>

    <!-- 2단계 팝업: 3번 이미지 스타일 명단 (딜러 / 서포터 카드) -->
    <div class="popup-layer top" id="detailPopup">
      <div class="pop-head">
        <div class="pop-left">
          <button type="button" class="back-btn" onclick="closeDetailPopup()">← 목록</button>
          <span class="pop-h-title" id="detailTitle">명단</span>
        </div>
        <span class="pop-pill-cnt" id="detailCount">0명</span>
      </div>

      <div class="pop-scroll" id="rosterScroll">
        <div class="roster-grid">
          <div class="role-col" id="dpsCol"></div>
          <div class="role-col" id="supCol"></div>
        </div>
      </div>

      <div class="meta-bar">
        <select class="sel-prof" id="profSelect" onchange="updateEventMeta()">
          <option value="숙련도 미지정">숙련도 미지정</option>
          <option value="트라이">트라이</option>
          <option value="반숙">반숙</option>
          <option value="숙련">숙련</option>
          <option value="클리어">클리어</option>
        </select>
        <button type="button" class="depart-btn" id="departBtn" onclick="toggleDepart()">출발 전</button>
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://notion-cal.binhaha329.workers.dev";
  const MONTHS_EN = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ];
  const SUPPORTER_JOBS = ["바드", "도화가", "홀리나이트", "발키리"];

  const getKstNow = () => new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
  const initNow = getKstNow();
  let viewYear = initNow.getFullYear();
  let viewMonth = initNow.getMonth();
  let allEvents = [];
  let selectedDateStr = "";
  let currentEvent = null;
  const charCache = {};

  const pad2 = (n) => String(n).padStart(2, "0");
  const formatDateStr = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
  const todayStr = formatDateStr(initNow.getFullYear(), initNow.getMonth(), initNow.getDate());

  // 매주 수요일 오전 6시 초기화 카운트다운
  function updateResetTimer() {
    const now = getKstNow();
    const target = new Date(now);
    const day = now.getDay(); // 0:일 ~ 3:수 ~ 6:토
    let diffDays = (3 - day + 7) % 7;
    target.setDate(now.getDate() + diffDays);
    target.setHours(6, 0, 0, 0);
    if (target <= now) {
      target.setDate(target.getDate() + 7);
    }
    const diffMs = target - now;
    const totalMins = Math.floor(diffMs / 60000);
    const d = Math.floor(totalMins / (60 * 24));
    const h = Math.floor((totalMins % (60 * 24)) / 60);
    const m = totalMins % 60;
    document.getElementById("resetTimer").textContent = `D-${d} ${pad2(h)}:${pad2(m)}`;
  }

  async function loadEvents() {
    try {
      const res = await fetch(`${API_URL}?t=${Date.now()}`);
      const data = await res.json();
      allEvents = Array.isArray(data) ? data : [];
      renderCalendar();
      if (selectedDateStr && document.getElementById("dayPopup").classList.contains("show")) {
        openDayPopup(selectedDateStr);
      }
    } catch (e) {
      renderCalendar();
    }
  }

  function moveMonth(delta) {
    viewMonth += delta;
    if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
    else if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById("monthLabel").textContent = MONTHS_EN[viewMonth];
    const grid = document.getElementById("daysGrid");
    grid.innerHTML = "";

    // 월요일 시작 기준 요일 계산 (0: 월 ~ 6: 일)
    const firstDow = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();

    const eventMap = {};
    for (const ev of allEvents) {
      if (!ev.date) continue;
      if (!eventMap[ev.date]) eventMap[ev.date] = [];
      eventMap[ev.date].push(ev);
    }

    // 이전 달
    for (let i = firstDow - 1; i >= 0; i--) {
      const d = prevMonthDays - i;
      const prevM = viewMonth === 0 ? 11 : viewMonth - 1;
      const prevY = viewMonth === 0 ? viewYear - 1 : viewYear;
      const dateStr = formatDateStr(prevY, prevM, d);
      grid.appendChild(createDayCell(d, dateStr, true, eventMap[dateStr] || [], 0));
    }

    // 이번 달
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = formatDateStr(viewYear, viewMonth, d);
      const dow = (firstDow + d - 1) % 7;
      grid.appendChild(createDayCell(d, dateStr, false, eventMap[dateStr] || [], dow));
    }

    // 다음 달 (42칸 맞춤)
    const remain = 42 - grid.children.length;
    for (let d = 1; d <= remain; d++) {
      const nextM = viewMonth === 11 ? 0 : viewMonth + 1;
      const nextY = viewMonth === 11 ? viewYear + 1 : viewYear;
      const dateStr = formatDateStr(nextY, nextM, d);
      grid.appendChild(createDayCell(d, dateStr, true, eventMap[dateStr] || [], 0));
    }
  }

  function createDayCell(dayNum, dateStr, isOther, dayEvents, dow) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "day-cell";
    if (isOther) btn.classList.add("other");
    if (!isOther && (dow === 5 || dow === 6)) btn.classList.add("wknd");
    if (dateStr === todayStr) btn.classList.add("today");
    if (dayEvents.length > 0) btn.classList.add("has-ev");

    btn.innerHTML = `<span class="day-pill">${dayNum}</span><span class="ev-dot"></span>`;
    btn.onclick = () => openDayPopup(dateStr);
    return btn;
  }

  function openDayPopup(dateStr) {
    selectedDateStr = dateStr;
    const list = allEvents.filter((e) => e.date === dateStr);

    document.getElementById("dayPopupTitle").textContent = dateStr;
    document.getElementById("dayPopupCount").textContent = `${list.length}건`;

    const listEl = document.getElementById("dayEventList");
    listEl.scrollTop = 0;

    if (list.length === 0) {
      listEl.innerHTML = `<div class="empty-txt">선택한 날짜에 일정이 없어요</div>`;
    } else {
      listEl.innerHTML = "";
      list.forEach((ev) => {
        const card = document.createElement("div");
        card.className = "ev-card";
        const diffTxt = ev.difficulty ? `[${ev.difficulty}] ` : "";
        const timeTxt = ev.time || "시간 미정";
        const preview = ev.members ? ev.members.replace(/\n/g, ", ") : "명단 미등록";

        card.innerHTML = `
          <div class="ev-top">
            <span class="ev-title">${diffTxt}${ev.title}</span>
            <span class="ev-time">${timeTxt}</span>
          </div>
          <div class="ev-sub">
            <span class="ev-sub-members">${preview}</span>
            <span class="ev-arrow">명단 보기 ›</span>
          </div>
        `;
        card.onclick = () => openDetailPopup(ev);
        listEl.appendChild(card);
      });
    }

    document.getElementById("dayPopup").classList.add("show");
  }

  function closeDayPopup() {
    closeDetailPopup();
    document.getElementById("dayPopup").classList.remove("show");
  }

  // 명단 문자열 파싱 ("닉네임(메모)" 또는 "닉네임 [지인] - 메모" 형태 지원)
  function parseMemberEntries(rawStr) {
    if (!rawStr || !rawStr.trim()) return [];
    const tokens = rawStr.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean);
    return tokens.map((tok) => {
      let badge = "";
      let note = "";
      let clean = tok;

      if (/지인/.test(clean)) {
        badge = "지인";
        clean = clean.replace(/[\[\(]?지인[\]\)]?/g, "").trim();
      }
      const parenMatch = clean.match(/^([^\(\)\-\/]+)\s*[\(\-\/]([^\)]+)[\)]?$/);
      let name = clean;
      if (parenMatch) {
        name = parenMatch[1].trim();
        note = parenMatch[2].trim();
      }
      return { name, badge, note };
    });
  }

  async function fetchCharSpec(name) {
    if (charCache[name]) return charCache[name];
    try {
      const res = await fetch(`${API_URL}/spec?name=${encodeURIComponent(name)}`);
      const data = await res.json();
      if (data && data.ok) {
        charCache[name] = data;
        return data;
      }
    } catch (e) {}
    return null;
  }

  async function openDetailPopup(ev) {
    currentEvent = ev;
    const entries = parseMemberEntries(ev.members);

    document.getElementById("detailTitle").textContent = `${ev.title || "명단"}`;
    document.getElementById("detailCount").textContent = `${entries.length}명`;

    const profSel = document.getElementById("profSelect");
    const validOpts = Array.from(profSel.options).map((o) => o.value);
    profSel.value = validOpts.includes(ev.proficiency) ? ev.proficiency : "숙련도 미지정";

    const isDeparted = String(ev.status || "").includes("출발") && !String(ev.status || "").includes("전");
    syncDepartBtn(isDeparted);

    const dpsCol = document.getElementById("dpsCol");
    const supCol = document.getElementById("supCol");
    dpsCol.innerHTML = `<div class="role-badge dps">⚔️ 딜러 0</div>`;
    supCol.innerHTML = `<div class="role-badge sup">💚 서포터 0</div>`;
    document.getElementById("rosterScroll").scrollTop = 0;
    document.getElementById("detailPopup").classList.add("show");

    if (entries.length === 0) return;

    // 참여자 캐릭터 정보 조회 후 딜러 / 서포터 분류
    const enriched = await Promise.all(
      entries.map(async (entry) => {
        const spec = await fetchCharSpec(entry.name);
        const job = spec?.job || "";
        const lv = spec?.lv ? String(spec.lv).replace(/,/g, "") : "";
        const cp = spec?.combatPower ? String(spec.combatPower).replace(/,/g, "") : "";
        const isSup = SUPPORTER_JOBS.some((s) => job.includes(s)) || /바드|도화가|홀나|발키리/.test(entry.note);
        return { ...entry, job, lv, cp, isSup };
      })
    );

    const dpsList = enriched.filter((m) => !m.isSup);
    const supList = enriched.filter((m) => m.isSup);

    const renderCard = (m) => {
      const infoParts = [m.job, m.lv, m.cp].filter(Boolean);
      const infoLine = infoParts.length > 0 ? infoParts.join(" | ") : "정보 조회 불가";
      const tagHtml = m.badge ? `<span class="m-tag">${m.badge}</span>` : "";
      const memoHtml = m.note ? `<span class="m-memo">${m.note}</span>` : "";
      return `
        <div class="m-card">
          <div class="m-top">
            <span class="m-name">${m.name}</span>
            ${tagHtml}
          </div>
          <div class="m-info">${infoLine}</div>
          ${memoHtml}
        </div>
      `;
    };

    dpsCol.innerHTML = `<div class="role-badge dps">⚔️ 딜러 ${dpsList.length}</div>` + dpsList.map(renderCard).join("");
    supCol.innerHTML = `<div class="role-badge sup">💚 서포터 ${supList.length}</div>` + supList.map(renderCard).join("");
  }

  function syncDepartBtn(isDeparted) {
    const btn = document.getElementById("departBtn");
    if (isDeparted) {
      btn.textContent = "🚀 출발 완료";
      btn.classList.add("done");
    } else {
      btn.textContent = "출발 전";
      btn.classList.remove("done");
    }
    btn.dataset.departed = isDeparted ? "1" : "0";
  }

  function closeDetailPopup() {
    document.getElementById("detailPopup").classList.remove("show");
    currentEvent = null;
  }

  async function toggleDepart() {
    if (!currentEvent) return;
    const btn = document.getElementById("departBtn");
    const nextState = btn.dataset.departed !== "1";
    syncDepartBtn(nextState);
    currentEvent.status = nextState ? "🚀출발" : "출발 전";
    await sendEventPatch({ pageId: currentEvent.pageId, cleared: nextState });
  }

  async function updateEventMeta() {
    if (!currentEvent) return;
    const prof = document.getElementById("profSelect").value;
    currentEvent.proficiency = prof;
    await sendEventPatch({ pageId: currentEvent.pageId, proficiency: prof });
  }

  async function sendEventPatch(payload) {
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    } catch (e) {}
  }

  updateResetTimer();
  setInterval(updateResetTimer, 30000);
  renderCalendar();
  loadEvents();
</script>
</body>
</html>
