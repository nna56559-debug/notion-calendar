<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 4px;
  }

  :root {
    --page-bg: transparent;
    --card-bg: #FFFFFF;
    --card-border: #F9E5E9;
    --card-shadow: 0 4px 14px rgba(244, 182, 198, 0.08);
    --badge-bg: #E4F1FA;
    --badge-fg: #3D7496;
    --btn-hover-filter: brightness(0.97);
    --pink-bg: #FDF3F6;
    --pink-border: #F5DCE3;
    --pink-fg: #C95B7A;
    --lav-bg: #F6F3FD;
    --lav-border: #E5DDF7;
    --lav-fg: #6B56A8;
    --blue-bg: #F3F9FD;
    --blue-border: #DCECF7;
    --blue-fg: #3D7496;
    --mint-bg: #F3FAF6;
    --mint-border: #DCEEE3;
    --mint-fg: #3D7A56;
    --gold-bg: #FCF8EE;
    --gold-border: #F2E6C8;
    --gold-fg: #A87620;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #191919;
      --card-bg: #1B1A20;
      --card-border: #383342;
      --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
      --badge-bg: #243947;
      --badge-fg: #9BD0F0;
      --btn-hover-filter: brightness(1.08);
      --pink-bg: #2E2028;
      --pink-border: #4A313E;
      --pink-fg: #F5A3BC;
      --lav-bg: #282338;
      --lav-border: #41385C;
      --lav-fg: #C2BDF2;
      --blue-bg: #1C2B36;
      --blue-border: #2C4354;
      --blue-fg: #9BD0F0;
      --mint-bg: #1C352B;
      --mint-border: #2E5243;
      --mint-fg: #8EE0B5;
      --gold-bg: #352F20;
      --gold-border: #524830;
      --gold-fg: #F2C46D;
    }
  }

  :root[data-theme="dark"] {
    --page-bg: #191919;
    --card-bg: #1B1A20;
    --card-border: #383342;
    --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
    --badge-bg: #243947;
    --badge-fg: #9BD0F0;
    --btn-hover-filter: brightness(1.08);
    --pink-bg: #2E2028;
    --pink-border: #4A313E;
    --pink-fg: #F5A3BC;
    --lav-bg: #282338;
    --lav-border: #41385C;
    --lav-fg: #C2BDF2;
    --blue-bg: #1C2B36;
    --blue-border: #2C4354;
    --blue-fg: #9BD0F0;
    --mint-bg: #1C352B;
    --mint-border: #2E5243;
    --mint-fg: #8EE0B5;
    --gold-bg: #352F20;
    --gold-border: #524830;
    --gold-fg: #F2C46D;
  }

  html, body {
    background: var(--page-bg);
  }

  .link-card {
    width: 100%;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 20px;
    padding: 11px 12px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .l-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .l-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 8px;
    border-radius: 7px;
    background: var(--badge-bg);
    color: var(--badge-fg);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .q-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 10.5px;
    font-weight: 800;
    padding: 7px 6px;
    border-radius: 11px;
    transition: transform 0.14s ease, filter 0.14s ease;
  }
  .q-btn:hover {
    transform: translateY(-1px);
    filter: var(--btn-hover-filter);
  }
  .q-wide { grid-column: span 2; }
  .q-pink { background: var(--pink-bg); border: 1px solid var(--pink-border); color: var(--pink-fg); }
  .q-lav  { background: var(--lav-bg);  border: 1px solid var(--lav-border);  color: var(--lav-fg); }
  .q-blue { background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue-fg); }
  .q-mint { background: var(--mint-bg); border: 1px solid var(--mint-border); color: var(--mint-fg); }
  .q-gold { background: var(--gold-bg); border: 1px solid var(--gold-border); color: var(--gold-fg); }

  @media (max-width: 480px) {
    body {
      padding: 2px;
    }
    .link-card {
      border-radius: 16px;
      padding: 9px 10px;
      gap: 6px;
    }
    .grid {
      gap: 5px;
    }
    .q-btn {
      padding: 6px 5px;
      border-radius: 9px;
      font-size: 10px;
    }
  }
</style>
</head>
<body>
  <div class="link-card">
    <div class="l-head">
      <span class="l-badge">바로가기</span>
    </div>
    <div class="grid">
      <a class="q-btn q-pink" href="https://loawa.com" target="_blank" rel="noopener noreferrer">로아와</a>
      <a class="q-btn q-lav" href="https://lopec.kr" target="_blank" rel="noopener noreferrer">로펙</a>
      <a class="q-btn q-blue" href="https://loa.icepeng.com" target="_blank" rel="noopener noreferrer">아이스펭</a>
      <a class="q-btn q-mint" href="https://lostark.inven.co.kr" target="_blank" rel="noopener noreferrer">로아 인벤</a>
      <a class="q-btn q-gold q-wide" href="https://lostark.game.onstove.com" target="_blank" rel="noopener noreferrer">공식홈</a>
    </div>
  </div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</body>
</html>
