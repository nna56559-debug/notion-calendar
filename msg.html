<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 4px;
  }

  :root {
    --page-bg: transparent;
    --card-bg: #FFFFFF;
    --card-border: #F9E5E9;
    --card-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    --scroll-thumb: #F2DCE2;
    --bbl-pink-bg: #FCE8EE;
    --bbl-pink-border: #F5DCE3;
    --bbl-pink-fg: #4A4442;
    --bbl-blue-bg: #E6F3FB;
    --bbl-blue-border: #D0E8F7;
    --bbl-blue-fg: #3B4954;
    --bbl-lav-bg: #F2EBFC;
    --bbl-lav-border: #E4D7F7;
    --bbl-lav-fg: #494154;
    --other-bbl-bg: #F7F4F6;
    --other-bbl-border: #ECE4E8;
    --other-bbl-fg: #4A4442;
    --sender-fg: #C95B7A;
    --time-fg: #B0A6A3;
    --act-bg: #FFFFFF;
    --act-border: #F2DCE2;
    --act-fg: #9E8F94;
    --act-hover-fg: #C95B7A;
    --inp-wrap-bg: #FDFBFC;
    --inp-wrap-border: #F2DCE2;
    --inp-focus-border: #F29CB4;
    --inp-focus-bg: #FFFFFF;
    --nick-border: #F2DCE2;
    --nick-bg: #FCE8EE;
    --nick-fg: #C95B7A;
    --nick-req-border: #E86A8E;
    --txt-main: #4A4442;
    --inp-ph: #BEB5B2;
    --send-bg: #F28BA8;
    --send-hover-bg: #E67595;
    --send-fg: #FFFFFF;
    --empty-fg: #B5AEAB;
    --toast-bg: rgba(201, 91, 122, 0.92);
    --toast-fg: #FFFFFF;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #191919;
      --card-bg: #1B1A20;
      --card-border: #383342;
      --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
      --scroll-thumb: #4B3846;
      --bbl-pink-bg: #36232D;
      --bbl-pink-border: #543646;
      --bbl-pink-fg: #F4F2F8;
      --bbl-blue-bg: #223442;
      --bbl-blue-border: #344F63;
      --bbl-blue-fg: #ECF4FA;
      --bbl-lav-bg: #2D263B;
      --bbl-lav-border: #463B5C;
      --bbl-lav-fg: #F2EFFA;
      --other-bbl-bg: #26252E;
      --other-bbl-border: #3B3748;
      --other-bbl-fg: #EAE6F4;
      --sender-fg: #F5A3BC;
      --time-fg: #878296;
      --act-bg: #24232B;
      --act-border: #3F394D;
      --act-fg: #9A95A8;
      --act-hover-fg: #F5A3BC;
      --inp-wrap-bg: #24232B;
      --inp-wrap-border: #3A3646;
      --inp-focus-border: #C95B7A;
      --inp-focus-bg: #2C2A35;
      --nick-border: #5E3A4A;
      --nick-bg: #3B252E;
      --nick-fg: #F5A3BC;
      --nick-req-border: #F5A3BC;
      --txt-main: #F4F2F8;
      --inp-ph: #878296;
      --send-bg: #C95B7A;
      --send-hover-bg: #DE6F8E;
      --send-fg: #FFFFFF;
      --empty-fg: #878296;
      --toast-bg: rgba(201, 91, 122, 0.95);
      --toast-fg: #FFFFFF;
    }
  }

  :root[data-theme="dark"] {
    --page-bg: #191919;
    --card-bg: #1B1A20;
    --card-border: #383342;
    --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
    --scroll-thumb: #4B3846;
    --bbl-pink-bg: #36232D;
    --bbl-pink-border: #543646;
    --bbl-pink-fg: #F4F2F8;
    --bbl-blue-bg: #223442;
    --bbl-blue-border: #344F63;
    --bbl-blue-fg: #ECF4FA;
    --bbl-lav-bg: #2D263B;
    --bbl-lav-border: #463B5C;
    --bbl-lav-fg: #F2EFFA;
    --other-bbl-bg: #26252E;
    --other-bbl-border: #3B3748;
    --other-bbl-fg: #EAE6F4;
    --sender-fg: #F5A3BC;
    --time-fg: #878296;
    --act-bg: #24232B;
    --act-border: #3F394D;
    --act-fg: #9A95A8;
    --act-hover-fg: #F5A3BC;
    --inp-wrap-bg: #24232B;
    --inp-wrap-border: #3A3646;
    --inp-focus-border: #C95B7A;
    --inp-focus-bg: #2C2A35;
    --nick-border: #5E3A4A;
    --nick-bg: #3B252E;
    --nick-fg: #F5A3BC;
    --nick-req-border: #F5A3BC;
    --txt-main: #F4F2F8;
    --inp-ph: #878296;
    --send-bg: #C95B7A;
    --send-hover-bg: #DE6F8E;
    --send-fg: #FFFFFF;
    --empty-fg: #878296;
    --toast-bg: rgba(201, 91, 122, 0.95);
    --toast-fg: #FFFFFF;
  }

  html, body {
    background: var(--page-bg);
  }

  .chat-card {
    position: relative;
    width: 100%;
    height: 300px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 22px;
    padding: 12px 13px 11px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow: hidden;
  }

  .chat-stream {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 2px 3px 2px 1px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .chat-stream::-webkit-scrollbar { width: 3px; }
  .chat-stream::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }

  .empty-chat {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--empty-fg);
  }

  .msg-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    animation: popIn 0.16s ease-out;
  }
  .msg-block.mine {
    align-items: flex-end;
  }
  .msg-block.other {
    align-items: flex-start;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-sender {
    font-size: 9px;
    font-weight: 800;
    color: var(--sender-fg);
    padding-left: 4px;
  }

  .msg-row {
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 5px;
  }
  .msg-block.mine .msg-row {
    justify-content: flex-end;
  }
  .msg-block.other .msg-row {
    justify-content: flex-start;
  }

  .msg-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex-shrink: 0;
  }
  .msg-block.mine .msg-meta {
    align-items: flex-end;
  }
  .msg-block.other .msg-meta {
    align-items: flex-start;
  }

  .msg-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .msg-block:hover .msg-actions {
    opacity: 1;
  }
  .act-btn {
    border: 1px solid var(--act-border);
    background: var(--act-bg);
    color: var(--act-fg);
    font-family: inherit;
    font-size: 8.5px;
    font-weight: 800;
    width: 15px;
    height: 15px;
    border-radius: 5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: all 0.12s ease;
  }
  .act-btn:hover {
    color: var(--act-hover-fg);
    border-color: var(--nick-border);
  }

  .msg-time {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--time-fg);
    white-space: nowrap;
  }

  .msg-bubble {
    max-width: 76%;
    padding: 6.5px 10px;
    font-size: 10.8px;
    font-weight: 700;
    line-height: 1.38;
    word-break: break-word;
    white-space: pre-wrap;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .msg-bubble:hover {
    filter: brightness(0.985);
  }
  .msg-bubble:active {
    transform: scale(0.98);
  }

  /* 내 말풍선 (오른쪽) */
  .msg-block.mine .msg-bubble {
    border-radius: 13px 13px 4px 13px;
    background: var(--bbl-pink-bg);
    border: 1px solid var(--bbl-pink-border);
    color: var(--bbl-pink-fg);
  }
  .msg-block.mine .msg-bubble.tone-blue {
    background: var(--bbl-blue-bg);
    border-color: var(--bbl-blue-border);
    color: var(--bbl-blue-fg);
  }
  .msg-block.mine .msg-bubble.tone-lav {
    background: var(--bbl-lav-bg);
    border-color: var(--bbl-lav-border);
    color: var(--bbl-lav-fg);
  }

  /* 상대 말풍선 (왼쪽) */
  .msg-block.other .msg-bubble {
    border-radius: 13px 13px 13px 4px;
    background: var(--other-bbl-bg);
    border: 1px solid var(--other-bbl-border);
    color: var(--other-bbl-fg);
  }
  .msg-block.other .msg-bubble.tone-blue {
    background: var(--bbl-blue-bg);
    border-color: var(--bbl-blue-border);
    color: var(--bbl-blue-fg);
  }
  .msg-block.other .msg-bubble.tone-lav {
    background: var(--bbl-lav-bg);
    border-color: var(--bbl-lav-border);
    color: var(--bbl-lav-fg);
  }

  .chat-input-bar {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    background: var(--inp-wrap-bg);
    border: 1.2px solid var(--inp-wrap-border);
    border-radius: 12px;
    padding: 4px 5px 4px 7px;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .chat-input-bar:focus-within {
    border-color: var(--inp-focus-border);
    background: var(--inp-focus-bg);
  }

  .nick-input {
    width: 56px;
    border: 1px solid var(--nick-border);
    background: var(--nick-bg);
    color: var(--nick-fg);
    border-radius: 7px;
    padding: 2.5px 5px;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    text-align: center;
    outline: none;
    flex-shrink: 0;
    margin-bottom: 1px;
    transition: all 0.15s ease;
  }
  .nick-input::placeholder {
    color: var(--nick-fg);
    opacity: 0.65;
  }
  .nick-input.required {
    border-color: var(--nick-req-border);
    box-shadow: 0 0 0 2px rgba(232, 106, 142, 0.25);
  }

  .chat-textarea {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 10.8px;
    font-weight: 700;
    color: var(--txt-main);
    line-height: 1.35;
    resize: none;
    outline: none;
    max-height: 54px;
    min-height: 18px;
    padding: 2px 0;
  }
  .chat-textarea::placeholder {
    color: var(--inp-ph);
    font-weight: 600;
  }

  .tone-dot-btn {
    width: 14px;
    height: 14px;
    border-radius: 999px;
    border: 1.5px solid #FFFFFF;
    box-shadow: 0 0 0 1px var(--nick-border);
    background: #F7B8CA;
    cursor: pointer;
    margin-bottom: 4px;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .tone-dot-btn:hover { transform: scale(1.15); }
  .tone-dot-btn.tone-blue { background: #A9D8F5; box-shadow: 0 0 0 1px #98CCE8; }
  .tone-dot-btn.tone-lav { background: #CEB8F5; box-shadow: 0 0 0 1px #BCA3EB; }

  .send-btn {
    border: none;
    background: var(--send-bg);
    color: var(--send-fg);
    width: 24px;
    height: 22px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .send-btn:hover { background: var(--send-hover-bg); }
  .send-btn:active { transform: scale(0.92); }
  .send-icon {
    width: 11px;
    height: 11px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .copy-toast {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: var(--toast-bg);
    color: var(--toast-fg);
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.18s ease;
    z-index: 20;
  }
  .copy-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 480px) {
    body { padding: 2px; }
    .chat-card {
      height: 270px;
      border-radius: 16px;
      padding: 9px 10px;
    }
    .msg-actions {
      opacity: 1;
    }
    .nick-input {
      width: 48px;
      font-size: 9px;
    }
    .msg-bubble {
      font-size: 10px;
      padding: 5.5px 9px;
    }
    .chat-textarea {
      font-size: 10px;
    }
  }
</style>
</head>
<body>
  <div class="chat-card">
    <div class="copy-toast" id="copyToast">복사됨!</div>

    <div class="chat-stream" id="chatStream"></div>

    <div class="chat-input-bar">
      <input
        type="text"
        class="nick-input"
        id="nickInput"
        maxlength="10"
        placeholder="이름*"
        oninput="handleNickInput(this.value)"
      >
      <button type="button" class="tone-dot-btn" id="toneBtn" onclick="cycleTone()" title="말풍선 색상 변경"></button>
      <textarea
        class="chat-textarea"
        id="chatInput"
        rows="1"
        placeholder="메시지 입력..."
        oninput="autoResize(this)"
        onkeydown="handleKeydown(event)"
      ></textarea>
      <button type="button" class="send-btn" onclick="sendMessage()" title="전송">
        <svg class="send-icon" viewBox="0 0 24 24">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();

  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  const STORAGE_KEY = "lostark_pastel_chat_room_v1";
  const NICK_KEY = "lostark_pastel_chat_nick_v1";
  const TONES = ["pink", "blue", "lav"];

  let myNick = "";
  let state = {
    tone: "pink",
    messages: []
  };

  function formatTimeNow() {
    const now = new Date();
    const h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, "0");
    const ampm = h < 12 ? "오전" : "오후";
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${ampm} ${h12}:${m}`;
  }

  function loadNick() {
    try {
      const saved = String(localStorage.getItem(NICK_KEY) || "").trim();
      myNick = saved;
      if (saved) document.getElementById("nickInput").value = saved;
    } catch (e) {}
  }

  let nickReqTimer = null;
  function highlightNickRequired() {
    const nickEl = document.getElementById("nickInput");
    nickEl.classList.add("required");
    nickEl.focus();
    showToast("이름을 먼저 입력해 주세요");
    clearTimeout(nickReqTimer);
    nickReqTimer = setTimeout(() => {
      nickEl.classList.remove("required");
    }, 1500);
  }

  function handleNickInput(val) {
    const trimmed = String(val || "").trim();
    myNick = trimmed;
    const nickEl = document.getElementById("nickInput");
    if (trimmed) nickEl.classList.remove("required");
    try {
      if (trimmed) localStorage.setItem(NICK_KEY, trimmed);
      else localStorage.removeItem(NICK_KEY);
    } catch (e) {}
    render(false);
  }

  function normalizeMessages(raw) {
    if (!raw || typeof raw !== "object") return null;
    const list = Array.isArray(raw.messages) ? raw.messages : [];
    const cleaned = list
      .filter(m => m && typeof m.text === "string" && m.text.trim())
      .map((m, idx) => ({
        id: String(m.id || `m_${Date.now()}_${idx}`),
        sender: String(m.sender || "").trim(),
        text: String(m.text),
        time: String(m.time || ""),
        tone: TONES.includes(m.tone) ? m.tone : "pink"
      }));
    return {
      tone: TONES.includes(raw.tone) ? raw.tone : "pink",
      messages: cleaned
    };
  }

  function getSig(list) {
    return (list || []).map(m => `${m.id}:${m.sender}:${m.text}:${m.time}:${m.tone}`).join("|");
  }

  async function loadState(isPolling = false) {
    if (!isPolling) {
      loadNick();
      try {
        const local = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const norm = normalizeMessages(local);
        if (norm) {
          state = norm;
          render(true);
        }
      } catch (e) {}
    }

    try {
      const res = await fetch(`${API_BASE}/memo?t=${Date.now()}`);
      const data = await res.json();
      const rawMemo = data && (data.chatMemo || data.state || data);
      const norm = normalizeMessages(rawMemo);
      if (norm && (norm.messages.length > 0 || !isPolling)) {
        const prevSig = getSig(state.messages);
        const nextSig = getSig(norm.messages);
        if (prevSig !== nextSig || !isPolling) {
          const hadNew = norm.messages.length > state.messages.length;
          state = norm;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          render(hadNew || !isPolling);
        }
      }
    } catch (e) {}
  }

  setInterval(() => loadState(true), 8000);

  let saveTimer = null;
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      fetch(`${API_BASE}/memo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatMemo: state })
      }).catch(() => {});
    }, 300);
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 54) + "px";
  }

  function handleKeydown(e) {
    if (e.isComposing) return;
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function cycleTone() {
    const idx = TONES.indexOf(state.tone);
    state.tone = TONES[(idx + 1) % TONES.length];
    updateToneDot();
  }

  function updateToneDot() {
    const btn = document.getElementById("toneBtn");
    btn.classList.remove("tone-blue", "tone-lav");
    if (state.tone === "blue") btn.classList.add("tone-blue");
    if (state.tone === "lav") btn.classList.add("tone-lav");
  }

  function sendMessage() {
    const nickInput = document.getElementById("nickInput");
    const sender = String(nickInput.value || "").trim();
    if (!sender) {
      highlightNickRequired();
      return;
    }

    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;

    myNick = sender;
    try { localStorage.setItem(NICK_KEY, sender); } catch (e) {}

    state.messages.push({
      id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
      sender,
      text,
      time: formatTimeNow(),
      tone: state.tone
    });

    input.value = "";
    input.style.height = "18px";
    render(true);
    saveState();
  }

  function deleteMessage(id, e) {
    if (e) e.stopPropagation();
    state.messages = state.messages.filter(m => m.id !== id);
    render(false);
    saveState();
  }

  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById("copyToast");
    toast.textContent = msg || "복사됨!";
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 1200);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
    showToast("복사됨!");
  }

  function render(scrollToBottom) {
    updateToneDot();
    const streamEl = document.getElementById("chatStream");
    streamEl.innerHTML = "";

    if (state.messages.length === 0) {
      streamEl.innerHTML = `<div class="empty-chat">대화를 남겨보세요</div>`;
      return;
    }

    const currentNick = String(document.getElementById("nickInput")?.value || myNick || "").trim();

    state.messages.forEach((msg, idx) => {
      const isMine = Boolean(currentNick && msg.sender && msg.sender === currentNick);
      const prev = state.messages[idx - 1];
      const prevIsMine = prev ? Boolean(currentNick && prev.sender && prev.sender === currentNick) : null;
      const sameGroupAsPrev = prev && prev.sender === msg.sender && prev.time === msg.time && prevIsMine === isMine;

      const block = document.createElement("div");
      block.className = "msg-block " + (isMine ? "mine" : "other");

      if (!isMine && msg.sender && !sameGroupAsPrev) {
        const senderEl = document.createElement("div");
        senderEl.className = "msg-sender";
        senderEl.textContent = msg.sender;
        block.appendChild(senderEl);
      }

      const row = document.createElement("div");
      row.className = "msg-row";

      const meta = document.createElement("div");
      meta.className = "msg-meta";

      const actions = document.createElement("div");
      actions.className = "msg-actions";

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "act-btn";
      delBtn.textContent = "×";
      delBtn.title = "삭제";
      delBtn.onclick = (e) => deleteMessage(msg.id, e);

      actions.appendChild(delBtn);

      const timeSpan = document.createElement("span");
      timeSpan.className = "msg-time";
      timeSpan.textContent = msg.time;

      meta.appendChild(actions);
      meta.appendChild(timeSpan);

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble" + (msg.tone === "blue" ? " tone-blue" : msg.tone === "lav" ? " tone-lav" : "");
      bubble.textContent = msg.text;
      bubble.title = "클릭 시 복사";
      bubble.onclick = () => copyText(msg.text);

      if (isMine) {
        row.appendChild(meta);
        row.appendChild(bubble);
      } else {
        row.appendChild(bubble);
        row.appendChild(meta);
      }

      block.appendChild(row);
      streamEl.appendChild(block);
    });

    if (scrollToBottom) {
      streamEl.scrollTop = streamEl.scrollHeight;
    }
  }

  render(true);
  loadState(false);
</script>
</body>
</html>
