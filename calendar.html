<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .cal-card {
    position: relative;
    width: 310px;
    background: #fdfafb;
    border-radius: 22px;
    padding: 28px 22px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    text-align: center;
  }
  .month-title {
    font-size: 22px;
    font-weight: 700;
    color: #b8dce8;
    margin-bottom: 22px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    row-gap: 10px;
    align-items: center;
    justify-items: center;
  }
  .weekday {
    font-size: 12px;
    font-weight: 600;
    color: #b8dce8;
    margin-bottom: 6px;
  }
  .day-cell {
    position: relative;
    width: 34px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    color: #444;
    cursor: default;
    transition: background 0.15s ease;
  }
  .day-cell:hover {
    background: rgba(184, 220, 232, 0.14);
  }
  .day-num {
    width: 26px;
    height: 26px;
    line-height: 26px;
    border-radius: 7px;
  }
  .other-month { color: #ccc; }
  .weekend { color: #b85c5c; }
  .other-month.weekend { color: #e0baba; }

  /* 일정 있는 날 하단 점 (기본/중요 공통) */
  .dot {
    width: 3.5px;
    height: 3.5px;
    background: #b8dce8;
    border-radius: 50%;
    margin-top: 3px;
  }
  .dot-placeholder {
    width: 3.5px;
    height: 3.5px;
    margin-top: 3px;
  }

  /* 중요 일정 있는 날 (파스텔 핑크 배경) */
  .has-important .day-num {
    background: #f6b8c8;
    color: #fff;
    font-weight: 600;
  }

  /* 오늘 날짜 (파스텔 하늘색 배경) */
  .today .day-num {
    background: #a8dce8 !important;
    color: #fff !important;
    font-weight: 700;
  }

  /* 마우스 올렸을 때 하얀 말풍선 컨테이너 */
  .tooltip {
    display: none;
    flex-direction: column;
    gap: 5px;
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    padding: 7px;
    border-radius: 13px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    z-index: 20;
    min-width: 110px;
  }
  .day-cell:hover .tooltip {
    display: flex;
  }

  /* 말풍선 내부 개별 일정 알약 배지 */
  .tooltip-item {
    font-size: 11px;
    font-weight: 600;
    color: #444;
    padding: 6px 11px;
    border-radius: 8px;
    white-space: nowrap;
    text-align: center;
  }
  .tooltip-item.normal {
    background: #e4f4fa; /* 일반 일정: 연하늘색 */
  }
  .tooltip-item.important {
    background: #fce8ee; /* 중요 일정: 연분홍색 */
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding: 0 6px;
  }
  .brand {
    font-size: 9px;
    letter-spacing: 2px;
    color: #b0b8bc;
  }
  .nav-btns button {
    background: none;
    border: none;
    color: #b8dce8;
    font-size: 13px;
    cursor: pointer;
    margin-left: 6px;
  }
  .nav-btns button:hover { color: #82bfd4; }
</style>
</head>
<body>

<div class="cal-card">
  <div class="month-title" id="monthTitle">November</div>
  <div class="grid" id="calGrid"></div>
  <div class="footer">
    <span style="width:45px"></span>
    <span class="brand">RAID CALENDAR</span>
    <div class="nav-btns">
      <button onclick="changeMonth(-1)">←</button>
      <button onclick="resetToday()">↻</button>
      <button onclick="changeMonth(1)">→</button>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = "https://notion-cal.binhaha329.workers.dev";

  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const weekdays = ["M","T","W","T","F","S","S"];
  let current = new Date();
  let eventMap = {};

  async function loadEvents() {
    try {
      const res = await fetch(WORKER_URL);
      const list = await res.json();
      eventMap = {};
      list.forEach(item => {
        if (!eventMap[item.date]) eventMap[item.date] = [];
        eventMap[item.date].push({ title: item.title, important: !!item.important });
      });
    } catch (e) { console.error(e); }
    render();
  }

  function render() {
    const year = current.getFullYear();
    const month = current.getMonth();
    document.getElementById("monthTitle").textContent = months[month];

    const grid = document.getElementById("calGrid");
    grid.innerHTML = weekdays.map(d => `<div class="weekday">${d}</div>`).join("");

    const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLast = new Date(year, month, 0).getDate();
    const todayStr = new Date().toLocaleDateString("en-CA");

    // 이전 달 날짜
    for (let i = firstDay - 1; i >= 0; i--) {
      grid.innerHTML += `<div class="day-cell other-month"><div class="day-num">${prevLast - i}</div><div class="dot-placeholder"></div></div>`;
    }

    // 이번 달 날짜
    for (let d = 1; d <= lastDate; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dayOfWeek = (firstDay + d - 1) % 7;
      const isWeekend = dayOfWeek >= 5 ? "weekend" : "";
      const isToday = dateStr === todayStr ? "today" : "";
      const items = eventMap[dateStr] || [];
      const hasImportant = items.some(ev => ev.important) ? "has-important" : "";

      const tooltipHtml = items.length
        ? `<div class="dot"></div>
           <div class="tooltip">
             ${items.map(ev => `<div class="tooltip-item ${ev.important ? "important" : "normal"}">${ev.title}</div>`).join("")}
           </div>`
        : `<div class="dot-placeholder"></div>`;

      grid.innerHTML += `
        <div class="day-cell ${isWeekend} ${isToday} ${hasImportant}">
          <div class="day-num">${d}</div>
          ${tooltipHtml}
        </div>`;
    }
  }

  function changeMonth(diff) {
    current.setMonth(current.getMonth() + diff);
    render();
  }
  function resetToday() {
    current = new Date();
    render();
  }

  render();
  loadEvents();
</script>
</body>
</html>
