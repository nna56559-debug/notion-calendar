<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Pretendard', sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .cal-card {
    position: relative;
    width: 100%;
    max-width: 310px;
    background: #fdfafb;
    border-radius: 22px;
    padding: 22px 18px 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    text-align: center;
  }
  .month-title { font-size: 21px; font-weight: 700; color: #b8dce8; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 8px; align-items: center; justify-items: center; }
  .weekday { font-size: 12px; font-weight: 600; color: #b8dce8; margin-bottom: 4px; }
  .day-cell {
    position: relative; width: 34px; height: 36px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500; color: #444; cursor: pointer;
  }
  .day-cell:hover, .day-cell.active { background: rgba(184, 220, 232, 0.2); }
  .day-num { width: 25px; height: 25px; line-height: 25px; border-radius: 7px; }
  .other-month { color: #ccc; cursor: default; }
  .weekend { color: #b85c5c; }
  .other-month.weekend { color: #e0baba; }
  .has-event .day-num { background: #f6b8c8; color: #fff; font-weight: 600; }
  .dot { width: 3.5px; height: 3.5px; background: #b8dce8; border-radius: 50%; margin-top: 2px; }
  .dot-ph { width: 3.5px; height: 3.5px; margin-top: 2px; }
  .today .day-num { background: #a8dce8 !important; color: #fff !important; font-weight: 700; }

  .tooltip {
    display: none; flex-direction: column; gap: 6px; position: absolute; top: 38px; left: 50%;
    transform: translateX(-50%); background: #fff; padding: 8px; border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14); border: 1px solid rgba(0,0,0,0.05);
    z-index: 30; width: 172px; text-align: left;
  }
  .day-cell.col-l .tooltip { left: -4px; transform: none; }
  .day-cell.col-r .tooltip { left: auto; right: -4px; transform: none; }
  .day-cell:hover .tooltip, .day-cell.active .tooltip { display: flex; }

  .ncard { border-radius: 9px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; background: #f5f7f9; }
  .ncard.bg-p { background: #f3ecfa; }
  .ncard.bg-k { background: #fcebed; }
  .ncard.bg-y { background: #fbf6e6; }
  .ctop { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
  .ctitle { font-size: 11px; font-weight: 700; color: #2f2f2f; line-height: 1.3; word-break: keep-all; }
  .ctime { font-size: 9.5px; color: #8c8c8c; flex-shrink: 0; }
  .cbadges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge { font-size: 9.5px; font-weight: 600; padding: 2px 6px; border-radius: 5px; }
  .b-p { background: #e3d3f7; color: #5b388a; }
  .b-k { background: #f8d2d7; color: #963744; }
  .b-y { background: #f4e6b8; color: #7c621b; }
  .b-d { background: #e3eef5; color: #3c647d; }
  .p-hw { background: #f2dfd3; color: #875538; }
  .p-hf { background: #d6e8f8; color: #2f618c; }
  .p-cl { background: #d5ede0; color: #2d6b4b; }
  .p-gr { background: #e8e8e6; color: #6b6b69; }
  .stxt { font-weight: 600; font-size: 10px; color: #444; }

  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 0 6px; }
  .brand { font-size: 9px; letter-spacing: 2px; color: #b0b8bc; }
  .nav-btns button { background: none; border: none; color: #b8dce8; font-size: 14px; cursor: pointer; padding: 4px 6px; }
</style>
</head>
<body>
<div class="cal-card">
  <div class="month-title" id="monthTitle">November</div>
  <div class="grid" id="calGrid"></div>
  <div class="footer">
    <span style="width:45px"></span>
    <span class="brand">RAID CALENDAR</span>
    <div class="nav-btns">
      <button onclick="changeMonth(-1)">←</button>
      <button onclick="resetToday()">↻</button>
      <button onclick="changeMonth(1)">→</button>
    </div>
  </div>
</div>
<script>
  const WORKER_URL = "https://notion-cal.binhaha329.workers.dev";
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const weekdays = ["M","T","W","T","F","S","S"];
  let current = new Date();
  let eventMap = {};

  async function loadEvents() {
    try {
      const res = await fetch(WORKER_URL);
      const list = await res.json();
      eventMap = {};
      list.forEach(item => {
        if (!eventMap[item.date]) eventMap[item.date] = [];
        eventMap[item.date].push(item);
      });
    } catch (e) {}
    render();
  }

  function getDiff(d) {
    if (d === "나이트메어" || d === "3단계") return ["bg-p", "b-p"];
    if (d === "하드" || d === "2단계") return ["bg-k", "b-k"];
    if (d === "노말" || d === "1단계") return ["bg-y", "b-y"];
    return ["", "b-d"];
  }

  function getProf(p) {
    if (p === "숙제") return "p-hw";
    if (p === "반숙") return "p-hf";
    if (p === "클경") return "p-cl";
    return "p-gr";
  }

  function renderCard(ev) {
    const [bg, bd] = getDiff(ev.difficulty);
    const dHtml = ev.difficulty ? `<span class="badge ${bd}">${ev.difficulty}</span>` : "";
    const pHtml = ev.proficiency ? `<span class="badge ${getProf(ev.proficiency)}">${ev.proficiency}</span>` : "";
    const sHtml = ev.status ? `<div class="stxt">${ev.status}</div>` : "";
    return `<div class="ncard ${bg}"><div class="ctop"><div class="ctitle">${ev.title}</div>${ev.time ? `<div class="ctime">${ev.time}</div>` : ""}</div>${(dHtml || pHtml) ? `<div class="cbadges">${dHtml}${pHtml}</div>` : ""}${sHtml}</div>`;
  }

  function toggleDay(el, e) {
    e.stopPropagation();
    const on = el.classList.contains("active");
    document.querySelectorAll(".day-cell.active").forEach(c => c.classList.remove("active"));
    if (!on) el.classList.add("active");
  }
  document.addEventListener("click", () => document.querySelectorAll(".day-cell.active").forEach(c => c.classList.remove("active")));

  function render() {
    const y = current.getFullYear(), m = current.getMonth();
    document.getElementById("monthTitle").textContent = months[m];
    const grid = document.getElementById("calGrid");
    let html = weekdays.map(d => `<div class="weekday">${d}</div>`).join("");
    const first = (new Date(y, m, 1).getDay() + 6) % 7;
    const last = new Date(y, m + 1, 0).getDate();
    const prev = new Date(y, m, 0).getDate();
    const today = new Date().toLocaleDateString("en-CA");

    for (let i = first - 1; i >= 0; i--) {
      html += `<div class="day-cell other-month"><div class="day-num">${prev - i}</div><div class="dot-ph"></div></div>`;
    }
    for (let d = 1; d <= last; d++) {
      const ds = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dow = (first + d - 1) % 7;
      const wk = dow >= 5 ? "weekend" : "";
      const col = dow <= 1 ? "col-l" : dow >= 5 ? "col-r" : "";
      const td = ds === today ? "today" : "";
      const items = eventMap[ds] || [];
      const evCls = items.length ? "has-event" : "";
      const clk = items.length ? `onclick="toggleDay(this, event)"` : "";
      const tip = items.length ? `<div class="dot"></div><div class="tooltip">${items.map(renderCard).join("")}</div>` : `<div class="dot-ph"></div>`;
      html += `<div class="day-cell ${wk} ${col} ${td} ${evCls}" ${clk}><div class="day-num">${d}</div>${tip}</div>`;
    }
    grid.innerHTML = html;
  }

  function changeMonth(d) { current.setMonth(current.getMonth() + d); render(); }
  function resetToday() { current = new Date(); render(); }
  render();
  loadEvents();
</script>
</body>
</html>
