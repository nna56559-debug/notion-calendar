<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .cal-card {
    position: relative;
    width: 320px;
    background: #fdfafb;
    border-radius: 22px;
    padding: 26px 20px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    text-align: center;
  }
  .month-title {
    font-size: 22px;
    font-weight: 700;
    color: #b8dce8;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    row-gap: 10px;
    align-items: center;
    justify-items: center;
  }
  .weekday {
    font-size: 12px;
    font-weight: 600;
    color: #b8dce8;
    margin-bottom: 6px;
  }
  .day-cell {
    position: relative;
    width: 34px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    color: #444;
    cursor: default;
    transition: background 0.15s ease;
  }
  .day-cell:hover {
    background: rgba(184, 220, 232, 0.16);
  }
  .day-num {
    width: 26px;
    height: 26px;
    line-height: 26px;
    border-radius: 7px;
  }
  .other-month { color: #ccc; }
  .weekend { color: #b85c5c; }
  .other-month.weekend { color: #e0baba; }

  /* 일정 있는 날 (파스텔 핑크 배경 + 하단 하늘색 점) */
  .has-event .day-num {
    background: #f6b8c8;
    color: #fff;
    font-weight: 600;
  }
  .dot {
    width: 3.5px;
    height: 3.5px;
    background: #b8dce8;
    border-radius: 50%;
    margin-top: 3px;
  }
  .dot-placeholder {
    width: 3.5px;
    height: 3.5px;
    margin-top: 3px;
  }

  /* 오늘 날짜 (파스텔 하늘색 배경) */
  .today .day-num {
    background: #a8dce8 !important;
    color: #fff !important;
    font-weight: 700;
  }

  /* 마우스 올렸을 때 노션 카드형 말풍선 */
  .tooltip {
    display: none;
    flex-direction: column;
    gap: 6px;
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    padding: 8px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    border: 1px solid rgba(0, 0, 0, 0.04);
    z-index: 30;
    width: 175px;
    text-align: left;
  }
  .day-cell.col-left .tooltip { left: -4px; transform: none; }
  .day-cell.col-right .tooltip { left: auto; right: -4px; transform: none; }

  .day-cell:hover .tooltip {
    display: flex;
  }

  /* 개별 노션 카드 디자인 */
  .notion-card {
    border-radius: 9px;
    padding: 8px 9px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: #f5f7f9;
    border: 1px solid rgba(0,0,0,0.03);
  }
  /* 난이도별 카드 배경색 */
  .notion-card.bg-purple { background: #f3ecfa; } /* 나이트메어, 3단계 */
  .notion-card.bg-pink   { background: #fcebed; } /* 하드, 2단계 */
  .notion-card.bg-yellow { background: #fbf6e6; } /* 노말, 1단계 */

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 4px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 700;
    color: #2f2f2f;
    line-height: 1.3;
    word-break: keep-all;
  }
  .card-time {
    font-size: 9.5px;
    font-weight: 500;
    color: #8c8c8c;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* 배지 줄 (난이도 + 숙련도) */
  .card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .badge {
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 5px;
    line-height: 1.2;
  }
  /* 난이도 배지 색상 */
  .badge-purple  { background: #e3d3f7; color: #5b388a; }
  .badge-pink    { background: #f8d2d7; color: #963744; }
  .badge-yellow  { background: #f4e6b8; color: #7c621b; }
  .badge-default { background: #e3eef5; color: #3c647d; }

  /* 숙련도 배지 색상 */
  .badge-prof-hw   { background: #f2dfd3; color: #875538; } /* 숙제 */
  .badge-prof-half { background: #d6e8f8; color: #2f618c; } /* 반숙 */
  .badge-prof-clr  { background: #d5ede0; color: #2d6b4b; } /* 클경 */
  .badge-prof-gray { background: #e8e8e6; color: #6b6b69; } /* 트라이, 숙련도 미지정 */

  /* 하단 출발여부 */
  .status-text {
    font-weight: 600;
    font-size: 10px;
    color: #444;
    margin-top: 1px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding: 0 6px;
  }
  .brand {
    font-size: 9px;
    letter-spacing: 2px;
    color: #b0b8bc;
  }
  .nav-btns button {
    background: none;
    border: none;
    color: #b8dce8;
    font-size: 13px;
    cursor: pointer;
    margin-left: 6px;
  }
  .nav-btns button:hover { color: #82bfd4; }
</style>
</head>
<body>

<div class="cal-card">
  <div class="month-title" id="monthTitle">November</div>
  <div class="grid" id="calGrid"></div>
  <div class="footer">
    <span style="width:45px"></span>
    <span class="brand">RAID CALENDAR</span>
    <div class="nav-btns">
      <button onclick="changeMonth(-1)">←</button>
      <button onclick="resetToday()">↻</button>
      <button onclick="changeMonth(1)">→</button>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = "https://notion-cal.binhaha329.workers.dev";

  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const weekdays = ["M","T","W","T","F","S","S"];
  let current = new Date();
  let eventMap = {};

  async function loadEvents() {
    try {
      const res = await fetch(WORKER_URL);
      const list = await res.json();
      eventMap = {};
      list.forEach(item => {
        if (!eventMap[item.date]) eventMap[item.date] = [];
        eventMap[item.date].push(item);
      });
    } catch (e) { console.error(e); }
    render();
  }

  function getDiffStyle(diff) {
    if (!diff) return { card: "", badge: "badge-default" };
    if (diff === "나이트메어" || diff === "3단계") return { card: "bg-purple", badge: "badge-purple" };
    if (diff === "하드" || diff === "2단계") return { card: "bg-pink", badge: "badge-pink" };
    if (diff === "노말" || diff === "1단계") return { card: "bg-yellow", badge: "badge-yellow" };
    return { card: "", badge: "badge-default" };
  }

  function getProfClass(prof) {
    if (prof === "숙제") return "badge-prof-hw";
    if (prof === "반숙") return "badge-prof-half";
    if (prof === "클경") return "badge-prof-clr";
    return "badge-prof-gray";
  }

  function renderCard(ev) {
    const style = getDiffStyle(ev.difficulty);
    const diffBadge = ev.difficulty ? `<span class="badge ${style.badge}">${ev.difficulty}</span>` : "";
    const profBadge = ev.proficiency ? `<span class="badge ${getProfClass(ev.proficiency)}">${ev.proficiency}</span>` : "";
    const statusHtml = ev.status ? `<div class="status-text">${ev.status}</div>` : "";

    return `
      <div class="notion-card ${style.card}">
        <div class="card-top">
          <div class="card-title">${ev.title}</div>
          ${ev.time ? `<div class="card-time">${ev.time}</div>` : ""}
        </div>
        ${(diffBadge || profBadge) ? `<div class="card-badges">${diffBadge}${profBadge}</div>` : ""}
        ${statusHtml}
      </div>`;
  }

  function render() {
    const year = current.getFullYear();
    const month = current.getMonth();
    document.getElementById("monthTitle").textContent = months[month];

    const grid = document.getElementById("calGrid");
    grid.innerHTML = weekdays.map(d => `<div class="weekday">${d}</div>`).join("");

    const firstDay = (
