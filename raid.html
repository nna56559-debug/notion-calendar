<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 4px;
  }

  .raid-card {
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid #F9E5E9;
    border-radius: 22px;
    padding: 12px 14px 12px;
    box-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .r-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .r-left {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .r-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 7px;
    border-radius: 7px;
    background: #FCE6ED;
    color: #C95B7A;
  }
  .r-pct {
    font-size: 10.5px;
    font-weight: 900;
    color: #D96B8A;
    white-space: nowrap;
  }
  .r-gold {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6.5px;
    border-radius: 6px;
    background: #FCF6E3;
    border: 1px solid #F3E5BE;
    color: #B37E22;
    white-space: nowrap;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    justify-content: flex-end;
    min-width: 0;
  }
  .search-input {
    width: 82px;
    max-width: 100%;
    border: 1px solid #F2DCE2;
    background: #FDFBFC;
    border-radius: 7px;
    padding: 2.5px 6px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    color: #4A4442;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .search-input::placeholder {
    color: #BEB5B2;
    font-weight: 600;
  }
  .search-input:focus {
    border-color: #F29CB4;
    background: #FFFFFF;
  }
  .search-btn {
    border: none;
    background: #E4F1FA;
    color: #3D7496;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 6.5px;
    border-radius: 7px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .search-btn:hover { background: #D0E8F7; }
  .r-reset {
    border: none;
    background: transparent;
    color: #AED9EB;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .r-reset:hover { color: #E58FA7; }

  .roster-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 1px;
  }
  .roster-tabs::-webkit-scrollbar { height: 2px; }
  .roster-tabs::-webkit-scrollbar-thumb { background: #F2DCE2; border-radius: 999px; }

  .r-tab {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid #F2E2E7;
    background: #FDF9FA;
    color: #8E8285;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 700;
    padding: 2.5px 8px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .r-tab:hover {
    border-color: #EAB6C5;
    color: #C95B7A;
  }
  .r-tab.active {
    background: #FCE8EE;
    border-color: #F3B8C9;
    color: #C95B7A;
    font-weight: 800;
  }
  .tab-del {
    font-size: 10px;
    line-height: 1;
    color: #C7B3B9;
    padding-left: 1px;
    display: none;
  }
  .r-tab:hover .tab-del {
    display: inline;
  }
  .tab-del:hover {
    color: #D95374;
  }

  .prog-track {
    width: 100%;
    height: 4px;
    background: #F8EEF1;
    border-radius: 999px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #F6B4CA, #AED9EB);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .char-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .c-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #FDFBFC;
    border: 1px solid #F5E8EC;
    border-radius: 9px;
    padding: 4px 10px;
    transition: all 0.15s ease;
  }
  .c-row.all-done {
    background: #F7FCF9;
    border-color: #DCEFE3;
  }

  .c-info {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }
  .c-name {
    font-size: 10.5px;
    font-weight: 800;
    color: #4A4442;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .c-lv {
    font-size: 8.5px;
    font-weight: 700;
    color: #938985;
    background: #F4EFF1;
    padding: 1px 5px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .hearts {
    display: flex;
    align-items: center;
    gap: 5.5px;
    flex-shrink: 0;
  }
  .heart-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .heart-btn:hover { transform: scale(1.18); }
  .heart-btn:active { transform: scale(0.9); }
  .heart-svg {
    width: 14px;
    height: 14px;
    fill: #F7E8EC;
    stroke: #E9B8C6;
    stroke-width: 1.8;
    transition: all 0.18s ease;
  }
  .heart-btn.checked .heart-svg {
    fill: #F28BA8;
    stroke: #E36B8E;
    filter: drop-shadow(0 2px 4px rgba(242, 139, 168, 0.35));
  }
</style>
</head>
<body>
  <div class="raid-card">
    <div class="r-head">
      <div class="r-left">
        <span class="r-badge">레이드</span>
        <span class="r-pct" id="progVal">0% (0/18)</span>
        <span class="r-gold" id="goldVal">0 G</span>
      </div>
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="닉네임 검색" onkeydown="if(event.key==='Enter') searchRoster()">
        <button type="button" class="search-btn" id="searchBtn" onclick="searchRoster()">검색</button>
        <button type="button" class="r-reset" onclick="manualReset()" title="현재 원정대 하트 초기화">↻</button>
      </div>
    </div>

    <div class="roster-tabs" id="rosterTabs"></div>

    <div class="prog-track">
      <div class="prog-fill" id="progFill"></div>
    </div>

    <div class="char-list" id="charList"></div>
  </div>

<script>
  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  const STORAGE_KEY = "lostark_pastel_rosters_v4";

  const DEFAULT_ROSTERS = [
    {
      id: "양녕하새오",
      label: "양녕하새오",
      chars: [
        { name: "양녕하새오", lvText: "1,783", checks: [false, false, false] },
        { name: "치즈보끔바", lvText: "1,772", checks: [false, false, false] },
        { name: "맘념하새모", lvText: "1,770", checks: [false, false, false] },
        { name: "해피무",     lvText: "1,765", checks: [false, false, false] },
        { name: "아령하새오", lvText: "1,756", checks: [false, false, false] },
        { name: "양녕전사",   lvText: "1,733", checks: [false, false, false] }
      ]
    }
  ];

  function getGoldPerHeart(lvText) {
    const lv = parseFloat(String(lvText || "0").replace(/,/g, "")) || 0;
    if (lv >= 1770) return 38000;
    if (lv >= 1740) return 34000;
    if (lv >= 1720) return 31000;
    if (lv >= 1700) return 28000;
    if (lv >= 1680) return 25000;
    if (lv >= 1660) return 21500;
    if (lv >= 1640) return 18000;
    return 13000;
  }

  // 한국 시간(KST) 기준 매주 수요일 오전 06:00 주차 키 반환
  function getCurrentWeekKey() {
    const now = new Date();
    const kst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
    // 오전 6시를 자정(0시)처럼 취급해 수요일 06:00 전후로 주차가 갈리도록 계산
    const shifted = new Date(kst.getTime() - 6 * 3600 * 1000);
    const day = shifted.getDay(); // 0:일, 1:월, 2:화, 3:수, 4:목, 5:금, 6:토
    const diffToWed = (day + 4) % 7;
    shifted.setDate(shifted.getDate() - diffToWed);
    return `${shifted.getFullYear()}-${String(shifted.getMonth() + 1).padStart(2, "0")}-${String(shifted.getDate()).padStart(2, "0")}`;
  }

  let state = {
    weekKey: getCurrentWeekKey(),
    activeId: DEFAULT_ROSTERS[0].id,
    rosters: JSON.parse(JSON.stringify(DEFAULT_ROSTERS))
  };

  function normalizeState(raw) {
    if (!raw || typeof raw !== "object") return null;
    const currentWeek = getCurrentWeekKey();
    let rosters = [];

    if (Array.isArray(raw.rosters) && raw.rosters.length > 0) {
      rosters = raw.rosters;
    } else if (Array.isArray(raw.chars) && raw.chars.length > 0) {
      const topName = raw.chars[0].name || "원정대 1";
      rosters = [{ id: topName, label: topName, chars: raw.chars }];
    } else {
      return null;
    }

    // 수요일 오전 06:00이 지나면 원정대·캐릭터는 유지하고 하트 체크만 false로 초기화
    let weekChanged = false;
    if (raw.weekKey !== currentWeek) {
      rosters.forEach(r => {
        (r.chars || []).forEach(c => {
          c.checks = [false, false, false];
        });
      });
      weekChanged = true;
    }

    const activeId = rosters.some(r => r.id === raw.activeId) ? raw.activeId : rosters[0].id;
    return {
      normalized: { weekKey: currentWeek, activeId, rosters },
      weekChanged
    };
  }

  // 화면을 켜둔 상태로 수요일 오전 6시를 넘겨도 1분마다 감지해 하트만 초기화
  function checkWeeklyAutoReset() {
    const currentWeek = getCurrentWeekKey();
    if (state.weekKey !== currentWeek) {
      state.weekKey = currentWeek;
      state.rosters.forEach(r => {
        (r.chars || []).forEach(c => {
          c.checks = [false, false, false];
        });
      });
      render();
      saveState();
    }
  }
  setInterval(checkWeeklyAutoReset, 60000);

  async function loadState() {
    try {
      const localSaved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      const resNorm = normalizeState(localSaved);
      if (resNorm) {
        state = resNorm.normalized;
        render();
      }
    } catch (e) {}

    try {
      const res = await fetch(`${API_BASE}/raid?t=${Date.now()}`);
      const data = await res.json();
      const resNorm = normalizeState(data && data.state);
      if (resNorm) {
        state = resNorm.normalized;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        render();
        if (resNorm.weekChanged) saveState();
      }
    } catch (e) {}
  }

  let saveTimer = null;
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      fetch(`${API_BASE}/raid`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ state })
      }).catch(() => {});
    }, 300);
  }

  function getActiveRoster() {
    return state.rosters.find(r => r.id === state.activeId) || state.rosters[0];
  }

  function selectRoster(id) {
    state.activeId = id;
    render();
    saveState();
  }

  function removeRoster(e, id) {
    e.stopPropagation();
    if (state.rosters.length <= 1) {
      alert("최소 1개의 원정대 목록은 유지되어야 합니다.");
      return;
    }
    if (!confirm("이 원정대 탭을 목록에서 삭제할까요?")) return;
    state.rosters = state.rosters.filter(r => r.id !== id);
    if (state.activeId === id) {
      state.activeId = state.rosters[0].id;
    }
    render();
    saveState();
  }

  async function searchRoster() {
    const input = document.getElementById("searchInput");
    const btn = document.getElementById("searchBtn");
    const keyword = input.value.trim();
    if (!keyword) return;

    btn.textContent = "조회중";
    btn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/siblings?name=${encodeURIComponent(keyword)}`);
      const list = await res.json();

      if (!Array.isArray(list) || list.length === 0) {
        alert("캐릭터를 찾을 수 없습니다. 닉네임을 확인해 주세요.");
      } else {
        const rosterId = list[0].name;
        const existing = state.rosters.find(
          r => r.id === rosterId || r.chars.some(c => list.some(l => l.name === c.name))
        );

        const prevMap = {};
        if (existing) {
          existing.chars.forEach(c => { prevMap[c.name] = c.checks; });
        }

        const updatedChars = list.map(item => ({
          name: item.name,
          lvText: item.lvText,
          checks: prevMap[item.name] || [false, false, false]
        }));

        if (existing) {
          existing.id = rosterId;
          existing.label = rosterId;
          existing.chars = updatedChars;
          state.activeId = rosterId;
        } else {
          state.rosters.push({
            id: rosterId,
            label: rosterId,
            chars: updatedChars
          });
          state.activeId = rosterId;
        }

        render();
        saveState();
        input.value = "";
      }
    } catch (e) {
      alert("원정대 정보를 불러오는 중 오류가 발생했습니다.");
    } finally {
      btn.textContent = "검색";
      btn.disabled = false;
    }
  }

  function toggleHeart(charIdx, heartIdx) {
    const roster = getActiveRoster();
    if (!roster) return;
    roster.chars[charIdx].checks[heartIdx] = !roster.chars[charIdx].checks[heartIdx];
    render();
    saveState();
  }

  function manualReset() {
    const roster = getActiveRoster();
    if (!roster) return;
    if (!confirm(`[${roster.label}] 원정대의 하트를 초기화할까요?`)) return;
    roster.chars.forEach(c => { c.checks = [false, false, false]; });
    render();
    saveState();
  }

  function render() {
    const tabsEl = document.getElementById("rosterTabs");
    tabsEl.innerHTML = "";
    state.rosters.forEach(r => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "r-tab" + (r.id === state.activeId ? " active" : "");
      btn.onclick = () => selectRoster(r.id);

      const labelSpan = document.createElement("span");
      labelSpan.textContent = r.label;
      btn.appendChild(labelSpan);

      if (state.rosters.length > 1) {
        const delSpan = document.createElement("span");
        delSpan.className = "tab-del";
        delSpan.textContent = "×";
        delSpan.title = "목록 삭제";
        delSpan.onclick = (e) => removeRoster(e, r.id);
        btn.appendChild(delSpan);
      }

      tabsEl.appendChild(btn);
    });

    const listEl = document.getElementById("charList");
    listEl.innerHTML = "";

    const activeRoster = getActiveRoster();
    if (!activeRoster) return;

    let total = 0;
    let done = 0;
    let totalGold = 0;

    activeRoster.chars.forEach((ch, cIdx) => {
      const cDone = ch.checks.filter(Boolean).length;
      total += 3;
      done += cDone;
      totalGold += cDone * getGoldPerHeart(ch.lvText);

      const row = document.createElement("div");
      row.className = "c-row" + (cDone === 3 ? " all-done" : "");

      const infoDiv = document.createElement("div");
      infoDiv.className = "c-info";

      const nameSpan = document.createElement("span");
      nameSpan.className = "c-name";
      nameSpan.textContent = ch.name;
      infoDiv.appendChild(nameSpan);

      if (ch.lvText) {
        const lvSpan = document.createElement("span");
        lvSpan.className = "c-lv";
        lvSpan.textContent = ch.lvText;
        infoDiv.appendChild(lvSpan);
      }

      const heartsDiv = document.createElement("div");
      heartsDiv.className = "hearts";

      ch.checks.forEach((checked, hIdx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "heart-btn" + (checked ? " checked" : "");
        btn.onclick = () => toggleHeart(cIdx, hIdx);
        btn.innerHTML = `
          <svg class="heart-svg" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        `;
        heartsDiv.appendChild(btn);
      });

      row.appendChild(infoDiv);
      row.appendChild(heartsDiv);
      listEl.appendChild(row);
    });

    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById("progVal").textContent = `${pct}% (${done}/${total})`;
    document.getElementById("goldVal").textContent = `${totalGold.toLocaleString()} G`;
    document.getElementById("progFill").style.width = `${pct}%`;
  }

  render();
  loadState();
</script>
</body>
</html>
