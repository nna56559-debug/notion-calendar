<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px;
  }

  .board-box {
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid #F9E5E9;
    border-radius: 20px;
    padding: 11px 12px;
    box-shadow: 0 4px 14px rgba(244, 182, 198, 0.08);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .board-box.green {
    border-color: #E2EFE6;
    box-shadow: 0 4px 14px rgba(174, 217, 235, 0.08);
  }

  .b-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .b-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 8px;
    border-radius: 7px;
    background: #FCE6ED;
    color: #C95B7A;
  }
  .green .b-badge {
    background: #E2F2E8;
    color: #3D7A56;
  }
  .add-btn {
    border: none;
    width: 20px;
    height: 20px;
    border-radius: 7px;
    background: #FCE8EE;
    color: #C95B7A;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .green .add-btn {
    background: #E2F2E8;
    color: #3D7A56;
  }

  .card-list { display: flex; flex-direction: column; gap: 6px; }
  .m-card {
    position: relative;
    background: #FFFFFF;
    border-radius: 13px;
    padding: 8px 9px;
    border: 1px solid #F6E2E7;
  }
  .green .m-card { border-color: #E2EFE6; }

  .m-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
  .m-title {
    flex: 1;
    font-size: 11px;
    font-weight: 800;
    color: #4A4442;
    line-height: 1.3;
    word-break: break-all;
    outline: none;
    border-radius: 4px;
    padding: 1px 2px;
  }
  .m-title:focus { background: #FFF8FA; }
  .green .m-title:focus { background: #F4FBF6; }

  .del-btn {
    opacity: 0;
    border: none;
    background: transparent;
    color: #B8AFA9;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    padding: 0 2px;
  }
  .m-card:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: #D96B8A; }

  .m-note {
    margin-top: 3px;
    font-size: 9.5px;
    font-weight: 600;
    color: #8A817C;
    line-height: 1.35;
    outline: none;
    border-radius: 4px;
    padding: 1px 2px;
    min-height: 14px;
  }
  .m-note:empty::before { content: "메모 입력..."; color: #CBC4C0; font-weight: 500; }
  .m-note:focus { background: #F9F7F6; color: #5C5350; }
  .empty-txt { text-align: center; font-size: 10px; color: #B5AEAB; padding: 12px 0; }
</style>
</head>
<body>
  <div class="board-box pink">
    <div class="b-head">
      <span class="b-badge">쿠폰</span>
      <button type="button" class="add-btn" onclick="addCard('쿠폰')">+</button>
    </div>
    <div class="card-list" id="couponList"></div>
  </div>

  <div class="board-box green">
    <div class="b-head">
      <span class="b-badge">교환</span>
      <button type="button" class="add-btn" onclick="addCard('교환')">+</button>
    </div>
    <div class="card-list" id="exchangeList"></div>
  </div>

<script>
  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  let items = [];

  async function loadMemos() {
    try {
      const res = await fetch(`${API_BASE}/memo?t=${Date.now()}`);
      const data = await res.json();
      items = Array.isArray(data.items) ? data.items : [];
      render();
    } catch (e) {}
  }

  async function addCard(group) {
    const tempId = "temp_" + Date.now();
    const newItem = { pageId: tempId, title: "새 항목", group, note: "" };
    items.push(newItem);
    render();

    try {
      const res = await fetch(`${API_BASE}/memo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "create", title: newItem.title, group, note: "" })
      });
      const data = await res.json();
      if (data.pageId) {
        newItem.pageId = data.pageId;
      } else {
        await loadMemos();
      }
    } catch (e) {}
  }

  async function updateCard(item, newTitle, newNote) {
    const title = newTitle.trim() || "새 항목";
    const note = newNote.trim();
    if (item.title === title && item.note === note) return;
    item.title = title;
    item.note = note;

    if (String(item.pageId).startsWith("temp_")) return;
    try {
      await fetch(`${API_BASE}/memo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "update", pageId: item.pageId, title, note })
      });
    } catch (e) {}
  }

  async function deleteCard(pageId) {
    items = items.filter(it => it.pageId !== pageId);
    render();
    if (String(pageId).startsWith("temp_")) return;
    try {
      await fetch(`${API_BASE}/memo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete", pageId })
      });
    } catch (e) {}
  }

  function renderGroup(groupName, containerId) {
    const el = document.getElementById(containerId);
    el.innerHTML = "";
    const filtered = items.filter(it => it.group === groupName);

    if (filtered.length === 0) {
      el.innerHTML = `<div class="empty-txt">항목 없음</div>`;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = "m-card";

      const top = document.createElement("div");
      top.className = "m-top";

      const titleEl = document.createElement("div");
      titleEl.className = "m-title";
      titleEl.contentEditable = "true";
      titleEl.textContent = item.title;

      const noteEl = document.createElement("div");
      noteEl.className = "m-note";
      noteEl.contentEditable = "true";
      noteEl.textContent = item.note;

      const saveBlur = () => updateCard(item, titleEl.textContent, noteEl.textContent);
      titleEl.onblur = saveBlur;
      noteEl.onblur = saveBlur;
      titleEl.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); noteEl.focus(); } };

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del-btn";
      del.textContent = "×";
      del.onclick = () => deleteCard(item.pageId);

      top.appendChild(titleEl);
      top.appendChild(del);
      card.appendChild(top);
      card.appendChild(noteEl);
      el.appendChild(card);
    });
  }

  function render() {
    renderGroup("쿠폰", "couponList");
    renderGroup("교환", "exchangeList");
  }

  loadMemos();
</script>
</body>
</html>
