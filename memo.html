<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px;
  }

  :root {
    --page-bg: transparent;
    --card-bg: #FFFFFF;
    --pink-border: #F9E5E9;
    --pink-shadow: 0 4px 14px rgba(244, 182, 198, 0.08);
    --green-border: #E2EFE6;
    --green-shadow: 0 4px 14px rgba(174, 217, 235, 0.08);
    --pink-badge-bg: #FCE6ED;
    --pink-badge-fg: #C95B7A;
    --pink-add-bg: #FCE8EE;
    --pink-add-fg: #C95B7A;
    --green-badge-bg: #E2F2E8;
    --green-badge-fg: #3D7A56;
    --green-add-bg: #E2F2E8;
    --green-add-fg: #3D7A56;
    --item-bg: #FFFFFF;
    --pink-item-border: #F6E2E7;
    --green-item-border: #E2EFE6;
    --title-fg: #4A4442;
    --title-ph: #C5BCBA;
    --pink-focus-bg: #FFF8FA;
    --green-focus-bg: #F4FBF6;
    --act-fg: #B8AFA9;
    --act-hover-fg: #D96B8A;
    --note-fg: #8A817C;
    --note-ph: #CBC4C0;
    --note-focus-bg: #F9F7F6;
    --note-focus-fg: #5C5350;
    --empty-fg: #B5AEAB;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #191919;
      --card-bg: #1B1A20;
      --pink-border: #3F313A;
      --pink-shadow: 0 6px 18px rgba(0, 0, 0, 0.38);
      --green-border: #2D3D36;
      --green-shadow: 0 6px 18px rgba(0, 0, 0, 0.38);
      --pink-badge-bg: #3B252E;
      --pink-badge-fg: #F5A3BC;
      --pink-add-bg: #3B252E;
      --pink-add-fg: #F5A3BC;
      --green-badge-bg: #1E362B;
      --green-badge-fg: #8EE0B5;
      --green-add-bg: #1E362B;
      --green-add-fg: #8EE0B5;
      --item-bg: #24232B;
      --pink-item-border: #42323D;
      --green-item-border: #2E4239;
      --title-fg: #F4F2F8;
      --title-ph: #7C778C;
      --pink-focus-bg: #2D232B;
      --green-focus-bg: #212E28;
      --act-fg: #8E899E;
      --act-hover-fg: #F5A3BC;
      --note-fg: #B5B0C4;
      --note-ph: #736E82;
      --note-focus-bg: #2C2A35;
      --note-focus-fg: #EAE6F5;
      --empty-fg: #878296;
    }
  }

  :root[data-theme="dark"] {
    --page-bg: #191919;
    --card-bg: #1B1A20;
    --pink-border: #3F313A;
    --pink-shadow: 0 6px 18px rgba(0, 0, 0, 0.38);
    --green-border: #2D3D36;
    --green-shadow: 0 6px 18px rgba(0, 0, 0, 0.38);
    --pink-badge-bg: #3B252E;
    --pink-badge-fg: #F5A3BC;
    --pink-add-bg: #3B252E;
    --pink-add-fg: #F5A3BC;
    --green-badge-bg: #1E362B;
    --green-badge-fg: #8EE0B5;
    --green-add-bg: #1E362B;
    --green-add-fg: #8EE0B5;
    --item-bg: #24232B;
    --pink-item-border: #42323D;
    --green-item-border: #2E4239;
    --title-fg: #F4F2F8;
    --title-ph: #7C778C;
    --pink-focus-bg: #2D232B;
    --green-focus-bg: #212E28;
    --act-fg: #8E899E;
    --act-hover-fg: #F5A3BC;
    --note-fg: #B5B0C4;
    --note-ph: #736E82;
    --note-focus-bg: #2C2A35;
    --note-focus-fg: #EAE6F5;
    --empty-fg: #878296;
  }

  html, body { background: var(--page-bg); }

  .board-box {
    width: 100%;
    background: var(--card-bg);
    border: 1.5px solid var(--pink-border);
    border-radius: 20px;
    padding: 11px 12px;
    box-shadow: var(--pink-shadow);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .board-box.green {
    border-color: var(--green-border);
    box-shadow: var(--green-shadow);
  }

  .b-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .b-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 8px;
    border-radius: 7px;
    background: var(--pink-badge-bg);
    color: var(--pink-badge-fg);
  }
  .green .b-badge {
    background: var(--green-badge-bg);
    color: var(--green-badge-fg);
  }
  .add-btn {
    border: none;
    width: 20px;
    height: 20px;
    border-radius: 7px;
    background: var(--pink-add-bg);
    color: var(--pink-add-fg);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .green .add-btn {
    background: var(--green-add-bg);
    color: var(--green-add-fg);
  }

  .card-list { display: flex; flex-direction: column; gap: 6px; }
  .m-card {
    position: relative;
    background: var(--item-bg);
    border-radius: 13px;
    padding: 8px 9px;
    border: 1px solid var(--pink-item-border);
  }
  .green .m-card { border-color: var(--green-item-border); }

  .m-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
  .m-title {
    flex: 1;
    font-size: 11px;
    font-weight: 800;
    color: var(--title-fg);
    line-height: 1.3;
    word-break: break-all;
    outline: none;
    border-radius: 4px;
    padding: 1px 2px;
    min-height: 15px;
  }
  .m-title:empty::before { content: "제목 입력..."; color: var(--title-ph); font-weight: 600; }
  .m-title:focus { background: var(--pink-focus-bg); }
  .green .m-title:focus { background: var(--green-focus-bg); }

  .m-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .m-card:hover .m-actions { opacity: 1; }
  .act-btn {
    border: none;
    background: transparent;
    color: var(--act-fg);
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    padding: 0 2px;
  }
  .act-btn:hover { color: var(--act-hover-fg); }

  .m-note {
    margin-top: 3px;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--note-fg);
    line-height: 1.35;
    outline: none;
    border-radius: 4px;
    padding: 1px 2px;
    min-height: 14px;
  }
  .m-note:empty::before { content: "메모 입력..."; color: var(--note-ph); font-weight: 500; }
  .m-note:focus { background: var(--note-focus-bg); color: var(--note-focus-fg); }
  .empty-txt { text-align: center; font-size: 10px; color: var(--empty-fg); padding: 12px 0; }

  @media (max-width: 480px) {
    body { gap: 7px; padding: 2px; }
    .board-box { border-radius: 16px; padding: 9px 10px; gap: 6px; }
    .card-list { gap: 5px; }
    .m-card { border-radius: 11px; padding: 7px 8px; }
    .m-title { font-size: 10.5px; }
    .m-note { font-size: 9px; }
    .m-actions { opacity: 0.78; }
    .empty-txt { padding: 8px 0; font-size: 9.5px; }
  }
</style>
</head>
<body>
  <div class="board-box pink">
    <div class="b-head">
      <span class="b-badge">쿠폰</span>
      <button type="button" class="add-btn" onclick="addCard('쿠폰')">+</button>
    </div>
    <div class="card-list" id="couponList"></div>
  </div>

  <div class="board-box green">
    <div class="b-head">
      <span class="b-badge">교환</span>
      <button type="button" class="add-btn" onclick="addCard('교환')">+</button>
    </div>
    <div class="card-list" id="exchangeList"></div>
  </div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();

  const API_BASE = "https://notion-cal.binhaha329.workers.dev";
  const STORAGE_KEY = "notion_coupon_exchange_memos_v2";
  const DELETED_KEY = "notion_coupon_exchange_deleted_v2";
  const GROUP_MAP_KEY = "notion_coupon_exchange_groups_v1";

  let items = [];
  let deletedIds = new Set();
  let groupOverrides = {};

  function loadMeta() {
    try {
      const arr = JSON.parse(localStorage.getItem(DELETED_KEY) || "[]");
      if (Array.isArray(arr)) deletedIds = new Set(arr.map(String));
    } catch (e) {}
    try {
      const gm = JSON.parse(localStorage.getItem(GROUP_MAP_KEY) || "{}");
      if (gm && typeof gm === "object") groupOverrides = gm;
    } catch (e) {}
  }

  function saveMeta() {
    try {
      localStorage.setItem(DELETED_KEY, JSON.stringify([...deletedIds].slice(-200)));
      localStorage.setItem(GROUP_MAP_KEY, JSON.stringify(groupOverrides));
    } catch (e) {}
  }

  function resolveGroup(rawGroup, pageId, title) {
    const s = String(rawGroup || "").trim();
    if (s.includes("교환")) return "교환";
    if (s.includes("쿠폰")) return "쿠폰";
    if (pageId && groupOverrides[pageId]) return groupOverrides[pageId];
    if (title && groupOverrides[`title:${title.trim()}`]) return groupOverrides[`title:${title.trim()}`];
    return "쿠폰";
  }

  function rememberGroup(item) {
    if (!item) return;
    if (item.pageId) groupOverrides[item.pageId] = item.group;
    if (item.title && item.title.trim()) {
      groupOverrides[`title:${item.title.trim()}`] = item.group;
    }
    saveMeta();
  }

  function sanitizeItem(raw) {
    if (!raw || typeof raw !== "object") return null;
    const pageId = String(raw.pageId || raw.id || "").trim();
    if (!pageId || deletedIds.has(pageId)) return null;
    const title = String(raw.title ?? "");
    const rawGroup = raw.group ?? raw.category ?? raw.type ?? raw.Group ?? "";
    const group = resolveGroup(rawGroup, pageId, title);
    return {
      pageId,
      title,
      group,
      note: String(raw.note ?? ""),
      updatedAt: Number(raw.updatedAt || Date.now()),
      _creating: null
    };
  }

  function saveLocalItems() {
    try {
      const clean = items.map(it => ({
        pageId: it.pageId,
        title: it.title,
        group: it.group,
        note: it.note,
        updatedAt: it.updatedAt || Date.now()
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clean));
    } catch (e) {}
  }

  function loadLocalItems() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (Array.isArray(parsed)) return parsed.map(sanitizeItem).filter(Boolean);
    } catch (e) {}
    return [];
  }

  async function loadMemos() {
    loadMeta();
    const localList = loadLocalItems();
    if (localList.length > 0) {
      items = localList;
      render();
    }

    try {
      const res = await fetch(`${API_BASE}/memo?t=${Date.now()}`);
      const data = await res.json();
      if (!data || !Array.isArray(data.items)) {
        if (items.length === 0) render();
        return;
      }

      const serverItems = data.items.map(sanitizeItem).filter(Boolean);
      const serverMap = new Map(serverItems.map(it => [it.pageId, it]));
      const merged = [...serverItems];

      for (const loc of items) {
        if (deletedIds.has(loc.pageId)) continue;
        if (!serverMap.has(loc.pageId)) {
          merged.push({ ...loc, _creating: loc._creating || null });
        } else {
          const srv = serverMap.get(loc.pageId);
          if (groupOverrides[loc.pageId]) srv.group = groupOverrides[loc.pageId];
          if ((loc.updatedAt || 0) > (srv.updatedAt || 0)) {
            srv.title = loc.title;
            srv.note = loc.note;
            srv.group = loc.group;
            srv.updatedAt = loc.updatedAt;
          }
        }
      }

      items = merged;
      items.forEach(rememberGroup);
      saveLocalItems();
      render();
    } catch (e) {
      if (items.length === 0) render();
    }
  }

  function addCard(group) {
    const normGroup = group === "교환" ? "교환" : "쿠폰";
    const tempId = "temp_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    const newItem = {
      pageId: tempId,
      title: "",
      group: normGroup,
      note: "",
      updatedAt: Date.now(),
      _creating: null
    };
    items.push(newItem);
    rememberGroup(newItem);
    saveLocalItems();
    render(tempId);

    newItem._creating = fetch(`${API_BASE}/memo`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "create",
        title: newItem.title || "새 메모",
        group: normGroup,
        note: newItem.note
      })
    })
      .then(res => res.json())
      .then(data => {
        if (data && data.pageId) {
          const realId = String(data.pageId);
          if (deletedIds.has(tempId)) {
            deletedIds.add(realId);
            saveMeta();
            return fetch(`${API_BASE}/memo`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "delete", pageId: realId })
            }).catch(() => {});
          }
          newItem.pageId = realId;
          rememberGroup(newItem);
          saveLocalItems();
          return syncCard(newItem);
        }
      })
      .catch(() => {})
      .finally(() => {
        newItem._creating = null;
      });
  }

  async function syncCard(item) {
    if (!item) return;
    item.updatedAt = Date.now();
    rememberGroup(item);
    saveLocalItems();

    if (item._creating) await item._creating;
    if (!item.pageId || String(item.pageId).startsWith("temp_") || deletedIds.has(item.pageId)) return;

    try {
      await fetch(`${API_BASE}/memo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "update",
          pageId: item.pageId,
          title: item.title.trim() || "새 메모",
          note: item.note.trim(),
          group: item.group
        })
      });
    } catch (e) {}
  }

  function moveCardGroup(item) {
    item.group = item.group === "교환" ? "쿠폰" : "교환";
    rememberGroup(item);
    saveLocalItems();
    render();
    syncCard(item);
  }

  async function deleteCard(item) {
    if (!item) return;
    if (item.pageId) {
      deletedIds.add(String(item.pageId));
      saveMeta();
    }
    items = items.filter(it => it !== item);
    saveLocalItems();
    render();

    if (item._creating) await item._creating;
    if (item.pageId && !String(item.pageId).startsWith("temp_")) {
      deletedIds.add(String(item.pageId));
      saveMeta();
      try {
        await fetch(`${API_BASE}/memo`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "delete", pageId: item.pageId })
        });
      } catch (e) {}
    }
  }

  function renderGroup(groupName, containerId, focusPageId) {
    const el = document.getElementById(containerId);
    el.innerHTML = "";
    const filtered = items.filter(it => it.group === groupName);

    if (filtered.length === 0) {
      el.innerHTML = `<div class="empty-txt">항목 없음</div>`;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = "m-card";

      const top = document.createElement("div");
      top.className = "m-top";

      const titleEl = document.createElement("div");
      titleEl.className = "m-title";
      titleEl.contentEditable = "true";
      titleEl.textContent = item.title;

      const noteEl = document.createElement("div");
      noteEl.className = "m-note";
      noteEl.contentEditable = "true";
      noteEl.textContent = item.note;

      let debounceTimer = null;
      const onChange = () => {
        item.title = titleEl.textContent;
        item.note = noteEl.textContent;
        item.updatedAt = Date.now();
        rememberGroup(item);
        saveLocalItems();
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => syncCard(item), 500);
      };
      const onBlur = () => {
        item.title = titleEl.textContent;
        item.note = noteEl.textContent;
        item.updatedAt = Date.now();
        rememberGroup(item);
        saveLocalItems();
        clearTimeout(debounceTimer);
        syncCard(item);
      };

      titleEl.oninput = onChange;
      noteEl.oninput = onChange;
      titleEl.onblur = onBlur;
      noteEl.onblur = onBlur;
      titleEl.onkeydown = (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          noteEl.focus();
        }
      };

      const actions = document.createElement("div");
      actions.className = "m-actions";

      const moveBtn = document.createElement("button");
      moveBtn.type = "button";
      moveBtn.className = "act-btn";
      moveBtn.title = item.group === "교환" ? "쿠폰으로 이동" : "교환으로 이동";
      moveBtn.textContent = "⇄";
      moveBtn.onclick = () => moveCardGroup(item);

      const del = document.createElement("button");
      del.type = "button";
      del.className = "act-btn";
      del.textContent = "×";
      del.onclick = () => deleteCard(item);

      actions.appendChild(moveBtn);
      actions.appendChild(del);

      top.appendChild(titleEl);
      top.appendChild(actions);
      card.appendChild(top);
      card.appendChild(noteEl);
      el.appendChild(card);

      if (focusPageId && item.pageId === focusPageId) {
        setTimeout(() => titleEl.focus(), 10);
      }
    });
  }

  function render(focusPageId) {
    renderGroup("쿠폰", "couponList", focusPageId);
    renderGroup("교환", "exchangeList", focusPageId);
  }

  loadMemos();
</script>
</body>
</html>
