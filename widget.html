<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; width: 100%; overflow-x: hidden; }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 6px; }
  .wrap { width: 100%; max-width: 680px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: flex-start; }

  /* 기존 크림 웜 파스텔 + 핑크 테두리 카드 */
  .card {
    background: #FFF9FA;
    border: 1.5px solid #FADADD;
    border-radius: 24px;
    padding: 20px 18px 16px;
    box-shadow: 0 4px 16px rgba(244, 162, 184, 0.1);
  }
  .cal-card { flex: 1 1 280px; max-width: 315px; }
  .detail-card { flex: 1 1 280px; max-width: 315px; min-height: 310px; display: flex; flex-direction: column; }

  /* 상단 월 타이틀 (가운데 정렬) */
  .cal-header { text-align: center; margin-bottom: 14px; }
  .month-title { font-size: 18px; font-weight: 800; color: #7CC0E4; letter-spacing: -0.3px; }

  /* 요일 및 날짜 그리드 */
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 8px; }
  .weekdays span { font-size: 10.5px; font-weight: 700; color: #8AC4E2; }
  .weekdays span:last-child { color: #E58C9E; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px 3px; text-align: center; place-items: center; }
  .day {
    position: relative; width: 32px; height: 32px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 600; color: #5C5552; border-radius: 10px; cursor: pointer; transition: all 0.15s ease;
  }
  .day:hover { background: #FFF0F3; }
  .day.muted { color: #C9C2BE; font-weight: 500; }
  .day.sun { color: #D96B7E; }

  /* 일정 있는 날 (핑크) */
  .day.has-event { background: #F497B6; color: #FFFFFF !important; font-weight: 700; }

  /* ★ 당일 날짜 (하늘색 배경 + 흰 글씨) ★ */
  .day.today {
    background: #7CC0E4 !important;
    color: #FFFFFF !important;
    font-weight: 800;
  }

  /* 선택된 날짜 (핑크 이중 테두리) */
  .day.selected {
    outline: 2px solid #F497B6;
    outline-offset: 2px;
  }
  .day.selected:not(.has-event):not(.today) {
    background: #FFF0F3;
    color: #D96B8A;
    font-weight: 800;
  }

  .dot { position: absolute; bottom: 3px; width: 3.5px; height: 3.5px; border-radius: 50%; background: #7CC0E4; }
  .day.has-event .dot { background: #BCE6FF; }
  .day.today .dot { background: #FFFFFF; }

  /* 달력 하단 푸터 (기존 RAID CALENDAR 위치에 별빛 라벨) */
  .cal-footer {
    display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    margin-top: 16px; padding: 10px 4px 0; border-top: 1px solid #F7E1E5;
  }
  .deco-label { font-size: 10px; color: #C9A3B0; letter-spacing: 1px; font-weight: 600; }
  .nav-btns { display: flex; align-items: center; gap: 6px; }
  .nav-btn {
    border: none; background: transparent; color: #8AC4E2; font-size: 12px; font-weight: 700;
    width: 20px; height: 20px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: #FFF0F3; color: #D96B8A; }

  /* 우측 상세 카드 헤더 */
  .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 2px; gap: 6px; }
  .detail-date { font-size: 13px; font-weight: 800; color: #7CC0E4; }
  .header-badges { display: flex; align-items: center; gap: 5px; }
  .reset-pill {
    font-size: 9.5px; font-weight: 700; color: #B88A98;
    background: #FFF0F3; border: 1px solid #FADADD;
    padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .count-badge { font-size: 10px; font-weight: 700; color: #E07A8E; background: #FFF0F3; padding: 2px 8px; border-radius: 999px; border: 1px solid #FADADD; white-space: nowrap; }

  .event-list { display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .empty-msg { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #B8AFA9; text-align: center; padding: 20px 0; }

  /* 일정 아이템 카드 (기존 파스텔 연보라 / 연하늘 테마) */
  .ev-item {
    background: #F0ECF9;
    border-radius: 15px;
    padding: 11px 12px;
    transition: opacity 0.25s ease;
  }
  .ev-item.alt { background: #E9F4FA; }
  .ev-item.warm { background: #FCF5E8; }
  .ev-item.pink { background: #FCEEF3; }
  /* 🚀출발 체크 시 취소선 없이 카드만 흐릿하게 */
  .ev-item.cleared { opacity: 0.42; }

  .ev-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 7px; }
  .ev-title-area { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; cursor: pointer; }
  .ev-title { font-size: 12px; font-weight: 700; color: #4A4442; line-height: 1.35; word-break: keep-all; }

  /* 기존 동그란 화살표 아코디언 버튼 */
  .acc-btn {
    width: 16px; height: 16px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.9); color: #8A817C;
    font-size: 9px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: transform 0.2s ease;
  }
  .ev-item.open .acc-btn { transform: rotate(180deg); }

  .ev-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .ev-time { font-size: 10px; font-weight: 700; color: #8A817C; background: rgba(255,255,255,0.9); padding: 2px 7px; border-radius: 999px; }

  /* 🚀출발 원클릭 체크박스 */
  .clear-check {
    width: 17px; height: 17px; border-radius: 5px;
    border: 1.5px solid #E5A4B8; background: rgba(255,255,255,0.92);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s ease; flex-shrink: 0;
  }
  .clear-check:hover { border-color: #D96B8A; }
  .clear-check.checked { background: #F497B6; border-color: #F497B6; }
  .clear-check svg { width: 10px; height: 10px; stroke: #FFFFFF; stroke-width: 2.8; fill: none; opacity: 0; }
  .clear-check.checked svg { opacity: 1; }

  .ev-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .tag-diff { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 7px; background: #E3D7F7; color: #6E5499; }
  .tag-diff.hard { background: #FADADD; color: #C25975; }

  /* 숙련도 드롭다운 (기존 베이지 / 하늘색 톤) */
  .prof-select {
    font-family: inherit; font-size: 10px; font-weight: 700; color: #7C6854;
    background: #F4E4D0; border: none; border-radius: 7px; padding: 2px 7px; cursor: pointer; outline: none;
  }
  .ev-item.alt .prof-select { background: #D8ECF8; color: #537891; }

  /* 클릭 시 펼쳐지는 참여자 & 메모 아코디언 */
  .ev-drawer {
    display: none;
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px dashed rgba(160, 145, 155, 0.25);
  }
  .ev-item.open .ev-drawer { display: block; }

  .drawer-sec { margin-bottom: 6px; }
  .drawer-sec:last-child { margin-bottom: 0; }
  .drawer-label { font-size: 10px; font-weight: 800; color: #9B8B93; margin-bottom: 3px; }
  .member-list { display: flex; flex-direction: column; gap: 3px; }
  .member-row {
    background: rgba(255, 255, 255, 0.78);
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 10.5px;
    line-height: 1.4;
    color: #554E4C;
    word-break: keep-all;
  }
  .memo-box {
    background: rgba(255, 255, 255, 0.78);
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 10.5px;
    line-height: 1.45;
    color: #6B625F;
    white-space: pre-wrap;
    word-break: keep-all;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card cal-card">
    <div class="cal-header">
      <div class="month-title" id="monthTitle">November</div>
    </div>
    <div class="weekdays">
      <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
    </div>
    <div class="days" id="daysGrid"></div>
    <div class="cal-footer">
      <span class="deco-label">. ₊ ⊹ . ₊˖ . ₊</span>
      <div class="nav-btns">
        <button class="nav-btn" id="prevBtn" title="이전 달">←</button>
        <button class="nav-btn" id="refreshBtn" title="새로고침">↻</button>
        <button class="nav-btn" id="nextBtn" title="다음 달">→</button>
      </div>
    </div>
  </div>

  <div class="card detail-card">
    <div class="detail-header">
      <div class="detail-date" id="detailDate">-</div>
      <div class="header-badges">
        <span class="reset-pill" id="resetTimer" title="매주 수요일 오전 06:00 주간 초기화">초기화 D-1</span>
        <span class="count-badge" id="countBadge">0건</span>
      </div>
    </div>
    <div class="event-list" id="eventList">
      <div class="empty-msg">일정을 불러오는 중...</div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://notion-cal.binhaha329.workers.dev";
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const PROF_OPTIONS = ["숙제", "반숙", "트라이", "클경", "학원", "숙련도 미지정"];

  let allEvents = [];
  let current = new Date();
  const todayStr = formatDate(new Date());
  let selectedDate = todayStr;

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function updateResetTimer() {
    const now = new Date();
    const kstNow = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
    const target = new Date(kstNow);
    const day = kstNow.getDay();
    let diffDays = (3 - day + 7) % 7;
    if (diffDays === 0 && kstNow.getHours() >= 6) diffDays = 7;
    target.setDate(kstNow.getDate() + diffDays);
    target.setHours(6, 0, 0, 0);

    const diffMs = target - kstNow;
    const totalMins = Math.floor(diffMs / 60000);
    const d = Math.floor(totalMins / 1440);
    const h = String(Math.floor((totalMins % 1440) / 60)).padStart(2, "0");
    const m = String(totalMins % 60).padStart(2, "0");

    const el = document.getElementById("resetTimer");
    el.textContent = d > 0 ? `초기화 D-${d} ${h}:${m}` : `초기화 ${h}:${m}`;
  }
  updateResetTimer();
  setInterval(updateResetTimer, 30000);

  async function loadEvents() {
    try {
      const res = await fetch(API_URL);
      allEvents = await res.json();
    } catch (e) {
      allEvents = [];
    }
    renderCalendar();
    renderDetails();
  }

  function renderCalendar() {
    const year = current.getFullYear();
    const month = current.getMonth();
    document.getElementById("monthTitle").textContent = MONTHS[month];

    const grid = document.getElementById("daysGrid");
    grid.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const startOffset = (firstDay + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    const eventDates = new Set(allEvents.map(e => e.date));

    for (let i = startOffset - 1; i >= 0; i--) {
      const cell = document.createElement("div");
      cell.className = "day muted";
      cell.textContent = prevMonthDays - i;
      grid.appendChild(cell);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dow = new Date(year, month, d).getDay();
      const cell = document.createElement("div");
      cell.className = "day";
      if (dow === 0) cell.classList.add("sun");
      if (eventDates.has(dateStr)) {
        cell.classList.add("has-event");
        const dot = document.createElement("span");
        dot.className = "dot";
        cell.appendChild(dot);
      }
      if (dateStr === todayStr) cell.classList.add("today");
      if (dateStr === selectedDate) cell.classList.add("selected");

      const num = document.createElement("span");
      num.textContent = d;
      cell.prepend(num);

      cell.onclick = () => {
        selectedDate = dateStr;
        renderCalendar();
        renderDetails();
      };
      grid.appendChild(cell);
    }
  }

  function isClearedStatus(status) {
    return status === "🚀출발" || status === "출발" || status === "출발 완료" || status === "완료" || status === "클리어";
  }

  function parseMembers(raw) {
    const text = (raw || "").trim();
    if (!text) return [];
    if (text.includes("\n")) {
      return text.split("\n").map(s => s.trim()).filter(Boolean);
    }
    const splitByPerson = text.replace(/(\d+(?:\.\d+)?)\s+(?=[가-힣a-zA-Z0-9]{2,}\s*(?:\(지인\))?\s*[가-힣]+\s*\|)/g, "$1\n");
    return splitByPerson.split("\n").map(s => s.trim()).filter(Boolean);
  }

  function renderDetails() {
    document.getElementById("detailDate").textContent = selectedDate;
    const listEl = document.getElementById("eventList");
    const dayEvents = allEvents.filter(e => e.date === selectedDate);
    document.getElementById("countBadge").textContent = `${dayEvents.length}건`;

    if (dayEvents.length === 0) {
      listEl.innerHTML = `<div class="empty-msg">선택한 날짜에 일정이 없어요</div>`;
      return;
    }

    listEl.innerHTML = "";
    const themes = ["", "alt", "warm", "pink"];

    dayEvents.forEach((ev, idx) => {
      const cleared = isClearedStatus(ev.status);
      const card = document.createElement("div");
      card.className = `ev-item ${themes[idx % themes.length]}${cleared ? " cleared" : ""}`;

      const top = document.createElement("div");
      top.className = "ev-top";

      const titleArea = document.createElement("div");
      titleArea.className = "ev-title-area";

      const title = document.createElement("span");
      title.className = "ev-title";
      title.textContent = ev.title;

      const accBtn = document.createElement("button");
      accBtn.type = "button";
      accBtn.className = "acc-btn";
      accBtn.textContent = "▾";
      accBtn.title = "참여자 및 메모 펼치기";

      titleArea.appendChild(title);
      titleArea.appendChild(accBtn);
      titleArea.onclick = () => card.classList.toggle("open");

      const rightBox = document.createElement("div");
      rightBox.className = "ev-right";

      if (ev.time) {
        const time = document.createElement("span");
        time.className = "ev-time";
        time.textContent = ev.time;
        rightBox.appendChild(time);
      }

      const checkBtn = document.createElement("button");
      checkBtn.type = "button";
      checkBtn.className = `clear-check${cleared ? " checked" : ""}`;
      checkBtn.title = cleared ? "🚀출발 완료 (클릭 시 해제)" : "🚀출발 체크";
      checkBtn.innerHTML = `<svg viewBox="0 0 16 16"><polyline points="3.5 8.5 6.8 11.8 12.8 4.5"></polyline></svg>`;
      checkBtn.onclick = async (e) => {
        e.stopPropagation();
        const nextCleared = !isClearedStatus(ev.status);
        ev.status = nextCleared ? "🚀출발" : "출발 전";
        card.classList.toggle("cleared", nextCleared);
        checkBtn.classList.toggle("checked", nextCleared);

        try {
          await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pageId: ev.pageId, cleared: nextCleared })
          });
        } catch (err) {}
      };
      rightBox.appendChild(checkBtn);

      top.appendChild(titleArea);
      top.appendChild(rightBox);
      card.appendChild(top);

      const tags = document.createElement("div");
      tags.className = "ev-tags";

      if (ev.difficulty) {
        const diff = document.createElement("span");
        diff.className = `tag-diff${ev.difficulty.includes("하드") || ev.difficulty.includes("나이트") ? " hard" : ""}`;
        diff.textContent = ev.difficulty;
        tags.appendChild(diff);
      }

      const sel = document.createElement("select");
      sel.className = "prof-select";
      const opts = PROF_OPTIONS.includes(ev.proficiency) ? PROF_OPTIONS : [ev.proficiency, ...PROF_OPTIONS];
      opts.forEach(opt => {
        const o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        if (opt === ev.proficiency) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = async () => {
        ev.proficiency = sel.value;
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pageId: ev.pageId, proficiency: sel.value })
        });
      };
      tags.appendChild(sel);
      card.appendChild(tags);

      // 클릭 시 펼쳐지는 참여자 목록 & 메모 서랍
      const drawer = document.createElement("div");
      drawer.className = "ev-drawer";

      const memSec = document.createElement("div");
      memSec.className = "drawer-sec";
      const memLabel = document.createElement("div");
      memLabel.className = "drawer-label";
      memLabel.textContent = "참여자 목록";
      memSec.appendChild(memLabel);

      const memberRows = parseMembers(ev.members);
      const listWrap = document.createElement("div");
      listWrap.className = "member-list";

      if (memberRows.length === 0) {
        const emptyRow = document.createElement("div");
        emptyRow.className = "member-row";
        emptyRow.textContent = "신청없음";
        listWrap.appendChild(emptyRow);
      } else {
        memberRows.forEach(line => {
          const row = document.createElement("div");
          row.className = "member-row";
          row.textContent = line;
          listWrap.appendChild(row);
        });
      }
      memSec.appendChild(listWrap);
      drawer.appendChild(memSec);

      if ((ev.memo || "").trim()) {
        const memoSec = document.createElement("div");
        memoSec.className = "drawer-sec";
        const memoLabel = document.createElement("div");
        memoLabel.className = "drawer-label";
        memoLabel.textContent = "메모";
        const memoBox = document.createElement("div");
        memoBox.className = "memo-box";
        memoBox.textContent = ev.memo.trim();
        memoSec.appendChild(memoLabel);
        memoSec.appendChild(memoBox);
        drawer.appendChild(memoSec);
      }

      card.appendChild(drawer);
      listEl.appendChild(card);
    });
  }

  document.getElementById("prevBtn").onclick = () => { current.setMonth(current.getMonth() - 1); renderCalendar(); };
  document.getElementById("nextBtn").onclick = () => { current.setMonth(current.getMonth() + 1); renderCalendar(); };
  document.getElementById("refreshBtn").onclick = () => loadEvents();

  loadEvents();
</script>
</body>
</html>
