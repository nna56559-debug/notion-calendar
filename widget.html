<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; width: 100%; overflow-x: hidden; }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 6px; }
  .wrap { width: 100%; max-width: 680px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: flex-start; }

  .card {
    background: #FFFDFB;
    border: 1.5px solid #FADADD;
    border-radius: 22px;
    padding: 18px 16px 14px;
    box-shadow: 0 6px 20px rgba(244, 162, 184, 0.14);
  }
  .cal-card { flex: 1 1 285px; max-width: 330px; }
  .detail-card { flex: 1 1 285px; max-width: 330px; min-height: 295px; display: flex; flex-direction: column; }

  /* 상단 헤더 & 주간 초기화 카운트다운 뱃지 */
  .cal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px; gap: 6px; }
  .month-title { font-size: 18px; font-weight: 800; color: #7CC0E4; letter-spacing: -0.3px; }
  .reset-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 700; color: #D96B8A;
    background: #FFF0F3; border: 1px solid #FADADD;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .reset-dot { width: 5px; height: 5px; border-radius: 50%; background: #F497B6; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* 요일 및 날짜 그리드 */
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 6px; }
  .weekdays span { font-size: 10.5px; font-weight: 700; color: #8AC4E2; }
  .weekdays span:last-child { color: #E58C9E; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px 2px; text-align: center; }
  .day {
    position: relative; height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #5C5552; border-radius: 11px; cursor: pointer; transition: all 0.15s ease;
  }
  .day:hover { background: #FFF2F4; }
  .day.muted { color: #C9C2BE; font-weight: 500; }
  .day.sun { color: #E07A8E; }
  .day.has-event { background: #F497B6; color: #FFFFFF !important; font-weight: 700; box-shadow: 0 3px 8px rgba(244, 151, 182, 0.35); }
  .day.selected { outline: 2px solid #F497B6; outline-offset: 1px; background: #FFF0F3; color: #D96B8A; font-weight: 800; }
  .day.has-event.selected { background: #E87A9F; color: #FFFFFF !important; }
  .dot { position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: #7CC0E4; }
  .day.has-event .dot { background: #BCE6FF; }

  /* 하단 별빛 라벨 & 네비게이션 */
  .cal-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 8px 6px 0; border-top: 1px dashed #FCE4E8; }
  .deco-label { font-size: 11px; color: #D89BAE; letter-spacing: 1px; font-weight: 600; }
  .nav-btns { display: flex; align-items: center; gap: 6px; }
  .nav-btn {
    border: none; background: #FFF2F4; color: #8AC4E2; font-size: 12px; font-weight: 700;
    width: 24px; height: 24px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: #FADADD; color: #D96B8A; }

  /* 우측 일정 상세 카드 */
  .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .detail-date { font-size: 13px; font-weight: 800; color: #7CC0E4; }
  .count-badge { font-size: 10.5px; font-weight: 700; color: #E07A8E; background: #FFF0F3; padding: 2px 8px; border-radius: 999px; border: 1px solid #FADADD; }
  .event-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .empty-msg { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #B8AFA9; text-align: center; padding: 20px 0; }

  .ev-item {
    background: #F4F1FA;
    border-radius: 14px;
    padding: 10px 12px;
    transition: opacity 0.25s ease, transform 0.15s ease;
  }
  .ev-item.alt { background: #EFF7FB; }
  .ev-item.warm { background: #FCF6E8; }
  .ev-item.pink { background: #FDF0F4; }
  /* 🚀출발 시 취소선 없이 카드 전체 부드러운 흐림 처리 */
  .ev-item.cleared { opacity: 0.42; }

  .ev-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .ev-title { font-size: 12.5px; font-weight: 700; color: #4A4442; line-height: 1.35; flex: 1; word-break: keep-all; }
  .ev-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .ev-time { font-size: 10.5px; font-weight: 700; color: #8A817C; background: rgba(255,255,255,0.85); padding: 2px 7px; border-radius: 999px; }

  /* 원클릭 클리어 체크박스 */
  .clear-check {
    width: 19px; height: 19px; border-radius: 6px;
    border: 1.5px solid #E5A4B8; background: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s ease; flex-shrink: 0;
  }
  .clear-check:hover { border-color: #D96B8A; transform: scale(1.06); }
  .clear-check.checked { background: #F497B6; border-color: #F497B6; }
  .clear-check svg { width: 12px; height: 12px; stroke: #FFFFFF; stroke-width: 2.8; fill: none; opacity: 0; transition: opacity 0.15s; }
  .clear-check.checked svg { opacity: 1; }

  .ev-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .tag-diff { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #E5D9F8; color: #6E5499; }
  .tag-diff.hard { background: #FADADD; color: #C25975; }
  .prof-select {
    font-family: inherit; font-size: 10px; font-weight: 700; color: #7C6854;
    background: #F5E6D3; border: none; border-radius: 6px; padding: 2px 6px; cursor: pointer; outline: none;
  }
  .ev-members { font-size: 10.5px; color: #8E8580; margin-top: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card cal-card">
    <div class="cal-top">
      <div class="month-title" id="monthTitle">November</div>
      <div class="reset-badge" title="매주 수요일 오전 06:00 주간 초기화">
        <span class="reset-dot"></span>
        <span id="resetTimer">초기화 계산중</span>
      </div>
    </div>
    <div class="weekdays">
      <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
    </div>
    <div class="days" id="daysGrid"></div>
    <div class="cal-footer">
      <span class="deco-label">. ₊ ⊹ . ₊˖ . ₊</span>
      <div class="nav-btns">
        <button class="nav-btn" id="prevBtn" title="이전 달">←</button>
        <button class="nav-btn" id="refreshBtn" title="새로고침">↻</button>
        <button class="nav-btn" id="nextBtn" title="다음 달">→</button>
      </div>
    </div>
  </div>

  <div class="card detail-card">
    <div class="detail-header">
      <div class="detail-date" id="detailDate">-</div>
      <div class="count-badge" id="countBadge">0건</div>
    </div>
    <div class="event-list" id="eventList">
      <div class="empty-msg">일정을 불러오는 중...</div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://notion-cal.binhaha329.workers.dev";
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const PROF_OPTIONS = ["숙제", "반숙", "트라이", "클경", "학원", "숙련도 미지정"];

  let allEvents = [];
  let current = new Date();
  let selectedDate = formatDate(current);

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function updateResetTimer() {
    const now = new Date();
    const kstNow = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
    const target = new Date(kstNow);
    const day = kstNow.getDay();
    let diffDays = (3 - day + 7) % 7;
    if (diffDays === 0 && kstNow.getHours() >= 6) diffDays = 7;
    target.setDate(kstNow.getDate() + diffDays);
    target.setHours(6, 0, 0, 0);

    const diffMs = target - kstNow;
    const totalMins = Math.floor(diffMs / 60000);
    const d = Math.floor(totalMins / 1440);
    const h = String(Math.floor((totalMins % 1440) / 60)).padStart(2, "0");
    const m = String(totalMins % 60).padStart(2, "0");

    const el = document.getElementById("resetTimer");
    el.textContent = d > 0 ? `초기화 D-${d} ${h}:${m}` : `초기화 ${h}:${m}`;
  }
  updateResetTimer();
  setInterval(updateResetTimer, 30000);

  async function loadEvents() {
    try {
      const res = await fetch(API_URL);
      allEvents = await res.json();
    } catch (e) {
      allEvents = [];
    }
    renderCalendar();
    renderDetails();
  }

  function renderCalendar() {
    const year = current.getFullYear();
    const month = current.getMonth();
    document.getElementById("monthTitle").textContent = MONTHS[month];

    const grid = document.getElementById("daysGrid");
    grid.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const startOffset = (firstDay + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    const eventDates = new Set(allEvents.map(e => e.date));

    for (let i = startOffset - 1; i >= 0; i--) {
      const cell = document.createElement("div");
      cell.className = "day muted";
      cell.textContent = prevMonthDays - i;
      grid.appendChild(cell);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dow = new Date(year, month, d).getDay();
      const cell = document.createElement("div");
      cell.className = "day";
      if (dow === 0) cell.classList.add("sun");
      if (eventDates.has(dateStr)) {
        cell.classList.add("has-event");
        const dot = document.createElement("span");
        dot.className = "dot";
        cell.appendChild(dot);
      }
      if (dateStr === selectedDate) cell.classList.add("selected");

      const num = document.createElement("span");
      num.textContent = d;
      cell.prepend(num);

      cell.onclick = () => {
        selectedDate = dateStr;
        renderCalendar();
        renderDetails();
      };
      grid.appendChild(cell);
    }
  }

  function isClearedStatus(status) {
    return status === "🚀출발" || status === "출발" || status === "출발 완료" || status === "완료" || status === "클리어";
  }

  function renderDetails() {
    document.getElementById("detailDate").textContent = selectedDate;
    const listEl = document.getElementById("eventList");
    const dayEvents = allEvents.filter(e => e.date === selectedDate);
    document.getElementById("countBadge").textContent = `${dayEvents.length}건`;

    if (dayEvents.length === 0) {
      listEl.innerHTML = `<div class="empty-msg">선택한 날짜에 일정이 없어요</div>`;
      return;
    }

    listEl.innerHTML = "";
    const themes = ["", "alt", "warm", "pink"];

    dayEvents.forEach((ev, idx) => {
      const cleared = isClearedStatus(ev.status);
      const card = document.createElement("div");
      card.className = `ev-item ${themes[idx % themes.length]}${cleared ? " cleared" : ""}`;

      const top = document.createElement("div");
      top.className = "ev-top";

      const title = document.createElement("div");
      title.className = "ev-title";
      title.textContent = ev.title;

      const rightBox = document.createElement("div");
      rightBox.className = "ev-right";

      if (ev.time) {
        const time = document.createElement("span");
        time.className = "ev-time";
        time.textContent = ev.time;
        rightBox.appendChild(time);
      }

      // 🚀출발 원클릭 체크박스
      const checkBtn = document.createElement("button");
      checkBtn.type = "button";
      checkBtn.className = `clear-check${cleared ? " checked" : ""}`;
      checkBtn.title = cleared ? "🚀출발 완료 (클릭 시 해제)" : "🚀출발 체크";
      checkBtn.innerHTML = `<svg viewBox="0 0 16 16"><polyline points="3.5 8.5 6.8 11.8 12.8 4.5"></polyline></svg>`;
      checkBtn.onclick = async () => {
        const nextCleared = !isClearedStatus(ev.status);
        ev.status = nextCleared ? "🚀출발" : "출발 전";
        card.classList.toggle("cleared", nextCleared);
        checkBtn.classList.toggle("checked", nextCleared);

        try {
          await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pageId: ev.pageId, cleared: nextCleared })
          });
        } catch (err) {}
      };
      rightBox.appendChild(checkBtn);

      top.appendChild(title);
      top.appendChild(rightBox);
      card.appendChild(top);

      const tags = document.createElement("div");
      tags.className = "ev-tags";

      if (ev.difficulty) {
        const diff = document.createElement("span");
        diff.className = `tag-diff${ev.difficulty.includes("하드") || ev.difficulty.includes("나이트") ? " hard" : ""}`;
        diff.textContent = ev.difficulty;
        tags.appendChild(diff);
      }

      const sel = document.createElement("select");
      sel.className = "prof-select";
      const opts = PROF_OPTIONS.includes(ev.proficiency) ? PROF_OPTIONS : [ev.proficiency, ...PROF_OPTIONS];
      opts.forEach(opt => {
        const o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        if (opt === ev.proficiency) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = async () => {
        ev.proficiency = sel.value;
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pageId: ev.pageId, proficiency: sel.value })
        });
      };
      tags.appendChild(sel);
      card.appendChild(tags);

      const mem = document.createElement("div");
      mem.className = "ev-members";
      const memberText = (ev.members || "").trim();
      mem.textContent = `참여: ${memberText || "신청없음"}`;
      card.appendChild(mem);

      listEl.appendChild(card);
    });
  }

  document.getElementById("prevBtn").onclick = () => { current.setMonth(current.getMonth() - 1); renderCalendar(); };
  document.getElementById("nextBtn").onclick = () => { current.setMonth(current.getMonth() + 1); renderCalendar(); };
  document.getElementById("refreshBtn").onclick = () => loadEvents();

  loadEvents();
</script>
</body>
</html>
