<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; width: 100%; overflow-x: hidden; }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 6px; }

  :root {
    --page-bg: transparent;
    --card-bg: #FFFFFF;
    --card-border: #F9E5E9;
    --card-shadow: 0 4px 18px rgba(244, 182, 198, 0.1);
    --month-fg: #AED9EB;
    --wk-fg: #AED9EB;
    --wknd-fg: #E5A5B4;
    --sel-bg: #FDF0F4;
    --sel-outline: #F49BB8;
    --day-fg: #4A4442;
    --day-hover-bg: #FCEEF2;
    --muted-fg: #B5AEAB;
    --weekend-fg: #B85C6A;
    --sel-day-fg: #D96B8A;
    --dot-fg: #9ED5EB;
    --reset-fg: #B5ABA8;
    --nav-fg: #AED9EB;
    --nav-hover-bg: #FCEEF2;
    --nav-hover-fg: #E58FA7;
    --detail-date-fg: #8AC8E4;
    --count-bg: #FFF0F3;
    --count-border: #F8DCE1;
    --count-fg: #E07A8E;
    --back-bg: #FFF5F7;
    --back-border: #F6DCE2;
    --back-fg: #D96B8A;
    --scroll-thumb: #F5D5DE;
    --empty-fg: #B8AFA9;
    --ev-bg: #FFFFFF;
    --ev-border: #EFECEB;
    --ev-purple-bg: #F3EFFB;
    --ev-yellow-bg: #FBF5DD;
    --ev-pink-bg: #FBECEB;
    --ev-title-fg: #3D3836;
    --arrow-fg: #B8AFA9;
    --time-bg: rgba(255,255,255,0.92);
    --time-fg: #7C7470;
    --chk-bg: rgba(255,255,255,0.92);
    --chk-border: #E5A4B8;
    --diff-bg: #E4D8F8;
    --diff-fg: #684E94;
    --diff-norm-bg: #F2E2B1;
    --diff-norm-fg: #7D6A3B;
    --diff-hard-bg: #F5D2D0;
    --diff-hard-fg: #8C4A4A;
    --prof-bg: #F4DFCC;
    --prof-fg: #875A36;
    --prof-bansuk-bg: #D1E6F9;
    --prof-bansuk-fg: #366494;
    --prof-clgyeong-bg: #D5E8DC;
    --prof-clgyeong-fg: #3A6B4C;
    --prof-try-bg: #E5E4E2;
    --prof-try-fg: #6B6866;
    --dealer-bg: #FADCE2;
    --dealer-fg: #B8526A;
    --supp-bg: #D5F2E1;
    --supp-fg: #337D54;
    --p-card-bg: #FDFBFC;
    --p-card-border: #F5E6EA;
    --p-friend-bg: #E8F1F8;
    --p-friend-fg: #6B8BA4;
    --p-spec-fg: #7C7572;
    --p-memo-bg: #F9EFE2;
    --p-memo-fg: #8A6A46;
    --col-empty-bg: #FDF9FA;
    --col-empty-border: #F2DCE2;
    --empty-apply-bg: #FDF8F9;
    --empty-apply-border: #F3D9E0;
    --empty-apply-fg: #9E9390;
    --gmemo-bg: #FDF8F9;
    --gmemo-border: #F5E6EA;
    --gmemo-fg: #6B625F;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #191919;
      --card-bg: #1B1A20;
      --card-border: #383342;
      --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
      --month-fg: #9BD0F0;
      --wk-fg: #9BD0F0;
      --wknd-fg: #F5A3BC;
      --sel-bg: #2E2028;
      --sel-outline: #F28BA8;
      --day-fg: #EFEAF0;
      --day-hover-bg: #2A2229;
      --muted-fg: #7C7582;
      --weekend-fg: #F29BB5;
      --sel-day-fg: #F5A3BC;
      --dot-fg: #9BD0F0;
      --reset-fg: #9E95A4;
      --nav-fg: #9BD0F0;
      --nav-hover-bg: #2A2229;
      --nav-hover-fg: #F5A3BC;
      --detail-date-fg: #9BD0F0;
      --count-bg: #36222B;
      --count-border: #573644;
      --count-fg: #F5A3BC;
      --back-bg: #2E2028;
      --back-border: #4D3340;
      --back-fg: #F5A3BC;
      --scroll-thumb: #4B3846;
      --empty-fg: #878296;
      --ev-bg: #24232B;
      --ev-border: #3A3646;
      --ev-purple-bg: #282338;
      --ev-yellow-bg: #332D1E;
      --ev-pink-bg: #332229;
      --ev-title-fg: #F4F2F8;
      --arrow-fg: #9A95A8;
      --time-bg: rgba(27,26,32,0.88);
      --time-fg: #D5CFE0;
      --chk-bg: #2A232B;
      --chk-border: #784D5C;
      --diff-bg: #332B4A;
      --diff-fg: #C8B8F5;
      --diff-norm-bg: #3B331E;
      --diff-norm-fg: #E8CA78;
      --diff-hard-bg: #3D2426;
      --diff-hard-fg: #F5A3A8;
      --prof-bg: #382A1E;
      --prof-fg: #F2C08A;
      --prof-bansuk-bg: #1E3142;
      --prof-bansuk-fg: #9BD0F0;
      --prof-clgyeong-bg: #1D352B;
      --prof-clgyeong-fg: #8EE0B5;
      --prof-try-bg: #312F3A;
      --prof-try-fg: #C5C0D2;
      --dealer-bg: #3B222B;
      --dealer-fg: #F5A3BC;
      --supp-bg: #1C352B;
      --supp-fg: #8EE0B5;
      --p-card-bg: #24232B;
      --p-card-border: #3A3646;
      --p-friend-bg: #1E3142;
      --p-friend-fg: #9BD0F0;
      --p-spec-fg: #B8B2C6;
      --p-memo-bg: #352D20;
      --p-memo-fg: #F2C46D;
      --col-empty-bg: #222128;
      --col-empty-border: #383342;
      --empty-apply-bg: #222128;
      --empty-apply-border: #383342;
      --empty-apply-fg: #9A95A8;
      --gmemo-bg: #24232B;
      --gmemo-border: #3A3646;
      --gmemo-fg: #D5CFE0;
    }
  }

  :root[data-theme="dark"] {
    --page-bg: #191919;
    --card-bg: #1B1A20;
    --card-border: #383342;
    --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
    --month-fg: #9BD0F0;
    --wk-fg: #9BD0F0;
    --wknd-fg: #F5A3BC;
    --sel-bg: #2E2028;
    --sel-outline: #F28BA8;
    --day-fg: #EFEAF0;
    --day-hover-bg: #2A2229;
    --muted-fg: #7C7582;
    --weekend-fg: #F29BB5;
    --sel-day-fg: #F5A3BC;
    --dot-fg: #9BD0F0;
    --reset-fg: #9E95A4;
    --nav-fg: #9BD0F0;
    --nav-hover-bg: #2A2229;
    --nav-hover-fg: #F5A3BC;
    --detail-date-fg: #9BD0F0;
    --count-bg: #36222B;
    --count-border: #573644;
    --count-fg: #F5A3BC;
    --back-bg: #2E2028;
    --back-border: #4D3340;
    --back-fg: #F5A3BC;
    --scroll-thumb: #4B3846;
    --empty-fg: #878296;
    --ev-bg: #24232B;
    --ev-border: #3A3646;
    --ev-purple-bg: #282338;
    --ev-yellow-bg: #332D1E;
    --ev-pink-bg: #332229;
    --ev-title-fg: #F4F2F8;
    --arrow-fg: #9A95A8;
    --time-bg: rgba(27,26,32,0.88);
    --time-fg: #D5CFE0;
    --chk-bg: #2A232B;
    --chk-border: #784D5C;
    --diff-bg: #332B4A;
    --diff-fg: #C8B8F5;
    --diff-norm-bg: #3B331E;
    --diff-norm-fg: #E8CA78;
    --diff-hard-bg: #3D2426;
    --diff-hard-fg: #F5A3A8;
    --prof-bg: #382A1E;
    --prof-fg: #F2C08A;
    --prof-bansuk-bg: #1E3142;
    --prof-bansuk-fg: #9BD0F0;
    --prof-clgyeong-bg: #1D352B;
    --prof-clgyeong-fg: #8EE0B5;
    --prof-try-bg: #312F3A;
    --prof-try-fg: #C5C0D2;
    --dealer-bg: #3B222B;
    --dealer-fg: #F5A3BC;
    --supp-bg: #1C352B;
    --supp-fg: #8EE0B5;
    --p-card-bg: #24232B;
    --p-card-border: #3A3646;
    --p-friend-bg: #1E3142;
    --p-friend-fg: #9BD0F0;
    --p-spec-fg: #B8B2C6;
    --p-memo-bg: #352D20;
    --p-memo-fg: #F2C46D;
    --col-empty-bg: #222128;
    --col-empty-border: #383342;
    --empty-apply-bg: #222128;
    --empty-apply-border: #383342;
    --empty-apply-fg: #9A95A8;
    --gmemo-bg: #24232B;
    --gmemo-border: #3A3646;
    --gmemo-fg: #D5CFE0;
  }

  html, body {
    background: var(--page-bg);
  }

  /* 2단 레이아웃: 캘린더 / 우측 카드(일정 목록 ↔ 명단 전환) */
  .wrap {
    width: 100%;
    max-width: 740px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    align-items: flex-start;
  }

  .card {
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 24px;
    padding: 20px 18px 16px;
    box-shadow: var(--card-shadow);
  }
  .cal-card { flex: 0 1 280px; width: 280px; }
  .right-card {
    flex: 1 1 390px;
    max-width: 430px;
    height: 360px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 달력 상단 월 타이틀 */
  .cal-header { text-align: center; margin-bottom: 14px; }
  .month-title { font-size: 18px; font-weight: 800; color: var(--month-fg); letter-spacing: -0.3px; }

  /* 요일 및 날짜 간격 */
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 8px; }
  .weekdays span { font-size: 10.5px; font-weight: 700; color: var(--wk-fg); }
  .weekdays span.wknd { color: var(--wknd-fg); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px 3px; text-align: center; place-items: center; }

  /* 선택 분홍 테두리 간격 */
  .day-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3px 3px 4px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .day-wrap.selected {
    background: var(--sel-bg);
    outline: 2px solid var(--sel-outline);
    outline-offset: 0px;
  }

  .day {
    width: 26px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--day-fg); border-radius: 8px; transition: all 0.15s ease;
  }
  .day-wrap:hover .day { background: var(--day-hover-bg); }
  .day.muted { color: var(--muted-fg); font-weight: 500; }
  .day.weekend { color: var(--weekend-fg); }

  /* 일정 있는 날 (밀키 베이비핑크) */
  .day.has-event { background: #F6B4CA !important; color: #FFFFFF !important; font-weight: 700; }

  /* 당일 날짜 (파우더리 하늘색) */
  .day.today {
    background: #B0DFEF !important;
    color: #FFFFFF !important;
    font-weight: 800;
  }

  .day-wrap.selected .day:not(.has-event):not(.today) {
    background: transparent;
    color: var(--sel-day-fg);
    font-weight: 800;
  }

  /* 링 안쪽 하단 하늘색 점 */
  .dot {
    width: 3.5px; height: 3.5px;
    border-radius: 50%;
    background: var(--dot-fg);
    margin-top: 2px;
  }
  .dot.empty { background: transparent; }

  /* 디데이 숫자 정중앙 + 우측 화살표 */
  .cal-footer {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 20px;
    margin-top: 14px;
    padding: 0 2px;
  }
  .reset-label {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9.5px;
    font-weight: 700;
    color: var(--reset-fg);
    letter-spacing: 0.4px;
    white-space: nowrap;
  }
  .nav-btns { display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }
  .nav-btn {
    border: none; background: transparent; color: var(--nav-fg); font-size: 12px; font-weight: 700;
    width: 18px; height: 18px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--nav-hover-bg); color: var(--nav-hover-fg); }

  /* 우측 카드 헤더 */
  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 2px;
    gap: 8px;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
  .detail-date { font-size: 12.5px; font-weight: 800; color: var(--detail-date-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count-badge { font-size: 10px; font-weight: 700; color: var(--count-fg); background: var(--count-bg); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--count-border); flex-shrink: 0; }

  /* 뒤로가기(← 목록) 버튼 */
  .back-btn {
    border: 1px solid var(--back-border);
    background: var(--back-bg);
    color: var(--back-fg);
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 8px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .back-btn:hover { background: #F6B4CA; color: #FFFFFF; border-color: #F6B4CA; }

  #rightContent {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* 뷰 1: 레이드 일정 리스트 (내부 스크롤) */
  .event-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 3px;
  }
  .event-list::-webkit-scrollbar { width: 4px; }
  .event-list::-webkit-scrollbar-track { background: transparent; }
  .event-list::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 99px; }

  .empty-msg { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: var(--empty-fg); text-align: center; padding: 20px 0; }

  .ev-item {
    background: var(--ev-bg);
    border: 1.5px solid var(--ev-border);
    border-radius: 14px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .ev-item:hover {
    border-color: #F49BB8;
    transform: translateY(-1px);
  }
  .ev-item.bg-purple { background: var(--ev-purple-bg); border-color: transparent; }
  .ev-item.bg-yellow { background: var(--ev-yellow-bg); border-color: transparent; }
  .ev-item.bg-pink { background: var(--ev-pink-bg); border-color: transparent; }
  .ev-item.cleared { opacity: 0.45; }

  .ev-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 7px; }
  .ev-title-area { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
  .ev-title { font-size: 12px; font-weight: 800; color: var(--ev-title-fg); line-height: 1.35; word-break: keep-all; }
  .arrow-hint { font-size: 11px; font-weight: 800; color: var(--arrow-fg); }
  .ev-item:hover .arrow-hint { color: #E57A9B; }

  .ev-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .ev-time { font-size: 10px; font-weight: 700; color: var(--time-fg); background: var(--time-bg); padding: 2px 7px; border-radius: 999px; }

  /* 🚀출발 원클릭 체크박스 */
  .clear-check {
    width: 16px; height: 16px; border-radius: 5px;
    border: 1.5px solid var(--chk-border); background: var(--chk-bg);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s ease; flex-shrink: 0;
  }
  .clear-check:hover { border-color: #D96B8A; }
  .clear-check.checked { background: #F6B4CA; border-color: #F6B4CA; }
  .clear-check svg { width: 10px; height: 10px; stroke: #FFFFFF; stroke-width: 2.8; fill: none; opacity: 0; }
  .clear-check.checked svg { opacity: 1; }

  .ev-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .tag-diff { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--diff-bg); color: var(--diff-fg); }
  .tag-diff.normal { background: var(--diff-norm-bg); color: var(--diff-norm-fg); }
  .tag-diff.hard { background: var(--diff-hard-bg); color: var(--diff-hard-fg); }

  .prof-select {
    font-family: inherit; font-size: 10px; font-weight: 700;
    background: var(--prof-bg); color: var(--prof-fg);
    border: none; border-radius: 6px; padding: 2px 7px; cursor: pointer; outline: none;
  }
  .prof-select.st-bansuk { background: var(--prof-bansuk-bg); color: var(--prof-bansuk-fg); }
  .prof-select.st-clgyeong { background: var(--prof-clgyeong-bg); color: var(--prof-clgyeong-fg); }
  .prof-select.st-try { background: var(--prof-try-bg); color: var(--prof-try-fg); }

  /* 뷰 2: 명단 (딜러 왼쪽 · 서포터 오른쪽 2단 분할 + 내부 스크롤) */
  .member-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 3px;
  }
  .member-body::-webkit-scrollbar { width: 4px; }
  .member-body::-webkit-scrollbar-track { background: transparent; }
  .member-body::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 99px; }

  .roles-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    align-items: start;
  }

  .role-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .role-badge {
    display: inline-flex; align-items: center; gap: 4px;
    align-self: flex-start;
    font-size: 9.5px; font-weight: 800;
    padding: 2.5px 8px; border-radius: 7px; margin-bottom: 6px;
  }
  .role-badge.dealer { background: var(--dealer-bg); color: var(--dealer-fg); }
  .role-badge.supporter { background: var(--supp-bg); color: var(--supp-fg); }

  .p-card {
    background: var(--p-card-bg);
    border: 1px solid var(--p-card-border);
    border-radius: 10px;
    padding: 6px 8px;
    margin-bottom: 5px;
  }
  .p-card:last-child { margin-bottom: 0; }
  .p-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-bottom: 1.5px; }
  .p-name { font-size: 11px; font-weight: 800; color: var(--ev-title-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-friend { font-size: 8.5px; font-weight: 700; color: var(--p-friend-fg); background: var(--p-friend-bg); padding: 1px 5px; border-radius: 4px; flex-shrink: 0; }
  .p-spec { font-size: 9.5px; font-weight: 600; color: var(--p-spec-fg); line-height: 1.3; word-break: keep-all; }
  .p-memo {
    display: inline-block; margin-top: 4px;
    font-size: 9px; font-weight: 700; color: var(--p-memo-fg);
    background: var(--p-memo-bg); padding: 2px 6px; border-radius: 5px;
    line-height: 1.25; word-break: break-all;
  }

  .col-empty {
    background: var(--col-empty-bg);
    border: 1px dashed var(--col-empty-border);
    border-radius: 10px;
    padding: 10px 6px;
    font-size: 10px;
    font-weight: 600;
    color: var(--empty-fg);
    text-align: center;
  }

  .empty-apply {
    background: var(--empty-apply-bg);
    border: 1px dashed var(--empty-apply-border);
    border-radius: 11px;
    padding: 16px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--empty-apply-fg);
    text-align: center;
  }
  .general-memo {
    margin-top: 2px;
    background: var(--gmemo-bg);
    border: 1px solid var(--gmemo-border);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 10px;
    color: var(--gmemo-fg);
    line-height: 1.4;
    white-space: pre-wrap;
    flex-shrink: 0;
  }

  @media (max-width: 480px) {
    body {
      padding: 2px;
    }
    .wrap {
      gap: 8px;
    }
    .card {
      border-radius: 16px;
      padding: 12px 11px 11px;
    }
    .cal-card {
      flex: 1 1 100%;
      width: 100%;
      max-width: 100%;
    }
    .right-card {
      flex: 1 1 100%;
      width: 100%;
      max-width: 100%;
      height: 290px;
    }
    .cal-header {
      margin-bottom: 8px;
    }
    .month-title {
      font-size: 15px;
    }
    .days {
      gap: 4px 2px;
    }
    .day {
      width: 24px;
      height: 22px;
      font-size: 10.5px;
    }
    .cal-footer {
      margin-top: 8px;
    }
    .roles-grid {
      gap: 6px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 1열: 캘린더 -->
  <div class="card cal-card">
    <div class="cal-header">
      <div class="month-title" id="monthTitle">November</div>
    </div>
    <div class="weekdays">
      <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span class="wknd">S</span><span class="wknd">S</span>
    </div>
    <div class="days" id="daysGrid"></div>
    <div class="cal-footer">
      <span class="reset-label" id="resetTimer" title="매주 수요일 06:00 주간 초기화">D-1</span>
      <div class="nav-btns">
        <button class="nav-btn" id="prevBtn" title="이전 달">←</button>
        <button class="nav-btn" id="refreshBtn" title="오늘 날짜로 복귀 및 새로고침">↻</button>
        <button class="nav-btn" id="nextBtn" title="다음 달">→</button>
      </div>
    </div>
  </div>

  <!-- 2열: 레이드 일정 목록 ↔ 클릭 시 같은 자리에 명단 전환 -->
  <div class="card right-card">
    <div class="detail-header">
      <div class="header-left">
        <button type="button" class="back-btn" id="backBtn" style="display:none;">← 목록</button>
        <div class="detail-date" id="rightTitle">-</div>
      </div>
      <div class="count-badge" id="rightBadge">0건</div>
    </div>
    <div id="rightContent">
      <div class="empty-msg">일정을 불러오는 중...</div>
    </div>
  </div>
</div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();

  const API_URL = "https://notion-cal.binhaha329.workers.dev";
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const PROF_OPTIONS = ["숙제", "반숙", "클경", "트라이"];

  let allEvents = [];
  let current = new Date();
  let todayStr = formatDate(new Date());
  let selectedDate = todayStr;
  let activeRaidId = null;

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function updateResetTimer() {
    const now = new Date();
    const kstNow = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
    const target = new Date(kstNow);
    const day = kstNow.getDay();
    let diffDays = (3 - day + 7) % 7;
    if (diffDays === 0 && kstNow.getHours() >= 6) diffDays = 7;
    target.setDate(kstNow.getDate() + diffDays);
    target.setHours(6, 0, 0, 0);

    const diffMs = target - kstNow;
    const totalMins = Math.floor(diffMs / 60000);
    const d = Math.floor(totalMins / 1440);
    const h = String(Math.floor((totalMins % 1440) / 60)).padStart(2, "0");
    const m = String(totalMins % 60).padStart(2, "0");

    const el = document.getElementById("resetTimer");
    el.textContent = d > 0 ? `D-${d} ${h}:${m}` : `${h}:${m}`;
  }
  updateResetTimer();
  setInterval(updateResetTimer, 30000);

  async function loadEvents() {
    try {
      const res = await fetch(API_URL);
      allEvents = await res.json();
    } catch (e) {
      allEvents = [];
    }
    renderCalendar();
    renderRightPanel();
  }

  function renderCalendar() {
    const year = current.getFullYear();
    const month = current.getMonth();
    document.getElementById("monthTitle").textContent = MONTHS[month];

    const grid = document.getElementById("daysGrid");
    grid.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const startOffset = (firstDay + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    const eventDates = new Set(allEvents.map(e => e.date));

    for (let i = startOffset - 1; i >= 0; i--) {
      const wrap = document.createElement("div");
      wrap.className = "day-wrap";
      const cell = document.createElement("div");
      cell.className = "day muted";
      cell.textContent = prevMonthDays - i;
      const dot = document.createElement("span");
      dot.className = "dot empty";
      wrap.appendChild(cell);
      wrap.appendChild(dot);
      grid.appendChild(wrap);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dow = new Date(year, month, d).getDay();

      const wrap = document.createElement("div");
      wrap.className = "day-wrap";
      if (dateStr === selectedDate) wrap.classList.add("selected");

      const cell = document.createElement("div");
      cell.className = "day";
      if (dow === 0 || dow === 6) cell.classList.add("weekend");
      if (eventDates.has(dateStr)) cell.classList.add("has-event");
      if (dateStr === todayStr) cell.classList.add("today");
      cell.textContent = d;

      const dot = document.createElement("span");
      dot.className = eventDates.has(dateStr) ? "dot" : "dot empty";

      wrap.appendChild(cell);
      wrap.appendChild(dot);

      wrap.onclick = () => {
        selectedDate = dateStr;
        activeRaidId = null;
        renderCalendar();
        renderRightPanel();
      };
      grid.appendChild(wrap);
    }

    const totalCells = startOffset + daysInMonth;
    const nextDays = totalCells <= 35 ? (35 - totalCells) : (42 - totalCells);
    for (let i = 1; i <= nextDays; i++) {
      const wrap = document.createElement("div");
      wrap.className = "day-wrap";
      const cell = document.createElement("div");
      cell.className = "day muted";
      cell.textContent = i;
      const dot = document.createElement("span");
      dot.className = "dot empty";
      wrap.appendChild(cell);
      wrap.appendChild(dot);
      grid.appendChild(wrap);
    }
  }

  function isClearedStatus(status) {
    return status === "🚀출발" || status === "출발" || status === "출발 완료" || status === "완료" || status === "클리어";
  }

  function getCardBgClass(diff) {
    if (!diff) return "";
    if (diff.includes("나이트") || diff.includes("3단계")) return "bg-purple";
    if (diff.includes("노말") || diff.includes("1단계")) return "bg-yellow";
    if (diff.includes("하드") || diff.includes("2단계")) return "bg-pink";
    return "bg-purple";
  }

  function getDiffClass(diff) {
    if (diff.includes("노말") || diff.includes("1단계")) return "normal";
    if (diff.includes("하드") || diff.includes("2단계")) return "hard";
    return "";
  }

  function getProfClass(prof) {
    if (prof === "반숙") return "st-bansuk";
    if (prof === "클경") return "st-clgyeong";
    if (prof === "트라이") return "st-try";
    return "";
  }

  function parseParticipantGroups(raw) {
    const text = (raw || "").trim();
    if (!text) return null;

    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const groups = { dealer: [], supporter: [] };
    let currentRole = "dealer";
    let curPerson = null;

    const flushPerson = () => {
      if (curPerson) {
        groups[currentRole].push(curPerson);
        curPerson = null;
      }
    };

    for (const line of lines) {
      if (/^딜러\s*\d*$/.test(line)) {
        flushPerson();
        currentRole = "dealer";
        continue;
      }
      if (/^서포터\s*\d*$/.test(line)) {
        flushPerson();
        currentRole = "supporter";
        continue;
      }

      if (line.startsWith("ㄴ") || line.startsWith("-")) {
        if (curPerson) {
          curPerson.memo = line.replace(/^[ㄴ\-]\s*/, "").trim();
        }
        continue;
      }

      if (line.includes("|")) {
        if (curPerson && !curPerson.spec) {
          curPerson.spec = line;
        } else {
          flushPerson();
          const parts = line.split("|").map(p => p.trim());
          const isFriend = parts[0].includes("(지인)");
          const cleanHead = parts[0].replace("(지인)", "").trim();
          const words = cleanHead.split(/\s+/);
          curPerson = {
            name: words[0],
            isFriend,
            spec: [words.slice(1).join(" "), ...parts.slice(1)].filter(Boolean).join(" | "),
            memo: ""
          };
        }
        continue;
      }

      flushPerson();
      const isFriend = line.includes("(지인)");
      const name = line.replace("(지인)", "").trim();
      curPerson = { name, isFriend, spec: "", memo: "" };
    }
    flushPerson();

    return groups;
  }

  function renderRightPanel() {
    const backBtn = document.getElementById("backBtn");
    const titleEl = document.getElementById("rightTitle");
    const badgeEl = document.getElementById("rightBadge");
    const contentEl = document.getElementById("rightContent");

    const dayEvents = allEvents.filter(e => e.date === selectedDate);
    const activeEv = activeRaidId ? dayEvents.find(e => e.pageId === activeRaidId) : null;

    if (activeEv) {
      backBtn.style.display = "inline-flex";
      titleEl.textContent = "명단";
      titleEl.title = activeEv.title;
      contentEl.innerHTML = "";

      const bodyEl = document.createElement("div");
      bodyEl.className = "member-body";

      const groups = parseParticipantGroups(activeEv.members);
      const totalCount = groups ? (groups.dealer.length + groups.supporter.length) : 0;
      badgeEl.textContent = `${totalCount}명`;

      if (totalCount === 0) {
        const emptyEl = document.createElement("div");
        emptyEl.className = "empty-apply";
        emptyEl.textContent = "신청없음";
        bodyEl.appendChild(emptyEl);
      } else {
        const grid = document.createElement("div");
        grid.className = "roles-grid";

        const buildColumn = (roleKey, labelText) => {
          const list = groups[roleKey] || [];
          const col = document.createElement("div");
          col.className = "role-col";

          const badge = document.createElement("div");
          badge.className = `role-badge ${roleKey}`;
          badge.textContent = `${labelText} ${list.length}`;
          col.appendChild(badge);

          if (list.length === 0) {
            const noneEl = document.createElement("div");
            noneEl.className = "col-empty";
            noneEl.textContent = "신청 없음";
            col.appendChild(noneEl);
          } else {
            list.forEach(p => {
              const pCard = document.createElement("div");
              pCard.className = "p-card";

              const pTop = document.createElement("div");
              pTop.className = "p-top";
              const pName = document.createElement("span");
              pName.className = "p-name";
              pName.textContent = p.name;
              pTop.appendChild(pName);

              if (p.isFriend) {
                const fTag = document.createElement("span");
                fTag.className = "p-friend";
                fTag.textContent = "지인";
                pTop.appendChild(fTag);
              }
              pCard.appendChild(pTop);

              if (p.spec) {
                const pSpec = document.createElement("div");
                pSpec.className = "p-spec";
                pSpec.textContent = p.spec;
                pCard.appendChild(pSpec);
              }

              if (p.memo) {
                const pMemo = document.createElement("div");
                pMemo.className = "p-memo";
                pMemo.textContent = p.memo;
                pCard.appendChild(pMemo);
              }

              col.appendChild(pCard);
            });
          }

          return col;
        };

        grid.appendChild(buildColumn("dealer", "⚔️ 딜러"));
        grid.appendChild(buildColumn("supporter", "💚 서포터"));
        bodyEl.appendChild(grid);
      }

      if ((activeEv.memo || "").trim()) {
        const gMemo = document.createElement("div");
        gMemo.className = "general-memo";
        gMemo.textContent = activeEv.memo.trim();
        bodyEl.appendChild(gMemo);
      }

      contentEl.appendChild(bodyEl);
      return;
    }

    backBtn.style.display = "none";
    titleEl.textContent = selectedDate;
    titleEl.title = "";
    badgeEl.textContent = `${dayEvents.length}건`;

    if (dayEvents.length === 0) {
      contentEl.innerHTML = `<div class="empty-msg">선택한 날짜에 일정이 없어요</div>`;
      return;
    }

    const listEl = document.createElement("div");
    listEl.className = "event-list";

    dayEvents.forEach((ev) => {
      const cleared = isClearedStatus(ev.status);
      const card = document.createElement("div");
      card.className = `ev-item ${getCardBgClass(ev.difficulty)}${cleared ? " cleared" : ""}`;

      card.onclick = () => {
        activeRaidId = ev.pageId;
        renderRightPanel();
      };

      const top = document.createElement("div");
      top.className = "ev-top";

      const titleArea = document.createElement("div");
      titleArea.className = "ev-title-area";

      const title = document.createElement("span");
      title.className = "ev-title";
      title.textContent = ev.title;

      const arrowHint = document.createElement("span");
      arrowHint.className = "arrow-hint";
      arrowHint.textContent = "›";

      titleArea.appendChild(title);
      titleArea.appendChild(arrowHint);

      const rightBox = document.createElement("div");
      rightBox.className = "ev-right";

      if (ev.time) {
        const time = document.createElement("span");
        time.className = "ev-time";
        time.textContent = ev.time;
        rightBox.appendChild(time);
      }

      const checkBtn = document.createElement("button");
      checkBtn.type = "button";
      checkBtn.className = `clear-check${cleared ? " checked" : ""}`;
      checkBtn.title = cleared ? "🚀출발 완료 (클릭 시 해제)" : "🚀출발 체크";
      checkBtn.innerHTML = `<svg viewBox="0 0 16 16"><polyline points="3.5 8.5 6.8 11.8 12.8 4.5"></polyline></svg>`;
      checkBtn.onclick = async (e) => {
        e.stopPropagation();
        const nextCleared = !isClearedStatus(ev.status);
        ev.status = nextCleared ? "🚀출발" : "출발 전";
        card.classList.toggle("cleared", nextCleared);
        checkBtn.classList.toggle("checked", nextCleared);

        try {
          await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pageId: ev.pageId, cleared: nextCleared })
          });
        } catch (err) {}
      };
      rightBox.appendChild(checkBtn);

      top.appendChild(titleArea);
      top.appendChild(rightBox);
      card.appendChild(top);

      const tags = document.createElement("div");
      tags.className = "ev-tags";

      if (ev.difficulty) {
        const diff = document.createElement("span");
        diff.className = `tag-diff ${getDiffClass(ev.difficulty)}`;
        diff.textContent = ev.difficulty;
        tags.appendChild(diff);
      }

      const sel = document.createElement("select");
      sel.className = `prof-select ${getProfClass(ev.proficiency)}`;
      const opts = PROF_OPTIONS.includes(ev.proficiency) ? PROF_OPTIONS : [ev.proficiency, ...PROF_OPTIONS];
      opts.forEach(opt => {
        const o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        if (opt === ev.proficiency) o.selected = true;
        sel.appendChild(o);
      });
      sel.onclick = (e) => e.stopPropagation();
      sel.onchange = async (e) => {
        e.stopPropagation();
        ev.proficiency = sel.value;
        sel.className = `prof-select ${getProfClass(sel.value)}`;
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pageId: ev.pageId, proficiency: sel.value })
        });
      };
      tags.appendChild(sel);
      card.appendChild(tags);

      listEl.appendChild(card);
    });

    contentEl.innerHTML = "";
    contentEl.appendChild(listEl);
  }

  document.getElementById("backBtn").onclick = () => {
    activeRaidId = null;
    renderRightPanel();
  };
  document.getElementById("prevBtn").onclick = () => { current.setMonth(current.getMonth() - 1); renderCalendar(); };
  document.getElementById("nextBtn").onclick = () => { current.setMonth(current.getMonth() + 1); renderCalendar(); };

  document.getElementById("refreshBtn").onclick = () => {
    const now = new Date();
    current = new Date(now.getFullYear(), now.getMonth(), 1);
    todayStr = formatDate(now);
    selectedDate = todayStr;
    activeRaidId = null;
    renderCalendar();
    renderRightPanel();
    loadEvents();
  };

  loadEvents();
</script>
</body>
</html>
