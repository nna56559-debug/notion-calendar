<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; width: 100%; overflow-x: hidden; }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 6px; }
  .wrap { width: 100%; max-width: 650px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: flex-start; }

  .card {
    background: #FDF8F9;
    border: 1.5px solid #F9E5E9;
    border-radius: 24px;
    padding: 22px 20px 18px;
    box-shadow: 0 6px 22px rgba(244, 182, 198, 0.12);
  }
  .cal-card { flex: 1 1 275px; max-width: 300px; }
  .detail-card { flex: 1 1 285px; max-width: 320px; min-height: 336px; display: flex; flex-direction: column; }

  /* 달력 상단 월 타이틀 */
  .cal-header { text-align: center; margin-bottom: 18px; }
  .month-title { font-size: 18px; font-weight: 800; color: #AED9EB; letter-spacing: -0.3px; }

  /* 요일 및 날짜 */
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 12px; }
  .weekdays span { font-size: 10.5px; font-weight: 700; color: #AED9EB; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 13px 4px; text-align: center; place-items: center; }

  /* 날짜 셀 래퍼 (2번째 사진처럼 점까지 감싸는 이중 링 구조) */
  .day-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2px 2px 6px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .day-wrap.selected {
    background: #FDF0F4;
    outline: 2px solid #F49BB8;
    outline-offset: 0px;
  }

  .day {
    width: 26px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #4A4442; border-radius: 8px; transition: all 0.15s ease;
  }
  .day-wrap:hover .day { background: #FCEEF2; }
  .day.muted { color: #B5AEAB; font-weight: 500; }
  .day.weekend { color: #B85C6A; }

  /* 일정 있는 날 (밀키 베이비핑크) */
  .day.has-event { background: #F6B4CA !important; color: #FFFFFF !important; font-weight: 700; }

  /* 당일 날짜 (파우더리 하늘색) */
  .day.today {
    background: #B0DFEF !important;
    color: #FFFFFF !important;
    font-weight: 800;
  }

  .day-wrap.selected .day:not(.has-event):not(.today) {
    background: transparent;
    color: #D96B8A;
    font-weight: 800;
  }

  /* 링 안쪽 하단에 자리 잡는 하늘색 점 */
  .dot {
    width: 3.5px; height: 3.5px;
    border-radius: 50%;
    background: #9ED5EB;
    margin-top: 2px;
  }
  .dot.empty { background: transparent; }

  /* 하단 푸터: 초기화 문구 정중앙 배치 + 우측 화살표 */
  .cal-footer {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 20px;
    margin-top: 18px;
    padding: 0 2px;
  }
  .reset-label {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9.5px;
    font-weight: 700;
    color: #B5ABA8;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .nav-btns { display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }
  .nav-btn {
    border: none; background: transparent; color: #AED9EB; font-size: 12px; font-weight: 700;
    width: 18px; height: 18px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: #FCEEF2; color: #E58FA7; }

  /* 우측 일정 상세 카드 */
  .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .detail-date { font-size: 12.5px; font-weight: 800; color: #8AC8E4; }
  .count-badge { font-size: 10px; font-weight: 700; color: #E07A8E; background: #FFF0F3; padding: 2px 8px; border-radius: 999px; border: 1px solid #F8DCE1; }

  .event-list { display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .empty-msg { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: #B8AFA9; text-align: center; padding: 20px 0; }

  /* 갤러리/보드 뷰와 100% 맞춘 난이도별 카드 배경색 */
  .ev-item {
    background: #FFFFFF;
    border: 1px solid #EFECEB; /* 난이도 미지정(asd): 순백색 카드 */
    border-radius: 14px;
    padding: 10px 12px;
    transition: opacity 0.25s ease;
  }
  .ev-item.bg-purple { background: #F3EFFB; border-color: transparent; } /* 나이트메어 / 3단계 */
  .ev-item.bg-yellow { background: #FBF5DD; border-color: transparent; } /* 노말 / 1단계 */
  .ev-item.bg-pink { background: #FBECEB; border-color: transparent; }   /* 하드 / 2단계 */
  .ev-item.cleared { opacity: 0.45; }

  .ev-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 7px; }
  .ev-title-area { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; cursor: pointer; }
  .ev-title { font-size: 12px; font-weight: 800; color: #3D3836; line-height: 1.35; word-break: keep-all; }

  .acc-btn {
    width: 16px; height: 16px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.92); color: #8A817C;
    font-size: 8.5px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: transform 0.2s ease;
  }
  .ev-item.open .acc-btn { transform: rotate(180deg); }

  .ev-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .ev-time { font-size: 10px; font-weight: 700; color: #7C7470; background: rgba(255,255,255,0.92); padding: 2px 7px; border-radius: 999px; }

  /* 🚀출발 원클릭 체크박스 */
  .clear-check {
    width: 16px; height: 16px; border-radius: 5px;
    border: 1.5px solid #E5A4B8; background: rgba(255,255,255,0.92);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s ease; flex-shrink: 0;
  }
  .clear-check:hover { border-color: #D96B8A; }
  .clear-check.checked { background: #F6B4CA; border-color: #F6B4CA; }
  .clear-check svg { width: 10px; height: 10px; stroke: #FFFFFF; stroke-width: 2.8; fill: none; opacity: 0; }
  .clear-check.checked svg { opacity: 1; }

  .ev-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }

  /* 갤러리 뷰 난이도 뱃지 색상 */
  .tag-diff { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #E4D8F8; color: #684E94; }
  .tag-diff.normal { background: #F2E2B1; color: #7D6A3B; }
  .tag-diff.hard { background: #F5D2D0; color: #8C4A4A; }

  /* 갤러리 뷰 숙련도 드롭다운 색상 */
  .prof-select {
    font-family: inherit; font-size: 10px; font-weight: 700;
    background: #F4DFCC; color: #875A36;
    border: none; border-radius: 6px; padding: 2px 7px; cursor: pointer; outline: none;
  }
  .prof-select.st-bansuk { background: #D1E6F9; color: #366494; }
  .prof-select.st-clgyeong { background: #D5E8DC; color: #3A6B4C; }
  .prof-select.st-try { background: #E5E4E2; color: #6B6866; }

  /* 클릭 시 펼쳐지는 참여자 & 메모 서랍 */
  .ev-drawer {
    display: none;
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid rgba(155, 140, 175, 0.2);
  }
  .ev-item.open .ev-drawer { display: block; }

  .role-group { margin-bottom: 9px; }
  .role-group:last-child { margin-bottom: 0; }
  .role-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 800;
    padding: 3px 8px; border-radius: 7px; margin-bottom: 6px;
  }
  .role-badge.dealer { background: #FADCE2; color: #B8526A; }
  .role-badge.supporter { background: #D5F2E1; color: #337D54; }

  .p-card {
    background: #FFFFFF;
    border: 1px solid rgba(0, 0, 0, 0.04);
    border-radius: 11px;
    padding: 8px 10px;
    margin-bottom: 5px;
  }
  .p-card:last-child { margin-bottom: 0; }
  .p-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 2px; }
  .p-name { font-size: 11.5px; font-weight: 800; color: #3D3836; }
  .p-friend { font-size: 9px; font-weight: 700; color: #6B8BA4; background: #E8F1F8; padding: 1.5px 6px; border-radius: 5px; }
  .p-spec { font-size: 10px; font-weight: 600; color: #7C7572; }
  .p-memo {
    display: inline-block; margin-top: 5px;
    font-size: 9.5px; font-weight: 700; color: #8A6A46;
    background: #F9EFE2; padding: 2.5px 8px; border-radius: 6px;
  }

  .empty-apply {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 600;
    color: #8E8580;
    text-align: center;
  }
  .general-memo {
    margin-top: 8px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 10px;
    color: #6B625F;
    line-height: 1.45;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card cal-card">
    <div class="cal-header">
      <div class="month-title" id="monthTitle">November</div>
    </div>
    <div class="weekdays">
      <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
    </div>
    <div class="days" id="daysGrid"></div>
    <div class="cal-footer">
      <span class="reset-label" id="resetTimer" title="매주 수요일 06:00 주간 초기화">초기화 D-1</span>
      <div class="nav-btns">
        <button class="nav-btn" id="prevBtn" title="이전 달">←</button>
        <button class="nav-btn" id="refreshBtn" title="새로고침">↻</button>
        <button class="nav-btn" id="nextBtn" title="다음 달">→</button>
      </div>
    </div>
  </div>

  <div class="card detail-card">
    <div class="detail-header">
      <div class="detail-date" id="detailDate">-</div>
      <div class="count-badge" id="countBadge">0건</div>
    </div>
    <div class="event-list" id="eventList">
      <div class="empty-msg">일정을 불러오는 중...</div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://notion-cal.binhaha329.workers.dev";
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const PROF_OPTIONS = ["숙제", "반숙", "클경", "트라이"];

  let allEvents = [];
  let current = new Date();
  const todayStr = formatDate(new Date());
  let selectedDate = todayStr;

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function updateResetTimer() {
    const now = new Date();
    const kstNow = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
    const target = new Date(kstNow);
    const day = kstNow.getDay();
    let diffDays = (3 - day + 7) % 7;
    if (diffDays === 0 && kstNow.getHours() >= 6) diffDays = 7;
    target.setDate(kstNow.getDate() + diffDays);
    target.setHours(6, 0, 0, 0);

    const diffMs = target - kstNow;
    const totalMins = Math.floor(diffMs / 60000);
    const d = Math.floor(totalMins / 1440);
    const h = String(Math.floor((totalMins % 1440) / 60)).padStart(2, "0");
    const m = String(totalMins % 60).padStart(2, "0");

    const el = document.getElementById("resetTimer");
    el.textContent = d > 0 ? `초기화 D-${d} ${h}:${m}` : `초기화 ${h}:${m}`;
  }
  updateResetTimer();
  setInterval(updateResetTimer, 30000);

  async function loadEvents() {
    try {
      const res = await fetch(API_URL);
      allEvents = await res.json();
    } catch (e) {
      allEvents = [];
    }
    renderCalendar();
    renderDetails();
  }

  function renderCalendar() {
    const year = current.getFullYear();
    const month = current.getMonth();
    document.getElementById("monthTitle").textContent = MONTHS[month];

    const grid = document.getElementById("daysGrid");
    grid.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const startOffset = (firstDay + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    const eventDates = new Set(allEvents.map(e => e.date));

    // 이전 달 날짜
    for (let i = startOffset - 1; i >= 0; i--) {
      const wrap = document.createElement("div");
      wrap.className = "day-wrap";
      const cell = document.createElement("div");
      cell.className = "day muted";
      cell.textContent = prevMonthDays - i;
      const dot = document.createElement("span");
      dot.className = "dot empty";
      wrap.appendChild(cell);
      wrap.appendChild(dot);
      grid.appendChild(wrap);
    }

    // 이번 달 날짜
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dow = new Date(year, month, d).getDay();

      const wrap = document.createElement("div");
      wrap.className = "day-wrap";
      if (dateStr === selectedDate) wrap.classList.add("selected");

      const cell = document.createElement("div");
      cell.className = "day";
      if (dow === 0 || dow === 6) cell.classList.add("weekend");
      if (eventDates.has(dateStr)) cell.classList.add("has-event");
      if (dateStr === todayStr) cell.classList.add("today");
      cell.textContent = d;

      const dot = document.createElement("span");
      dot.className = eventDates.has(dateStr) ? "dot" : "dot empty";

      wrap.appendChild(cell);
      wrap.appendChild(dot);

      wrap.onclick = () => {
        selectedDate = dateStr;
        renderCalendar();
        renderDetails();
      };
      grid.appendChild(wrap);
    }

    // 다음 달 날짜 채우기
    const totalCells = startOffset + daysInMonth;
    const nextDays = totalCells <= 35 ? (35 - totalCells) : (42 - totalCells);
    for (let i = 1; i <= nextDays; i++) {
      const wrap = document.createElement("div");
      wrap.className = "day-wrap";
      const cell = document.createElement("div");
      cell.className = "day muted";
      cell.textContent = i;
      const dot = document.createElement("span");
      dot.className = "dot empty";
      wrap.appendChild(cell);
      wrap.appendChild(dot);
      grid.appendChild(wrap);
    }
  }

  function isClearedStatus(status) {
    return status === "🚀출발" || status === "출발" || status === "출발 완료" || status === "완료" || status === "클리어";
  }

  function getCardBgClass(diff) {
    if (!diff) return "";
    if (diff.includes("나이트") || diff.includes("3단계")) return "bg-purple";
    if (diff.includes("노말") || diff.includes("1단계")) return "bg-yellow";
    if (diff.includes("하드") || diff.includes("2단계")) return "bg-pink";
    return "bg-purple";
  }

  function getDiffClass(diff) {
    if (diff.includes("노말") || diff.includes("1단계")) return "normal";
    if (diff.includes("하드") || diff.includes("2단계")) return "hard";
    return "";
  }

  function getProfClass(prof) {
    if (prof === "반숙") return "st-bansuk";
    if (prof === "클경") return "st-clgyeong";
    if (prof === "트라이") return "st-try";
    return "";
  }

  function parseParticipantGroups(raw) {
    const text = (raw || "").trim();
    if (!text) return null;

    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const groups = { dealer: [], supporter: [] };
    let currentRole = "dealer";
    let curPerson = null;

    const flushPerson = () => {
      if (curPerson) {
        groups[currentRole].push(curPerson);
        curPerson = null;
      }
    };

    for (const line of lines) {
      if (/^딜러\s*\d*$/.test(line)) {
        flushPerson();
        currentRole = "dealer";
        continue;
      }
      if (/^서포터\s*\d*$/.test(line)) {
        flushPerson();
        currentRole = "supporter";
        continue;
      }

      if (line.startsWith("ㄴ") || line.startsWith("-")) {
        if (curPerson) {
          curPerson.memo = line.replace(/^[ㄴ\-]\s*/, "").trim();
        }
        continue;
      }

      if (line.includes("|")) {
        if (curPerson && !curPerson.spec) {
          curPerson.spec = line;
        } else {
          flushPerson();
          const parts = line.split("|").map(p => p.trim());
          const isFriend = parts[0].includes("(지인)");
          const cleanHead = parts[0].replace("(지인)", "").trim();
          const words = cleanHead.split(/\s+/);
          curPerson = {
            name: words[0],
            isFriend,
            spec: [words.slice(1).join(" "), ...parts.slice(1)].filter(Boolean).join(" | "),
            memo: ""
          };
        }
        continue;
      }

      flushPerson();
      const isFriend = line.includes("(지인)");
      const name = line.replace("(지인)", "").trim();
      curPerson = { name, isFriend, spec: "", memo: "" };
    }
    flushPerson();

    return groups;
  }

  function renderDetails() {
    document.getElementById("detailDate").textContent = selectedDate;
    const listEl = document.getElementById("eventList");
    const dayEvents = allEvents.filter(e => e.date === selectedDate);
    document.getElementById("countBadge").textContent = `${dayEvents.length}건`;

    if (dayEvents.length === 0) {
      listEl.innerHTML = `<div class="empty-msg">선택한 날짜에 일정이 없어요</div>`;
      return;
    }

    listEl.innerHTML = "";

    dayEvents.forEach((ev) => {
      const cleared = isClearedStatus(ev.status);
      const card = document.createElement("div");
      card.className = `ev-item ${getCardBgClass(ev.difficulty)}${cleared ? " cleared" : ""}`;

      const top = document.createElement("div");
      top.className = "ev-top";

      const titleArea = document.createElement("div");
      titleArea.className = "ev-title-area";

      const title = document.createElement("span");
      title.className = "ev-title";
      title.textContent = ev.title;

      const accBtn = document.createElement("button");
      accBtn.type = "button";
      accBtn.className = "acc-btn";
      accBtn.textContent = "▾";
      accBtn.title = "참여자 및 메모 펼치기";

      titleArea.appendChild(title);
      titleArea.appendChild(accBtn);
      titleArea.onclick = () => card.classList.toggle("open");

      const rightBox = document.createElement("div");
      rightBox.className = "ev-right";

      if (ev.time) {
        const time = document.createElement("span");
        time.className = "ev-time";
        time.textContent = ev.time;
        rightBox.appendChild(time);
      }

      const checkBtn = document.createElement("button");
      checkBtn.type = "button";
      checkBtn.className = `clear-check${cleared ? " checked" : ""}`;
      checkBtn.title = cleared ? "🚀출발 완료 (클릭 시 해제)" : "🚀출발 체크";
      checkBtn.innerHTML = `<svg viewBox="0 0 16 16"><polyline points="3.5 8.5 6.8 11.8 12.8 4.5"></polyline></svg>`;
      checkBtn.onclick = async (e) => {
        e.stopPropagation();
        const nextCleared = !isClearedStatus(ev.status);
        ev.status = nextCleared ? "🚀출발" : "출발 전";
        card.classList.toggle("cleared", nextCleared);
        checkBtn.classList.toggle("checked", nextCleared);

        try {
          await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pageId: ev.pageId, cleared: nextCleared })
          });
        } catch (err) {}
      };
      rightBox.appendChild(checkBtn);

      top.appendChild(titleArea);
      top.appendChild(rightBox);
      card.appendChild(top);

      const tags = document.createElement("div");
      tags.className = "ev-tags";

      if (ev.difficulty) {
        const diff = document.createElement("span");
        diff.className = `tag-diff ${getDiffClass(ev.difficulty)}`;
        diff.textContent = ev.difficulty;
        tags.appendChild(diff);
      }

      const sel = document.createElement("select");
      sel.className = `prof-select ${getProfClass(ev.proficiency)}`;
      const opts = PROF_OPTIONS.includes(ev.proficiency) ? PROF_OPTIONS : [ev.proficiency, ...PROF_OPTIONS];
      opts.forEach(opt => {
        const o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        if (opt === ev.proficiency) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = async () => {
        ev.proficiency = sel.value;
        sel.className = `prof-select ${getProfClass(sel.value)}`;
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pageId: ev.pageId, proficiency: sel.value })
        });
      };
      tags.appendChild(sel);
      card.appendChild(tags);

      const drawer = document.createElement("div");
      drawer.className = "ev-drawer";

      const groups = parseParticipantGroups(ev.members);
      const hasAnyMember = groups && (groups.dealer.length > 0 || groups.supporter.length > 0);

      if (!hasAnyMember) {
        const emptyEl = document.createElement("div");
        emptyEl.className = "empty-apply";
        emptyEl.textContent = "신청없음";
        drawer.appendChild(emptyEl);
      } else {
        const buildGroup = (roleKey, labelText) => {
          const list = groups[roleKey];
          if (!list || list.length === 0) return;
          const gWrap = document.createElement("div");
          gWrap.className = "role-group";

          const badge = document.createElement("div");
          badge.className = `role-badge ${roleKey}`;
          badge.textContent = `${labelText} ${list.length}`;
          gWrap.appendChild(badge);

          list.forEach(p => {
            const pCard = document.createElement("div");
            pCard.className = "p-card";

            const pTop = document.createElement("div");
            pTop.className = "p-top";
            const pName = document.createElement("span");
            pName.className = "p-name";
            pName.textContent = p.name;
            pTop.appendChild(pName);

            if (p.isFriend) {
              const fTag = document.createElement("span");
              fTag.className = "p-friend";
              fTag.textContent = "지인";
              pTop.appendChild(fTag);
            }
            pCard.appendChild(pTop);

            if (p.spec) {
              const pSpec = document.createElement("div");
              pSpec.className = "p-spec";
              pSpec.textContent = p.spec;
              pCard.appendChild(pSpec);
            }

            if (p.memo) {
              const pMemo = document.createElement("div");
              pMemo.className = "p-memo";
              pMemo.textContent = `ㄴ ${p.memo}`;
              pCard.appendChild(pMemo);
            }

            gWrap.appendChild(pCard);
          });

          drawer.appendChild(gWrap);
        };

        buildGroup("dealer", "⚔️ 딜러");
        buildGroup("supporter", "💚 서포터");
      }

      if ((ev.memo || "").trim()) {
        const gMemo = document.createElement("div");
        gMemo.className = "general-memo";
        gMemo.textContent = ev.memo.trim();
        drawer.appendChild(gMemo);
      }

      card.appendChild(drawer);
      listEl.appendChild(card);
    });
  }

  document.getElementById("prevBtn").onclick = () => { current.setMonth(current.getMonth() - 1); renderCalendar(); };
  document.getElementById("nextBtn").onclick = () => { current.setMonth(current.getMonth() + 1); renderCalendar(); };
  document.getElementById("refreshBtn").onclick = () => loadEvents();

  loadEvents();
</script>
</body>
</html>
