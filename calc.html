<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 4px;
  }

  :root {
    --page-bg: transparent;
    --card-bg: #FFFFFF;
    --card-border: #F9E5E9;
    --card-shadow: 0 4px 16px rgba(244, 182, 198, 0.1);
    --badge-bg: #FCE6ED;
    --badge-fg: #C95B7A;
    --clear-fg: #AED9EB;
    --clear-hover-fg: #E58FA7;
    --inp-border: #F2DCE2;
    --inp-bg: #FDFBFC;
    --inp-focus-bg: #FFFFFF;
    --inp-ph: #C4BBB8;
    --txt-main: #4A4442;
    --txt-sub: #8C8280;
    --unit-fg: #B37E22;
    --p4-bg: #F6FBFE;
    --p4-border: #DFEEF7;
    --p4-title: #3D7496;
    --p8-bg: #FDF8FA;
    --p8-border: #F6E2E8;
    --p8-title: #C95B7A;
    --row-hover-bg: rgba(255, 255, 255, 0.85);
    --copied-fg: #3D7A56;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #191919;
      --card-bg: #1B1A20;
      --card-border: #383342;
      --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
      --badge-bg: #3B252E;
      --badge-fg: #F5A3BC;
      --clear-fg: #7CB9D4;
      --clear-hover-fg: #F5A3BC;
      --inp-border: #3A3646;
      --inp-bg: #24232B;
      --inp-focus-bg: #2C2A35;
      --inp-ph: #8A859A;
      --txt-main: #F4F2F8;
      --txt-sub: #B5B0C4;
      --unit-fg: #F2C46D;
      --p4-bg: #1C2B36;
      --p4-border: #2C4354;
      --p4-title: #9BD0F0;
      --p8-bg: #2E2028;
      --p8-border: #4A313E;
      --p8-title: #F5A3BC;
      --row-hover-bg: rgba(255, 255, 255, 0.06);
      --copied-fg: #8EE0B5;
    }
  }

  :root[data-theme="dark"] {
    --page-bg: #191919;
    --card-bg: #1B1A20;
    --card-border: #383342;
    --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
    --badge-bg: #3B252E;
    --badge-fg: #F5A3BC;
    --clear-fg: #7CB9D4;
    --clear-hover-fg: #F5A3BC;
    --inp-border: #3A3646;
    --inp-bg: #24232B;
    --inp-focus-bg: #2C2A35;
    --inp-ph: #8A859A;
    --txt-main: #F4F2F8;
    --txt-sub: #B5B0C4;
    --unit-fg: #F2C46D;
    --p4-bg: #1C2B36;
    --p4-border: #2C4354;
    --p4-title: #9BD0F0;
    --p8-bg: #2E2028;
    --p8-border: #4A313E;
    --p8-title: #F5A3BC;
    --row-hover-bg: rgba(255, 255, 255, 0.06);
    --copied-fg: #8EE0B5;
  }

  html, body {
    background: var(--page-bg);
  }

  .calc-card {
    width: 100%;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 20px;
    padding: 11px 12px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .c-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .c-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 7px;
    border-radius: 7px;
    background: var(--badge-bg);
    color: var(--badge-fg);
  }
  .c-clear {
    border: none;
    background: transparent;
    color: var(--clear-fg);
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    padding: 0 3px;
  }
  .c-clear:hover { color: var(--clear-hover-fg); }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .price-input {
    width: 100%;
    border: 1.2px solid var(--inp-border);
    background: var(--inp-bg);
    border-radius: 9px;
    padding: 6px 24px 6px 10px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--txt-main);
    text-align: right;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .price-input::placeholder {
    color: var(--inp-ph);
    font-weight: 600;
    font-size: 10px;
  }
  .price-input:focus {
    border-color: #F29CB4;
    background: var(--inp-focus-bg);
  }
  .unit-g {
    position: absolute;
    right: 9px;
    font-size: 9.5px;
    font-weight: 800;
    color: var(--unit-fg);
    pointer-events: none;
  }

  .party-box {
    border-radius: 11px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .party-box.p4 {
    background: var(--p4-bg);
    border: 1px solid var(--p4-border);
  }
  .party-box.p8 {
    background: var(--p8-bg);
    border: 1px solid var(--p8-border);
  }

  .p-title {
    font-size: 9.5px;
    font-weight: 900;
    letter-spacing: -0.2px;
  }
  .p4 .p-title { color: var(--p4-title); }
  .p8 .p-title { color: var(--p8-title); }

  .res-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    cursor: pointer;
    padding: 1.5px 3px;
    border-radius: 5px;
    transition: background 0.12s ease;
  }
  .res-row:hover {
    background: var(--row-hover-bg);
  }
  .res-label {
    font-size: 9px;
    font-weight: 700;
    color: var(--txt-sub);
  }
  .res-val {
    font-size: 10.5px;
    font-weight: 900;
    color: var(--txt-main);
    font-variant-numeric: tabular-nums;
  }
  .res-val.copied {
    color: var(--copied-fg);
    font-size: 9.5px;
  }

  @media (max-width: 480px) {
    body {
      padding: 2px;
    }
    .calc-card {
      border-radius: 16px;
      padding: 9px 10px;
      gap: 5.5px;
    }
    .price-input {
      padding: 5px 22px 5px 8px;
      font-size: 11px;
    }
    .party-box {
      border-radius: 9px;
      padding: 5px 7px;
      gap: 3px;
    }
    .res-val {
      font-size: 10px;
    }
  }
</style>
</head>
<body>
  <div class="calc-card">
    <div class="c-head">
      <span class="c-badge">경매</span>
      <button type="button" class="c-clear" onclick="resetCalc()" title="초기화">↻</button>
    </div>

    <div class="input-wrap">
      <input
        type="text"
        inputmode="numeric"
        class="price-input"
        id="priceInput"
        placeholder="거래소 시세"
        oninput="onPriceInput(this)"
        onfocus="onPriceFocus(this)"
        onblur="onPriceBlur(this)"
      >
      <span class="unit-g">G</span>
    </div>

    <div class="party-box p4">
      <div class="p-title">4인</div>
      <div class="res-row" onclick="copyNum('p4Profit')">
        <span class="res-label">손익</span>
        <span class="res-val" id="p4Profit">0</span>
      </div>
      <div class="res-row" onclick="copyNum('p4Equal')">
        <span class="res-label">균등</span>
        <span class="res-val" id="p4Equal">0</span>
      </div>
    </div>

    <div class="party-box p8">
      <div class="p-title">8인</div>
      <div class="res-row" onclick="copyNum('p8Profit')">
        <span class="res-label">손익</span>
        <span class="res-val" id="p8Profit">0</span>
      </div>
      <div class="res-row" onclick="copyNum('p8Equal')">
        <span class="res-label">균등</span>
        <span class="res-val" id="p8Equal">0</span>
      </div>
    </div>
  </div>

<script>
  (function applyThemeParam() {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();

  const values = { p4Profit: 0, p4Equal: 0, p8Profit: 0, p8Equal: 0 };

  function onPriceInput(el) {
    const raw = el.value.replace(/[^0-9]/g, "");
    const num = raw ? parseInt(raw, 10) : 0;
    updateValues(num);
  }

  function onPriceFocus(el) {
    const raw = el.value.replace(/[^0-9]/g, "");
    el.value = raw;
  }

  function onPriceBlur(el) {
    const raw = el.value.replace(/[^0-9]/g, "");
    if (!raw) {
      el.value = "";
      updateValues(0);
      return;
    }
    const num = parseInt(raw, 10);
    el.value = num.toLocaleString();
    updateValues(num);
  }

  function updateValues(price) {
    const eq4 = Math.floor(price * 0.95 * 0.75);
    const pr4 = Math.floor(eq4 / 1.1);

    const eq8 = Math.floor(price * 0.95 * 0.875);
    const pr8 = Math.floor(eq8 / 1.1);

    values.p4Profit = pr4;
    values.p4Equal = eq4;
    values.p8Profit = pr8;
    values.p8Equal = eq8;

    document.getElementById("p4Profit").textContent = pr4.toLocaleString();
    document.getElementById("p4Equal").textContent = eq4.toLocaleString();
    document.getElementById("p8Profit").textContent = pr8.toLocaleString();
    document.getElementById("p8Equal").textContent = eq8.toLocaleString();
  }

  function resetCalc() {
    const input = document.getElementById("priceInput");
    input.value = "";
    updateValues(0);
    input.focus();
  }

  function copyNum(key) {
    const val = values[key];
    if (!val) return;
    const el = document.getElementById(key);
    const orig = val.toLocaleString();

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(String(val)).catch(() => {});
    }
    el.textContent = "복사됨!";
    el.classList.add("copied");
    setTimeout(() => {
      el.textContent = orig;
      el.classList.remove("copied");
    }, 900);
  }
</script>
</body>
</html>
